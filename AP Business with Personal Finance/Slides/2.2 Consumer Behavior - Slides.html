<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="q5--the-straw-ordinance">Q5 — The straw ordinance</h2>
<p>A city ordinance bars restaurants from handing out single-use plastic straws. Within a year, local stores stock <strong>paper and metal straws</strong>, and reusable-straw sales climb. Which best explains the change in purchasing patterns?</p>
<ul>
<li>A. <strong>Legal restrictions can give rise to substitute products</strong> as consumers find new ways to meet an existing need</li>
<li>B. The ordinance <strong>eliminated the need</strong> the product served, so demand disappeared</li>
<li>C. The change is a <strong>situational influence</strong>, because store layouts shifted</li>
<li>D. <strong>Consumer protection laws require</strong> every banned product to be replaced by a licensed alternative</li>
</ul>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="59" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="q5--answer-a">Q5 — Answer: <strong>A</strong></h2>
<p><strong>Why:</strong> When a law makes a product <strong>harder to obtain, the want it served survives</strong> → consumers find <strong>substitutes</strong> and businesses arrive to sell them. (The straw leaves, the drink stays; paper and metal fill the gap.)</p>
<p><strong>Traps:</strong></p>
<ul>
<li><strong>B</strong> breaks the chain at the <strong>wrong link</strong>: the ordinance changed <strong>availability</strong>, and the underlying want persisted <strong>untouched.</strong></li>
<li><strong>C</strong> borrows a <strong>neighboring factor family</strong>: situational influences are <strong>temporary</strong> (noise, lighting, timing); an ordinance is a <strong>legal factor</strong> that <strong>holds until repealed.</strong></li>
</ul>
<blockquote>
<p><strong>When the law removes a product, the need remains, and substitutes appear to serve it.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="60" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="q6--the-candle-shop">Q6 — The candle shop</h2>
<p>A candle shop plays <strong>quiet music</strong>, keeps the <strong>lighting warm</strong>, and sets <strong>open testers</strong> by the entrance so shoppers smell the candles immediately. Shoppers who came in to browse frequently leave with a purchase. Which best identifies the factor influencing these purchases?</p>
<ul>
<li>A. A <strong>personal</strong> factor (occupation and budget)</li>
<li>B. A <strong>social and cultural</strong> factor (peers set the norm)</li>
<li>C. A <strong>situational influence</strong> (store design creates temporary conditions that encourage buying)</li>
<li>D. A <strong>psychological</strong> factor (the store changes each shopper's values and beliefs)</li>
</ul>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="61" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="q6--answer-c">Q6 — Answer: <strong>C</strong></h2>
<p><strong>Why:</strong> Situational influences = <strong>temporary conditions</strong> that encourage/discourage buying, created by <strong>store design</strong> (noise, lighting, organization), timing, and product availability. The music, warmth, and testers work on the shopper <strong>only while she stands inside them.</strong></p>
<p><strong>Trap: D</strong> — the test is <strong>what changed:</strong> the store adjusted the shopper's <strong>surroundings for twenty minutes</strong>, and her <strong>values and beliefs walked out the same as they walked in.</strong></p>
<blockquote>
<p><strong>If it changes when the shopper walks out the door, it's situational. If it travels home with the product, it isn't.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="62" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="trap-patterns-to-watch">Trap patterns to watch</h2>
<table>
<thead>
<tr>
<th>#</th>
<th>Trap</th>
<th>Where</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td>Sort principles by <strong>mechanism</strong>: authority = expert/credentials, consensus = many buyers' behavior, unity = membership</td>
<td>Q1</td>
</tr>
<tr>
<td>2</td>
<td><strong>Reciprocity vs. liking vs. consistency</strong> — the engine is the <strong>obligation</strong> planted, not rapport or identity</td>
<td>Q2</td>
</tr>
<tr>
<td>3</td>
<td><strong>Same principle, honest vs. manipulative</strong> — true rarity = scarcity too; &quot;only when invented&quot; = absolute tell</td>
<td>Q3</td>
</tr>
<tr>
<td>4</td>
<td>Data table = <strong>habitual pattern</strong> (timing/frequency/quantity); one month ≠ <strong>lifetime value</strong></td>
<td>Q4</td>
</tr>
<tr>
<td>5</td>
<td><strong>Laws create substitutes; the need persists;</strong> an ordinance is <strong>legal</strong>, not <strong>situational</strong></td>
<td>Q5</td>
</tr>
<tr>
<td>6</td>
<td><strong>Situational vs. psychological</strong> — what <em>changed</em>? surroundings for 20 min ≠ values/beliefs</td>
<td>Q6</td>
</tr>
</tbody>
</table>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-class="lead" data-theme="default" class="lead" data-marpit-pagination="63" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--class:lead;--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>

<h2 id="wrap-up">Wrap-up</h2>
<ul>
<li><strong>Why consumers buy:</strong> needs/wants + four tiebreakers (price, features, availability, advertising)</li>
<li><strong>Rational vs. habitual:</strong> match depth to stakes</li>
<li><strong>Four families:</strong> personal, psychological, social/cultural, situational (temporary, not product features)</li>
<li><strong>Purchasing pattern</strong> = timing + frequency + quantity; <strong>laws create substitutes</strong>; <strong>technology reshapes both sides</strong></li>
<li><strong>Seven Cialdini principles</strong> — each has an honest and a manipulative version</li>
<li><strong>Face test:</strong> say the tactic to the customer's face — does it survive?</li>
</ul>
<h3 id="next-23-market-research">Next: 2.3 Market Research</h3>
<p><em>Theo is certain the orange tag sells bikes for more money, faster — but he has zero evidence. How would he actually test it?</em></p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
