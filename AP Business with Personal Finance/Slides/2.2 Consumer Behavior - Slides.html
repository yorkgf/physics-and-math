<h2 id="todays-goals">Today's goals</h2>
<p>By the end of this lesson you can:</p>
<ol>
<li>Explain <strong>why and how</strong> consumers make purchasing decisions, including the four families of influence <strong>(LO 2.2.A)</strong></li>
<li>Describe how <strong>laws and technology</strong> reshape purchasing patterns <strong>(LO 2.2.B)</strong></li>
<li>Evaluate sales tactics built on <strong>Cialdini's seven principles of influence</strong> — and design one you can defend <strong>(LO 2.2.C)</strong></li>
</ol>
<p><strong>Running example continues:</strong> Theo / Trued Cycles — the sales lie he refused to tell.</p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>

<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="the-line-theo-refused">The line Theo refused</h2>
<p>Saturday at the flea market. A father circles a <strong>$95 commuter bike</strong> for the third time without reaching for his wallet.</p>
<p>The vendor two racks over leans in and offers Theo the oldest trick in used sales:</p>
<blockquote>
<p><em>&quot;Tell him three other people are coming to see it this afternoon.&quot;</em></p>
</blockquote>
<p>Nobody else is coming — and Theo knows it.</p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="4" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="what-theo-does-instead">What Theo does instead</h2>
<p>He flips up the <strong>orange tag</strong> zip-tied to the handlebars and reads the man all <strong>21 points</strong> of the inspection (brakes to bottom bracket), then taps the <strong>30-day tune-up promise</strong> printed at the bottom.</p>
<p><strong>The father buys the bike.</strong></p>
<blockquote>
<p>This topic explains <strong>why</strong> he said yes — and why the honest version <strong>outsold</strong> the lie.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="5" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="lo-22a--why-consumers-buy">LO 2.2.A — Why consumers buy</h2>
<h3 id="ek-22a1">EK 2.2.A.1</h3>
<p>Consumers buy goods and services to <strong>meet basic needs and wants.</strong></p>
<p>The father <em>needs</em> his kid transported to school and <em>wants</em> that on a bike the kid will actually ride.</p>
<p>Most needs have <strong>rival goods</strong> circling them — multiple products that can meet the same need.</p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="6" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="four-tiebreakers">Four tiebreakers</h2>
<p>When rivals exist, <strong>four things break the tie:</strong></p>
<table>
<thead>
<tr>
<th>Tiebreaker</th>
<th>How it pulls the father</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Price</strong></td>
<td>a comparable new bike costs about <strong>twice</strong> Theo's price</td>
</tr>
<tr>
<td><strong>Differentiated features</strong></td>
<td>the signed inspection tag + the 30-day tune-up promise — no factory-fresh rival carries these</td>
</tr>
<tr>
<td><strong>Availability</strong></td>
<td>his bike rolls home <strong>today</strong>; an online order ships next week</td>
</tr>
<tr>
<td><strong>Advertising</strong></td>
<td>the listing that brought him to the stall — putting the product in front of the right person</td>
</tr>
</tbody>
</table>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="7" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="rational-vs-habitual-decisions">Rational vs. habitual decisions</h2>
<h3 id="ek-22a2">EK 2.2.A.2</h3>
<p>How carefully a consumer chooses depends on <strong>what a mistake would cost.</strong></p>
<ul>
<li><strong>Consequential purchases</strong> (a home, a car, a first bike for a kid riding to school in traffic): consumers use a <strong>rational decision-making process</strong> — list the alternatives, compare them systematically, pick the best fit</li>
<li><strong>Small routine purchases</strong> (the coffee on the way to work, the same gum at the same register): run on <strong>habit</strong> with no comparison at all</li>
</ul>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="8" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="worked-example--true-cost-comparison">Worked example — true cost comparison</h2>
<p>A parent spends three evenings on listings and finds an <strong>untagged $75 rival</strong> to Theo's <strong>$95</strong> commuter.</p>
<p>The rival comes with <strong>no inspection</strong>, and a shop charges about <strong>$25</strong> to check the brakes.</p>
<p><mjx-container class="MathJax" jax="SVG" display="true" style="margin: 0;"><svg style="vertical-align: -0.186ex; display: block; width: 100%; height: auto; max-height: 1.882ex;" xmlns="http://www.w3.org/2000/svg" width="17.095ex" height="1.882ex" role="img" focusable="false" viewBox="0 -750 7556 832"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="24" d="M162 187Q162 164 146 149T109 133H103V130Q108 115 115 105Q122 92 131 82T150 64T170 52T190 44T206 40T220 37L227 36V313Q190 320 162 335Q116 358 86 404T55 508Q55 567 85 614T165 685Q186 696 225 704H227V750H273V704L286 703Q369 690 413 631Q441 588 444 531Q444 514 443 509Q439 490 425 479T391 468Q368 468 353 483T337 522Q337 546 353 560T390 575L394 576V578Q386 599 372 614T342 637T314 649T288 656L273 658V408L288 405Q329 394 355 376Q396 348 420 300T444 199Q444 130 408 76T313 1Q286 -9 276 -9H273V-56H227V-10H221Q202 -6 193 -4T155 11T108 41T74 94T55 176V182Q55 227 95 238Q103 240 108 240Q129 240 145 226T162 187ZM225 657Q219 657 204 651T169 632T135 594T121 538Q121 512 131 491T156 457T187 435T213 423T227 420V539Q227 657 225 657ZM378 169Q378 230 339 265T274 301Q273 301 273 169V37Q324 50 351 87T378 169Z"></path></g><g data-mml-node="mn" transform="translate(500,0)"><path data-c="37" d="M55 458Q56 460 72 567L88 674Q88 676 108 676H128V672Q128 662 143 655T195 646T364 644H485V605L417 512Q408 500 387 472T360 435T339 403T319 367T305 330T292 284T284 230T278 162T275 80Q275 66 275 52T274 28V19Q270 2 255 -10T221 -22Q210 -22 200 -19T179 0T168 40Q168 198 265 368Q285 400 349 489L395 552H302Q128 552 119 546Q113 543 108 522T98 479L95 458V455H55V458Z"></path><path data-c="35" d="M164 157Q164 133 148 117T109 101H102Q148 22 224 22Q294 22 326 82Q345 115 345 210Q345 313 318 349Q292 382 260 382H254Q176 382 136 314Q132 307 129 306T114 304Q97 304 95 310Q93 314 93 485V614Q93 664 98 664Q100 666 102 666Q103 666 123 658T178 642T253 634Q324 634 389 662Q397 666 402 66 249 666Q297 666 345 640T423 548Q460 465 460 320Q460 165 417 83Q397 41 362 16T301 -15T250 -22Q224 -22 198 -16T137 16T82 83Q39 165 39 320Q39 494 96 585ZM321 597Q291 629 250 629Q208 629 178 597Q153 571 145 525T137 333Q137 175 145 125T181 46Q209 16 250 16Q290 16 318 46Q347 76 354 130T362 333Q362 478 354 524T321 597Z" transform="translate(500,0)"></path><path data-c="30" d="M96 585Q152 666 249 666Q297 666 345 640T423 548Q460 465 460 320Q460 165 417 83Q397 41 362 16T301 -15T250 -22Q224 -22 198 -16T137 16T82 83Q39 165 39 320Q39 494 96 585ZM321 597Q291 629 250 629Q208 629 178 597Q153 571 145 525T137 333Q137 175 145 125T181 46Q209 16 250 16Q290 16 318 46Q347 76 354 130T362 333Q362 478 354 524T321 597Z" transform="translate(1000,0)"></path></g></g></g></svg></mjx-container></p><p>The tagged bike <strong>wins by $5</strong> — even though the sticker price pointed the other way.</p>
<blockquote>
<p>Three evenings of searching surfaced that reversal — a <strong>sane trade for a bike and an absurd one for gum.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="9" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="match-depth-to-stakes">Match depth to stakes</h2>
<table>
<thead>
<tr>
<th>Purchase type</th>
<th>Process</th>
<th>Cost of the process</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Consequential</strong> (bike, car, home)</td>
<td>Rational — compare alternatives systematically</td>
<td>Mostly <strong>time</strong> spent gathering information</td>
</tr>
<tr>
<td><strong>Routine</strong> (coffee, gum)</td>
<td>Habitual — no comparison</td>
<td>Almost <strong>zero</strong></td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>Match the depth of the process to the size of the decision.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="10" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="why-rational-matters--the-search-cost">Why rational matters — the search cost</h2>
<p>The rational process &quot;charges&quot; for the search <strong>mostly in time spent gathering information.</strong></p>
<p>Theo's buyer spent <strong>three evenings</strong> comparing listings to find the $75 rival. That time investment makes sense for a <strong>$95 bike</strong> — but would be absurd for a <strong>$1.50 pack of gum.</strong></p>
<blockquote>
<p><strong>The search cost must be proportionate to the stakes.</strong> A rational process for every purchase would paralyze the buyer.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="11" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="four-families-of-influence">Four families of influence</h2>
<h3 id="ek-22a3%E2%80%9322a6">EK 2.2.A.3–2.2.A.6</h3>
<p>Four families of factors shape buying decisions:</p>
<table>
<thead>
<tr>
<th>Family</th>
<th>Where it lives</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Personal</strong></td>
<td><strong>who</strong> the buyer is</td>
</tr>
<tr>
<td><strong>Psychological</strong></td>
<td><strong>what</strong> the buyer thinks</td>
</tr>
<tr>
<td><strong>Social &amp; cultural</strong></td>
<td><strong>who surrounds</strong> the buyer</td>
</tr>
<tr>
<td><strong>Situational</strong></td>
<td><strong>where and when</strong> the buying happens</td>
</tr>
</tbody>
</table>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="12" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="personal-factors">Personal factors</h2>
<h3 id="ek-22a3">EK 2.2.A.3</h3>
<p>Facts of the buyer's own life:</p>
<p><strong>Age, sex, education, occupation, income level, budget, lifestyle.</strong></p>
<p>They set what a consumer needs, wants, and can afford.</p>
<blockquote>
<p>Renee's profile card (from 2.1) is a stack of personal factors: 41 years old, a $90 budget, a middle schooler who needs to reach campus by bell time. Her <strong>income sets the ceiling</strong>; her <strong>kid's age sets the frame size.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="13" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="personal-factors--examples-at-theos-stall">Personal factors — examples at Theo's stall</h2>
<table>
<thead>
<tr>
<th>Factor</th>
<th>How it applies</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Age</strong></td>
<td>Renee is 41 — old enough to have a middle schooler</td>
</tr>
<tr>
<td><strong>Income / budget</strong></td>
<td>$90 ceiling — sets what she can spend</td>
</tr>
<tr>
<td><strong>Occupation</strong></td>
<td>works near the school — needs the bike by Saturday</td>
</tr>
<tr>
<td><strong>Lifestyle</strong></td>
<td>drives everywhere but wants her kid to ride</td>
</tr>
</tbody>
</table>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="14" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="psychological-factors">Psychological factors</h2>
<h3 id="ek-22a4">EK 2.2.A.4</h3>
<p>Inside the buyer's head:</p>
<p><strong>Values and beliefs, perceptions, learning, individual motivations.</strong></p>
<table>
<thead>
<tr>
<th>Factor</th>
<th>Meaning</th>
<th>Theo's stall</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Values</strong></td>
<td>what matters most</td>
<td>Renee values <strong>safety over speed</strong></td>
</tr>
<tr>
<td><strong>Perception</strong></td>
<td>how a product reads <strong>before the facts arrive</strong></td>
<td>used bikes read as <strong>risky</strong> — the orange tag corrects that</td>
</tr>
<tr>
<td><strong>Learning</strong></td>
<td>associations from <strong>prior experience</strong></td>
<td>a parent whose last secondhand bike snapped a chain arrives carrying an association Theo must outweigh</td>
</tr>
<tr>
<td><strong>Motivation</strong></td>
<td>the <strong>push</strong> behind the purchase</td>
<td>hers is a <strong>Saturday deadline</strong></td>
</tr>
</tbody>
</table>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="15" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="social-and-cultural-factors">Social and cultural factors</h2>
<h3 id="ek-22a5">EK 2.2.A.5</h3>
<p>From other people:</p>
<p><strong>Peers, family, social status, cultural norms, media.</strong></p>
<p>They define what feels acceptable, desirable, or appropriate to buy.</p>
<blockquote>
<p>When three families at school pickup mention the same stall, buying there becomes the <strong>normal</strong> move. At the school bike rack, a clean rebuilt commuter carries a little <strong>status</strong> of its own. The pickup photos Theo posts (with permission) are <strong>media</strong> doing the same work at scale.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="16" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="situational-influences">Situational influences</h2>
<h3 id="ek-22a6">EK 2.2.A.6</h3>
<p>Temporary conditions around the moment of purchase:</p>
<p><strong>Store design (noise, lighting, organization), timing, product availability.</strong></p>
<blockquote>
<p>A flea market is loud and cluttered, so Theo's rack <strong>fights the setting</strong>: three tiers in a straight line, tags facing out, a clear lane for test rides. A sunny back-to-school Saturday encourages buying; a rainy one discourages it — <strong>the bikes are identical both days.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="17" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="situational--the-exam-warning">Situational — the exam warning</h2>
<blockquote>
<p><strong>Situational influences are temporary conditions around the purchase — not features of the product.</strong></p>
</blockquote>
<p>The candle shop plays quiet music and keeps the lighting warm → <strong>situational</strong> (surroundings change for 20 minutes).</p>
<p>The candle is made of soy wax → <strong>not situational</strong> (that's a product feature).</p>
<blockquote>
<p><strong>If it changes when the shopper walks out the door, it's situational. If it travels home with the product, it isn't.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="18" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="exam-signal--the-four-family-question">Exam signal — the four-family question</h2>
<p>The exam will describe a scenario and ask: <strong>which family of influence?</strong></p>
<p><strong>Method:</strong></p>
<ol>
<li><strong>Read the scenario</strong> — find the factor acting on the buyer</li>
<li><strong>Ask the sorting question</strong> — census trait? contents of mind? other people? temporary surroundings?</li>
<li><strong>Eliminate</strong> — if it's not a census trait, it's not personal; if other people aren't involved, it's not social</li>
</ol>
<blockquote>
<p><strong>&quot;Store design&quot; and &quot;lighting&quot; always point to situational. &quot;Values&quot; and &quot;beliefs&quot; always point to psychological. Don't overthink it.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="19" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="your-turn--sort-the-four-families">Your turn — sort the four families</h2>
<p>A shopper at Theo's stall:</p>
<ol>
<li>Is a 41-year-old parent with a $90 budget → <strong>?</strong></li>
<li>Values safety over price → <strong>?</strong></li>
<li>Heard from three other parents at pickup that the stall is good → <strong>?</strong></li>
<li>Arrives on a sunny Saturday with the stall well-organized → <strong>?</strong></li>
</ol>
<p><em>Sort each into: personal, psychological, social/cultural, or situational.</em></p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="20" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="your-turn--answers">Your turn — answers</h2>
<ol>
<li>41 years old, $90 budget → <strong>Personal</strong> (who the buyer is)</li>
<li>Values safety over price → <strong>Psychological</strong> (what the buyer thinks)</li>
<li>Three parents at pickup → <strong>Social &amp; cultural</strong> (who surrounds the buyer)</li>
<li>Sunny Saturday, organized stall → <strong>Situational</strong> (where and when — temporary)</li>
</ol>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="21" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="four-family-sorting-key--exam-reference">Four-family sorting key — exam reference</h2>
<table>
<thead>
<tr>
<th>Family</th>
<th>Where it lives</th>
<th>Sorting question</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Personal</strong></td>
<td><strong>who</strong> the buyer is (age, income, budget, occupation, lifestyle)</td>
<td>Could a <strong>census form</strong> record it?</td>
</tr>
<tr>
<td><strong>Psychological</strong></td>
<td><strong>what</strong> the buyer thinks (values, beliefs, perceptions, learning, motivation)</td>
<td>Does it describe <strong>what a person cares about</strong>?</td>
</tr>
<tr>
<td><strong>Social &amp; cultural</strong></td>
<td><strong>who surrounds</strong> the buyer (peers, family, status, norms, media)</td>
<td>Does the influence come from <strong>other people</strong>?</td>
</tr>
<tr>
<td><strong>Situational</strong></td>
<td><strong>where and when</strong> the buying happens (store design, timing, availability)</td>
<td>Is it <strong>temporary</strong> — does it change when the shopper leaves?</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>The four-family sort lives on the real exam. Memorize the &quot;where it lives&quot; column.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="22" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="lo-22b--purchasing-patterns">LO 2.2.B — Purchasing patterns</h2>
<h3 id="ek-22b1">EK 2.2.B.1</h3>
<p>A <strong>purchasing pattern</strong> = a consumer's typical routine for buying, described by:</p>
<table>
<thead>
<tr>
<th>Dimension</th>
<th>What it measures</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Timing</strong></td>
<td>when the purchase happens</td>
</tr>
<tr>
<td><strong>Frequency</strong></td>
<td>how often</td>
</tr>
<tr>
<td><strong>Quantity</strong></td>
<td>how much per purchase</td>
</tr>
</tbody>
</table>
<p>Where a person lives/works, income level, and the patterns of family/friends all help set it.</p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="23" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="purchasing-patterns--theos-ledger">Purchasing patterns — Theo's ledger</h2>
<table>
<thead>
<tr>
<th>Dimension</th>
<th>What Theo's ledger shows</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Timing</strong></td>
<td>clustered in <strong>late August</strong> (back to school)</td>
</tr>
<tr>
<td><strong>Frequency</strong></td>
<td>every <strong>few years per kid</strong> (one bike per growth spurt)</td>
</tr>
<tr>
<td><strong>Quantity</strong></td>
<td><strong>one bike at a time</strong></td>
</tr>
</tbody>
</table>
<blockquote>
<p>Local families buy one bike at a time, every few years per kid, clustered in late August, from a stall a short drive from home.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="24" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="purchasing-patterns--the-exam-method">Purchasing patterns — the exam method</h2>
<p>When the exam gives you a <strong>data table</strong> and asks about purchasing patterns:</p>
<ol>
<li><strong>Check timing</strong> — when do purchases happen? (same time each day? seasonal?)</li>
<li><strong>Check frequency</strong> — how often? (daily? weekly? yearly?)</li>
<li><strong>Check quantity</strong> — how much per purchase? (one item? bulk?)</li>
<li><strong>If all three are steady</strong> → habitual pattern</li>
<li><strong>If any vary</strong> → not habitual; possibly rational</li>
</ol>
<blockquote>
<p><strong>A table that shows consistent timing + frequency + quantity = habitual. Don't add what the table doesn't show.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="25" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="laws-bend-patterns">Laws bend patterns</h2>
<h3 id="ek-22b2">EK 2.2.B.2</h3>
<p>Laws regulate <strong>what</strong> consumers can buy and <strong>when/where</strong> they can buy it:</p>
<ul>
<li>Many places require <strong>helmets</strong> for young riders → a kids' bike sale tends to pull a helmet sale along behind it</li>
<li><strong>Consumer protection laws</strong> help people avoid fraudulent or unsafe products → reselling a recalled children's product can break the law, so checking recall lists is the <strong>first point</strong> on Theo's 21-point inspection</li>
<li>Legal factors also give rise to <strong>substitutes</strong> — when a product gets harder to obtain, consumers find another way to meet the need</li>
</ul>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="26" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="laws-create-substitutes">Laws create substitutes</h2>
<p>When a law makes a product harder to obtain, <strong>the need persists</strong> and substitutes appear:</p>
<table>
<thead>
<tr>
<th>Law</th>
<th>Substitutes that appeared</th>
</tr>
</thead>
<tbody>
<tr>
<td>Cities restrict rental scooters</td>
<td>some riders <strong>substitute bicycles</strong></td>
</tr>
<tr>
<td>Single-use plastic straw ban</td>
<td>paper and metal straws fill the gap</td>
</tr>
<tr>
<td>Helmet requirement for young riders</td>
<td>helmet sales rise alongside bike sales</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>The law changes availability. The need stays the same. Businesses arrive to serve it with something else.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="27" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="technology-rewrites-patterns">Technology rewrites patterns</h2>
<h3 id="ek-22b3">EK 2.2.B.3</h3>
<p>Innovation keeps making new products accessible:</p>
<ul>
<li>The <strong>internet</strong> reaching homes in the <strong>1990s</strong> moved shopping, information, and entertainment online</li>
<li><strong>Smartphones</strong> spreading in the <strong>2010s</strong> put all three in every pocket</li>
<li><strong>Trued Cycles only exists inside that shift</strong> — Theo learned repairs from free videos, sells through a marketplace app, and watches parents check his price against new-bike prices on their phones</li>
</ul>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="28" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="technology--both-sides-of-the-sale">Technology — both sides of the sale</h2>
<blockquote>
<p><strong>Technology changes patterns on both sides of the sale.</strong></p>
</blockquote>
<table>
<thead>
<tr>
<th>Side</th>
<th>How technology changed it</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Seller reach</strong></td>
<td>Theo lists on a marketplace app → reaches buyers he'd never meet at the flea market</td>
</tr>
<tr>
<td><strong>Buyer information</strong></td>
<td>parents compare Theo's price to new-bike prices on their phones <strong>while standing at his stall</strong></td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>Exam point:</strong> a question about technology affecting &quot;how consumers shop&quot; and &quot;how businesses reach customers&quot; is testing <strong>both sides</strong> — don't name only one.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="29" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="technology--theos-stall">Technology — Theo's stall</h2>
<table>
<thead>
<tr>
<th>Technology</th>
<th>Effect on Theo's business</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Marketplace app</strong></td>
<td>reaches buyers he'd never meet at the flea market</td>
</tr>
<tr>
<td><strong>Free repair videos</strong></td>
<td>taught him the skills — no trade school needed</td>
</tr>
<tr>
<td><strong>Smartphone price checks</strong></td>
<td>parents verify his price vs. new bikes <strong>in real time</strong></td>
</tr>
<tr>
<td><strong>Messaging apps</strong></td>
<td>30-day tune-up reminders sent with one tap</td>
</tr>
</tbody>
</table>
<blockquote>
<p>Every row is technology changing <strong>seller reach</strong>, <strong>buyer information</strong>, or <strong>both.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="30" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="lo-22c--seven-principles-of-influence">LO 2.2.C — Seven principles of influence</h2>
<h3 id="ek-22c1%E2%80%938">EK 2.2.C.1–8</h3>
<p>Psychologist <strong>Robert Cialdini</strong> cataloged the principles of influence — psychological factors that lead people to comply with a request. Marketers build sales tactics on them.</p>
<blockquote>
<p><strong>Every principle has an honest application and a manipulative one.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="31" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="the-seven-principles--table">The seven principles — table</h2>
<table>
<thead>
<tr>
<th>Principle</th>
<th>What it is</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Scarcity</strong></td>
<td>the rarer an item seems, the more people want it</td>
</tr>
<tr>
<td><strong>Authority</strong></td>
<td>people follow authority figures and credentials</td>
</tr>
<tr>
<td><strong>Consensus</strong> (social proof)</td>
<td>people follow the norms of their group</td>
</tr>
<tr>
<td><strong>Liking</strong></td>
<td>people are more easily influenced by someone they like</td>
</tr>
<tr>
<td><strong>Reciprocity</strong></td>
<td>people feel obliged to give back after receiving value</td>
</tr>
<tr>
<td><strong>Consistency</strong></td>
<td>people repeat behavior that matches their self-image</td>
</tr>
<tr>
<td><strong>Unity</strong></td>
<td>when people feel part of a group, the group's influence grows</td>
</tr>
</tbody>
</table>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="32" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="how-to-sort-the-seven-principles">How to sort the seven principles</h2>
<p>The exam gives you a scenario and asks <strong>which principle.</strong> Sort by the <strong>mechanism</strong>, not the keyword:</p>
<table>
<thead>
<tr>
<th>Principle</th>
<th>Mechanism</th>
<th>Sorting question</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Scarcity</strong></td>
<td>perceived rarity</td>
<td>Is the item presented as <strong>limited or one-of-a-kind</strong>?</td>
</tr>
<tr>
<td><strong>Authority</strong></td>
<td>expert credentials</td>
<td>Does an <strong>expert or credential</strong> endorse it?</td>
</tr>
<tr>
<td><strong>Consensus</strong></td>
<td>many buyers' behavior</td>
<td>Do <strong>many other people</strong> already buy or approve?</td>
</tr>
<tr>
<td><strong>Liking</strong></td>
<td>rapport / relatability</td>
<td>Does the seller feel <strong>friendly or relatable</strong>?</td>
</tr>
<tr>
<td><strong>Reciprocity</strong></td>
<td>obligation from receiving</td>
<td>Did the buyer <strong>receive something free</strong> first?</td>
</tr>
<tr>
<td><strong>Consistency</strong></td>
<td>self-image match</td>
<td>Does the tactic appeal to <strong>who the buyer believes they are</strong>?</td>
</tr>
<tr>
<td><strong>Unity</strong></td>
<td>group membership</td>
<td>Does the buyer feel like <strong>part of a group</strong>?</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>The word in the answer choice is unreliable. The engine decides.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="33" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="scarcity--theos-honest-version">Scarcity — Theo's honest version</h2>
<p><strong>Scarcity</strong> = the rarer an item seems, the more people want it.</p>
<table>
<thead>
<tr>
<th>Honest version</th>
<th>Manipulative version</th>
</tr>
</thead>
<tbody>
<tr>
<td>every used bike really <strong>is</strong> one of one — no invention needed</td>
<td>the vendor's <em>&quot;three other buyers&quot;</em> line is scarcity <strong>faked</strong></td>
</tr>
</tbody>
</table>
<blockquote>
<p>True scarcity costs nothing when checked. Faked scarcity dies the moment a buyer asks <em>&quot;who?&quot;</em></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="34" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="authority--theos-honest-version">Authority — Theo's honest version</h2>
<p><strong>Authority</strong> = people follow authority figures, expert spokespeople, and credentials.</p>
<table>
<thead>
<tr>
<th>Honest version</th>
<th>Manipulative version</th>
</tr>
</thead>
<tbody>
<tr>
<td>the <strong>signed orange tag</strong> — a documented 21-point inspection is a credential you can hold</td>
<td>a paid &quot;expert&quot; who isn't really an expert</td>
</tr>
</tbody>
</table>
<blockquote>
<p>The tag is a credential the buyer can <strong>physically hold and read.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="35" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="consensus--theos-honest-version">Consensus — Theo's honest version</h2>
<p><strong>Consensus</strong> (social proof) = people follow the norms of their group; promote positive feedback until a product feels widely liked.</p>
<table>
<thead>
<tr>
<th>Honest version</th>
<th>Manipulative version</th>
</tr>
</thead>
<tbody>
<tr>
<td>the <strong>permission-based pickup photos</strong> — a wall of local kids the next family can join</td>
<td>fake reviews</td>
</tr>
</tbody>
</table>
<blockquote>
<p>Two dozen photos of real local kids tell a browsing parent: <strong>people like you already chose here.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="36" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="liking--theos-honest-version">Liking — Theo's honest version</h2>
<p><strong>Liking</strong> = people are more easily influenced by someone they like or relate to.</p>
<table>
<thead>
<tr>
<th>Honest version</th>
<th>Manipulative version</th>
</tr>
</thead>
<tbody>
<tr>
<td>Theo is a <strong>local teenager</strong> who remembers each kid and explains brake pads in plain language</td>
<td>manufactured false rapport</td>
</tr>
</tbody>
</table>
<blockquote>
<p>He doesn't pretend to be something he isn't — he <strong>is</strong> the neighbor kid who fixes bikes.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="37" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="reciprocity--theos-honest-version">Reciprocity — Theo's honest version</h2>
<p><strong>Reciprocity</strong> = people feel obliged to give back after receiving value (free trials, samples, gifts).</p>
<table>
<thead>
<tr>
<th>Honest version</th>
<th>Manipulative version</th>
</tr>
</thead>
<tbody>
<tr>
<td>he <strong>airs up tires and lubes the chain</strong> of whatever bike a browser rode in on — no charge</td>
<td>a &quot;gift&quot; that creates hidden obligation</td>
</tr>
</tbody>
</table>
<blockquote>
<p>The visitor leaves with a better bike than they arrived with — <strong>whether or not they buy.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="38" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="consistency--theos-honest-version">Consistency — Theo's honest version</h2>
<p><strong>Consistency</strong> = people repeat behavior that matches their <strong>self-image</strong>; appeal to identity.</p>
<table>
<thead>
<tr>
<th>Honest version</th>
<th>Manipulative version</th>
</tr>
</thead>
<tbody>
<tr>
<td>a listing that opens <em>&quot;for parents who put safety first&quot;</em> invites Renee to act like the person she believes she is</td>
<td>getting a small commitment, then exploiting it</td>
</tr>
</tbody>
</table>
<blockquote>
<p>The listing doesn't create a new identity — it <strong>names the one Renee already has.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="39" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="unity--theos-honest-version">Unity — Theo's honest version</h2>
<p><strong>Unity</strong> = when people feel part of a group, the group's influence grows; build community, invite co-creation.</p>
<table>
<thead>
<tr>
<th>Honest version</th>
<th>Manipulative version</th>
</tr>
</thead>
<tbody>
<tr>
<td>each kid <strong>picks the handlebar tape color</strong>; a fall <strong>group ride for &quot;Trued Families&quot;</strong> turns customers into members</td>
<td>manufactured in-group vs. out-group pressure</td>
</tr>
</tbody>
</table>
<blockquote>
<p>Customization + community event = customers become <strong>members.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="40" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="the-face-test">The Face Test</h2>
<h3 id="ek-22c8">EK 2.2.C.8</h3>
<p>The exam creators will ask you to <strong>judge</strong> a tactic and <strong>build</strong> one.</p>
<blockquote>
<p><strong>A tactic is worth keeping when the principle still works after full disclosure.</strong></p>
</blockquote>
<p>Theo's test: <strong>say the tactic to the customer's face and see if it survives.</strong></p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="41" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="face-test--why-it-works">Face Test — why it works</h2>
<p>The face test separates <strong>honest persuasion</strong> from <strong>deception:</strong></p>
<table>
<thead>
<tr>
<th></th>
<th>Honest tactic</th>
<th>Manipulative tactic</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Disclosure</strong></td>
<td>survives when the buyer knows how it works</td>
<td><strong>collapses</strong> when the buyer knows how it works</td>
</tr>
<tr>
<td><strong>Trust</strong></td>
<td>builds over time — returning shoppers come back</td>
<td><strong>erodes</strong> — one caught lie undoes months of goodwill</td>
</tr>
<tr>
<td><strong>Principle</strong></td>
<td>works because the underlying psychology is <strong>real</strong></td>
<td>works only because the buyer is <strong>misinformed</strong></td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>If the principle needs secrecy to function, it's manipulation. If it works in the open, it's persuasion.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="42" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="face-test--three-examples">Face Test — three examples</h2>
<table>
<thead>
<tr>
<th>Tactic</th>
<th>Face test</th>
</tr>
</thead>
<tbody>
<tr>
<td>&quot;This tag lists everything I checked&quot;</td>
<td><strong>survives</strong> — the buyer can read every point</td>
</tr>
<tr>
<td>&quot;Come back within 30 days and the tune-up is free&quot;</td>
<td><strong>survives</strong> — and reverses the risk that keeps used-bike buyers from saying yes</td>
</tr>
<tr>
<td>&quot;Three other people are coming this afternoon&quot;</td>
<td><strong>dies</strong> the moment a buyer asks <em>&quot;who?&quot;</em></td>
</tr>
</tbody>
</table>
<blockquote>
<p>One caught lie undoes the trust the signed checklist was built to earn — and <strong>trust is what converts these buyers.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="43" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="your-turn--design-a-tactic--face-test">Your turn — design a tactic + face test</h2>
<p>Design a sales tactic for Theo's stall:</p>
<ol>
<li><strong>Name the principle</strong> it draws on (scarcity, authority, consensus, liking, reciprocity, consistency, or unity)</li>
<li><strong>Describe the tactic</strong> — what does Theo actually do or say?</li>
<li><strong>Run the face test</strong> — can he say it to the buyer's face? Does the principle still work after full disclosure?</li>
</ol>
<p><em>Write your answer before moving on.</em></p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="44" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="your-turn--sample-answer">Your turn — sample answer</h2>
<p><strong>Principle:</strong> Reciprocity</p>
<p><strong>Tactic:</strong> Theo keeps a pump and chain lube at the stall. Any visitor who rode a bike there gets the tires aired up and the chain lubed — <strong>free, no purchase required.</strong></p>
<p><strong>Face test:</strong> &quot;I'm going to air up your tires and lube your chain before you go. No charge, whether you buy or not.&quot; The visitor <strong>still feels the obligation</strong> — the principle works in the open.</p>
<blockquote>
<p><strong>The obligation is real, the value is real, and the disclosure changes nothing.</strong> That's a tactic that passes the face test.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="45" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="exam-points-to-remember">Exam points to remember</h2>
<ul>
<li><strong>Needs/wants + rival goods</strong> broken by four tiebreakers: price, features, availability, advertising</li>
<li><strong>Rational vs. habitual:</strong> match depth to stakes; add the <strong>true cost of a cheaper rival</strong> ($75 + $25 = $100)</li>
<li><strong>Four families:</strong> personal, psychological, social/cultural, situational</li>
<li><strong>Situational = temporary conditions around the purchase, NOT product features</strong></li>
<li><strong>Purchasing pattern</strong> = timing, frequency, quantity</li>
<li><strong>Laws</strong> regulate what/when/where → create <strong>substitutes</strong>; the need persists</li>
<li><strong>Technology reshapes both sides</strong> — seller reach and buyer information</li>
<li><strong>Seven Cialdini principles:</strong> each has an <strong>honest</strong> and a <strong>manipulative</strong> application</li>
<li><strong>Face test:</strong> a tactic is worth keeping if the principle <strong>still works after full disclosure</strong></li>
</ul>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-class="invert" data-theme="default" class="invert" data-marpit-pagination="46" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--class:invert;--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>

<h1 id="practice--6-questions">Practice — 6 questions</h1>
<p><strong>3 on one stimulus (Cobalt Finch Ceramics)</strong> · <strong>3 standalone</strong></p>
<p>Read → pause → <strong>commit to an answer</strong> → then reveal.</p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="47" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="stimulus-cobalt-finch-ceramics">Stimulus: Cobalt Finch Ceramics</h2>
<p><strong>Ivy Santos</strong>, a high school senior, runs <strong>Cobalt Finch Ceramics</strong>, a stall selling handmade mugs at a monthly craft fair. <strong>Three other stalls sell mugs</strong>, so shoppers can meet the same want <strong>four ways</strong> and weigh price, glaze, and feel before choosing.</p>
<p>Behind her table Ivy pins a <strong>corkboard of short notes from past buyers</strong> describing their mugs in daily use (<strong>two dozen</strong> so far). At the front edge sits a <strong>dish of small glazed clay magnets, free</strong> to anyone who stops.</p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="48" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="stimulus--continued">Stimulus — continued</h2>
<p>The vendor at the next stall urges her to tell shoppers <strong>each design is the last one available</strong> — including designs with <strong>duplicates boxed under the table.</strong></p>
<p>Ivy declines the line, and letters a small card reading <strong>&quot;one of a kind&quot;</strong> for the three mugs whose copper glaze she cannot repeat.</p>
<p><em>Watch for: consensus (the corkboard), reciprocity (the free magnets), and scarcity (the honest card vs. the faked line).</em></p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="49" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="q1--the-corkboard-of-buyer-notes">Q1 — The corkboard of buyer notes</h2>
<p>The corkboard of buyer notes is best identified as a sales tactic built on which principle of influence?</p>
<ul>
<li>A. <strong>Authority</strong>, because the notes come from experienced mug owners</li>
<li>B. <strong>Liking</strong>, because the notes make the stall feel friendly</li>
<li>C. <strong>Consensus</strong>, because displayed customer feedback signals that many buyers like the product</li>
<li>D. <strong>Unity</strong>, because reading the notes makes shoppers part of a group</li>
</ul>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="50" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="q1--answer-c">Q1 — Answer: <strong>C</strong></h2>
<p><strong>Why:</strong> Consensus = individuals <strong>follow the norms of their social group</strong> → promoting positive customer feedback creates the sense that <strong>most buyers like the product.</strong> Two dozen notes from satisfied strangers tell a browsing shopper that <strong>people like her already chose these mugs.</strong></p>
<p><strong>Traps:</strong></p>
<ul>
<li><strong>A</strong> — the test is <strong>expertise.</strong> Authority persuades through <strong>experts and credentials</strong>; Ivy's note writers <strong>claim nothing beyond owning a mug.</strong></li>
<li><strong>D</strong> — overreads <strong>membership.</strong> Unity works when customers feel <strong>part of a group</strong>; reading strangers' notes <strong>confers no membership.</strong></li>
</ul>
<blockquote>
<p><strong>Consensus = what many buyers did. Authority = what a credentialed expert says. Unity = makes the buyer a member.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="51" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="q2--the-dish-of-free-magnets">Q2 — The dish of free magnets</h2>
<p>Which best explains how the dish of free magnets can increase mug sales?</p>
<ul>
<li>A. Receiving an item of value makes shoppers feel <strong>obligated to give something back</strong>, often a purchase</li>
<li>B. The magnets make shoppers <strong>like Ivy</strong>, and people buy from sellers they like</li>
<li>C. The magnets appeal to shoppers' <strong>self-image</strong> as supporters of young artists</li>
<li>D. The magnets make the mugs seem <strong>rarer</strong> than the rival stalls' mugs</li>
</ul>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="52" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="q2--answer-a">Q2 — Answer: <strong>A</strong></h2>
<p><strong>Why:</strong> <strong>Reciprocity</strong> = individuals feel obligated to reciprocate when given something of value (why marketers offer free samples, trials, gifts). A shopper who pockets a free magnet carries a small felt debt to the stall — <strong>buying a mug settles it.</strong></p>
<p><strong>Traps:</strong></p>
<ul>
<li><strong>B</strong> names a real <strong>side effect</strong> but the <strong>wrong engine</strong>: liking persuades through <strong>rapport/relatability</strong>; a giveaway's tested mechanism is the <strong>obligation</strong> it plants.</li>
<li><strong>C</strong> describes <strong>consistency</strong> (people repeat behavior matching their self-image); a magnet in a dish makes <strong>no identity claim.</strong></li>
</ul>
<blockquote>
<p><strong>A free item persuades through the obligation it creates = reciprocity.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="53" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="q3--refuse-the-line-keep-the-cards">Q3 — Refuse the line, keep the cards</h2>
<p>Which best explains Ivy's decision to refuse the vendor's line while keeping the one-of-a-kind cards?</p>
<ul>
<li>A. Scarcity persuades <strong>only</strong> when the seller invents the shortage, so the cards cannot motivate buyers</li>
<li>B. Refusing the line means Ivy has <strong>given up</strong> the scarcity principle entirely</li>
<li>C. Scarcity claims are <strong>prohibited</strong> at in-person markets</li>
<li>D. A <strong>true claim of rarity</strong> applies the scarcity principle honestly, while the false line risks deception and lost trust</li>
</ul>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="54" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="q3--answer-d">Q3 — Answer: <strong>D</strong></h2>
<p><strong>Why:</strong> Scarcity runs on <strong>perceived rarity</strong>; <strong>real rarity produces that perception honestly</strong> — so the card on an unrepeatable glaze keeps the persuasive pull <strong>and</strong> keeps the claim true. The false version invites the deception <strong>consumer protection laws exist to catch</strong>, and at a monthly fair with returning shoppers, <strong>one duplicate spotted in a box undoes months of corkboard trust.</strong></p>
<p><strong>Traps:</strong></p>
<ul>
<li><strong>A</strong> — the tell is the <strong>absolute.</strong> Nothing in the principle requires <strong>invention</strong>; a genuine shortage is the <strong>cleanest</strong> source of perceived rarity.</li>
<li><strong>B</strong> — fails on the stimulus: Ivy <strong>still labels</strong> the three unrepeatable mugs, so the principle stays in use <strong>where it is true.</strong></li>
</ul>
<blockquote>
<p><strong>A true rarity claim applies the same principle as a false one — and costs nothing when checked.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>

<h2 id="q4--purchasing-pattern-table">Q4 — Purchasing-pattern table</h2>

<tr>
<th></th>
<th>Week 1</th>
<th>Weeks 2–4</th>
</tr>
</thead>
<tbody>
<tr>
<td>Visits</td>
<td>5</td>
<td>5 each</td>
</tr>
<tr>

<td><strong>same</strong></td>
</tr>

<header>AP Business · 2.2 Consumer Behavior</header>
<h2 id="q4--answer-choices">Q4 — Answer choices</h2>
<ul>
<li>A. The member <strong>systematically evaluates</strong> rival coffee options before each visit</li>
<li>B. The purchases form a <strong>habitual purchasing pattern</strong> — consistent in timing, frequency, and quantity — totaling <strong>$80</strong> across the four weeks</li>
<li>C. The member's <strong>lifetime value</strong> to Bluestem is <strong>$80</strong></li>
<li>D. The app <strong>guarantees</strong> the member will keep buying five coffees a week</li>
</ul>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-header="AP Business · 2.2 Consumer Behavior" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="57" style="--paginate:true;--header:AP Business · 2.2 Consumer Behavior;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="63" data-size="16:9">
<header>AP Business · 2.2 Consumer Behavior</header>
