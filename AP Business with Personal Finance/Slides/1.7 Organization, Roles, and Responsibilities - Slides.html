<li><strong>Reorganizing as an LLC</strong></li>
<li><strong>Incorporating</strong> so they can <strong>sell shares</strong> to finance <strong>20 new vans</strong></li>
</ol>
<blockquote>
<p><strong>Watch for the artifacts:</strong> a spoken partnership, a liability event, and two structure-change options.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="60" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="q1--liability-for-the-ruined-jacket">Q1 — Liability for the ruined jacket</h2>
<p>Aiko and Jordan formed Tumble Route with a <strong>spoken agreement and no legal filings.</strong> A customer's jacket was ruined. Which best describes who is <strong>liable</strong> for the $800 claim?</p>
<ul>
<li>A. Only Aiko, because she manages the machines</li>
<li>B. Only Jordan, because he handles the accounts</li>
<li>C. The business alone — neither Aiko nor Jordan is personally liable</li>
<li>D. Both Aiko and Jordan are <strong>personally liable</strong></li>
</ul>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="61" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="q1--answer-d">Q1 — Answer: <strong>D</strong></h2>
<p><strong>Why:</strong> A spoken agreement with no legal filings = a <strong>partnership.</strong> In a partnership, <strong>all partners are personally liable</strong> for business debts — regardless of whose area the damage occurred in.</p>
<p><strong>Trap: A</strong> — the exam's favorite partnership trap. Liability is <strong>shared</strong>, not <strong>divided by who manages the machines.</strong> Aiko runs the machines, but Jordan is still liable.</p>
<p><strong>Trap: B</strong> — same trap in reverse. Jordan handles accounts, but the jacket wasn't damaged by accounting. <strong>It doesn't matter.</strong> Both partners are liable.</p>
<p><strong>Trap: C</strong> — borrows the <strong>LLC/corporation rule.</strong> No filings = no liability shield. The business <strong>is</strong> the partners.</p>
<blockquote>
<p><strong>Partnership liability is shared and personal — not divided by who did the work.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="62" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="q2--classify-the-role-split">Q2 — Classify the role split</h2>
<p>Aiko manages routes, machines, and the schedule. Jordan handles pricing, advertising, and accounts. This arrangement best illustrates which concept?</p>
<ul>
<li>A. Partners dividing roles by strengths and interests</li>
<li>B. Departments forming within an organizational structure</li>
<li>C. Outsourcing specialized functions to external firms</li>
<li>D. A corporation electing a board of directors</li>
</ul>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="63" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="q2--answer-a">Q2 — Answer: <strong>A</strong></h2>
<p><strong>Why:</strong> Two partners with a spoken agreement, each handling the areas that match their skills — logistics for Aiko, business operations for Jordan. This is partners <strong>dividing roles by strengths and interests.</strong></p>
<p><strong>Trap: B</strong> — departments form when a business grows large enough to need <strong>specialized teams with managers.</strong> Two partners splitting work is not departments — <strong>scale is the tell.</strong> If the scenario said &quot;Tumble Route has 50 employees organized into teams,&quot; then departments would apply.</p>
<blockquote>
<p><strong>Partners dividing roles ≠ departments.</strong> The difference is scale and specialization.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="64" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="q3--tradeoff-of-incorporating">Q3 — Tradeoff of incorporating</h2>
<p>If Tumble Route <strong>incorporates</strong> and sells shares to finance 20 new vans, which best describes the <strong>tradeoff</strong>?</p>
<ul>
<li>A. The business loses its liability shield but gains funding</li>
<li>B. The partners gain more personal control over daily decisions</li>
<li>C. The owners <strong>cede control</strong> to shareholders and a board in exchange for <strong>greater access to funding</strong></li>
<li>D. The business can no longer grow because shareholders limit decision making</li>
</ul>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="65" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="q3--answer-c">Q3 — Answer: <strong>C</strong></h2>
<p><strong>Why:</strong> Incorporating means selling shares — shareholders elect a board, and the founders <strong>cede control</strong> over major decisions. In exchange, the corporation gains the <strong>greatest access to funding</strong> — exactly what 20 new vans require.</p>
<p><strong>Trap: A</strong> — flips the liability direction. Incorporating <strong>keeps</strong> the liability shield (same as LLC). The trade is control for funding, not liability for funding.</p>
<p><strong>Trap: D</strong> — reverses the relationship. Shareholders <strong>enable</strong> growth by providing funding — they don't limit it. The limitation is on the <strong>founders' control</strong>, not on the business's ability to grow.</p>
<blockquote>
<p><strong>Control and funding pull in opposite directions.</strong> Incorporating shrinks personal liability, cedes control, and unlocks funding.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="66" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="q4--identify-the-department">Q4 — Identify the department</h2>
<p>At a mid-size company, one department <strong>tracks the year's expenditures and earnings and prepares the financial statements</strong> that management reviews each quarter. Which department is this?</p>
<ul>
<li>A. Finance</li>
<li>B. Accounting</li>
<li>C. Operations</li>
<li>D. Research and development</li>
</ul>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="67" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="67" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="q4--answer-b">Q4 — Answer: <strong>B</strong></h2>
<p><strong>Why:</strong> Accounting tracks expenditures and earnings and prepares financial statements — the question restates that job almost word for word.</p>
<blockquote>
<p><strong>Trap: A.</strong> Finance secures and manages funds and recommends strategies <strong>going forward.</strong> Preparing statements about money that <strong>already moved</strong> is accounting — <strong>even when the word &quot;financial&quot; appears.</strong></p>
</blockquote>
<blockquote>
<p><strong>Records look backward, funding looks forward.</strong> &quot;Financial&quot; is not a reliable signal. The direction test is.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="68" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="68" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="q5--identify-the-structure-from-a-data-table">Q5 — Identify the structure from a data table</h2>
<p>A student studies three businesses and records the following data:</p>
<table>
<thead>
<tr>
<th>Feature</th>
<th>Business X</th>
<th>Business Y</th>
<th>Business Z</th>
</tr>
</thead>
<tbody>
<tr>
<td>Number of owners</td>
<td>1</td>
<td>3</td>
<td>Shareholders</td>
</tr>
<tr>
<td>Liability</td>
<td>Personal</td>
<td>Shielded</td>
<td>Shielded</td>
</tr>
<tr>
<td>Funding source</td>
<td>Owner's savings</td>
<td>Partners' savings</td>
<td>Stock sales</td>
</tr>
<tr>
<td>Decision maker</td>
<td>Owner alone</td>
<td>Owners together</td>
<td>Board of directors</td>
</tr>
</tbody>
</table>
<p>Based on the table, which row of structures is <strong>correct</strong>?</p>
<ul>
<li>A. X = Partnership, Y = LLC, Z = Sole proprietorship</li>
<li>B. X = LLC, Y = Corporation, Z = Partnership</li>
<li>C. X = Sole proprietorship, Y = Partnership, Z = Corporation</li>
<li>D. X = Sole proprietorship, Y = LLC, Z = Corporation</li>
</ul>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="69" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="69" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="q5--answer-d">Q5 — Answer: <strong>D</strong></h2>
<p><strong>Run the three questions for each business:</strong></p>
<p><strong>Business X:</strong> 1 owner + personal liability + self-funded → <strong>Sole proprietorship.</strong><br />
<strong>Business Y:</strong> 3 owners + shielded liability + partners' savings (no shareholders) → <strong>LLC.</strong><br />
<strong>Business Z:</strong> Shareholders + shielded liability + stock sales + board → <strong>Corporation.</strong></p>
<p><strong>Trap: C</strong> — gets X right but swaps Y and Z. Business Y has <strong>shielded liability</strong> — that eliminates partnership (personal liability). <strong>Check every feature in every row.</strong></p>
<blockquote>
<p><strong>ID tables: check every feature in every row.</strong> One wrong column flips the whole answer.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="70" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="70" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="q6--outsourcing-support-due-to-high-wages">Q6 — Outsourcing support due to high wages</h2>
<p>A software company <strong>hires an outside firm</strong> to run its customer-support phone lines because <strong>support wages in its city are unusually high.</strong> Which best describes this decision?</p>
<ul>
<li>A. The company has made customer support one of its core competencies</li>
<li>B. The company has converted the support staff into internal stakeholders</li>
<li>C. The company is outsourcing a function because doing so is likely to <strong>reduce costs</strong></li>
<li>D. The company has reorganized as a corporation</li>
</ul>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="71" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="71" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="q6--answer-c">Q6 — Answer: <strong>C</strong></h2>
<p><strong>Why:</strong> Outsourcing = hiring another business to handle a function. The two classic triggers are <strong>missing skills</strong> and <strong>high labor costs</strong> — high support wages are the second trigger.</p>
<p><strong>Trap: A.</strong> Core competencies are capabilities a business <strong>develops itself.</strong> Handing a function to an outside firm is <strong>the opposite move</strong> — the company has decided support is a <strong>cost to manage</strong>, so the function moves outside.</p>
<blockquote>
<p><strong>Outsourcing ≠ core competency.</strong> One moves a function <em>out</em>; the other develops one <em>in-house.</em></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="72" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="72" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="trap-patterns-to-watch">Trap patterns to watch</h2>
<table>
<thead>
<tr>
<th>#</th>
<th>Trap</th>
<th>Where</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td><strong>Partnership liability is shared and personal</strong> — not divided by who did the work</td>
<td>Q1</td>
</tr>
<tr>
<td>2</td>
<td><strong>Partners dividing roles ≠ departments</strong> — scale is the tell</td>
<td>Q2</td>
</tr>
<tr>
<td>3</td>
<td><strong>Corporation:</strong> control and funding pull opposite directions; incorporating <strong>keeps</strong> the liability shield</td>
<td>Q3</td>
</tr>
<tr>
<td>4</td>
<td><strong>Accounting (records, backward) vs. Finance (funds, forward)</strong> — &quot;financial&quot; is unreliable</td>
<td>Q4</td>
</tr>
<tr>
<td>5</td>
<td><strong>ID tables: check every feature in every row</strong> — one wrong column flips the answer</td>
<td>Q5</td>
</tr>
<tr>
<td>6</td>
<td><strong>Outsourcing ≠ core competency</strong> — one moves out, one develops in</td>
<td>Q6</td>
</tr>
</tbody>
</table>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="73" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-class="lead" data-theme="default" class="lead" data-marpit-pagination="73" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--class:lead;--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>

<h2 id="wrap-up">Wrap-up</h2>
<ul>
<li>The <strong>structure</strong> you choose decides three things: who <strong>controls</strong> the decisions, who <strong>pays</strong> the debts, and how the business <strong>grows</strong></li>
<li><strong>3-question method:</strong> owners? debts? funding? → run it every time</li>
<li><strong>Control and funding</strong> pull in opposite directions</li>
<li><strong>Liability:</strong> sole prop + partnership = personal; LLC + corporation = shielded</li>
<li><strong>One owner = five hats;</strong> partners divide by <strong>strengths and interests</strong></li>
<li><strong>Departments</strong> specialize as the business grows; <strong>accounting = backward, finance = forward</strong></li>
<li><strong>Outsourcing</strong> = buy the function or build it; triggers = missing skills or high costs</li>
</ul>
<blockquote>
<p><strong>Get the structure wrong and the org chart is just a drawing.</strong></p>
</blockquote>
<h3 id="next-18-supply-chains">Next: 1.8 Supply Chains</h3>
<p><em>Every product you sell passed through a chain you may have never seen. How does that chain work — and how does it become an advantage?</em></p>
