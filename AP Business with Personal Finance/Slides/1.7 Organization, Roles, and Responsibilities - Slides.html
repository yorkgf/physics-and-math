<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="opening-question">Opening question</h2>
<p>You know who the customer is (1.4), what the product is (1.1), what the world looks like (1.3), what the business stands for (1.5), and what the right thing to do is (1.6).</p>
<blockquote>
<p><strong>But who actually <em>owns</em> this thing — and who does what?</strong></p>
</blockquote>
<p>Saturday morning, mid-setup, the cousin stops carrying coolers: <strong>half the work should mean half the profit.</strong> A handshake makes them partners. Twenty minutes later, a parent asks: <em>&quot;if that cooler lid slams shut on somebody's phone, which of you pays?&quot;</em></p>
<p>Neither kid knows. <strong>The handshake divided the profits and never mentioned the debts.</strong></p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="3" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="todays-goals">Today's goals</h2>
<p>By the end of this lesson you can:</p>
<ol>
<li>Compare the <strong>four legal structures</strong> and the tradeoffs each carries</li>
<li>Describe how <strong>roles and responsibilities</strong> are organized as a business grows</li>
<li>Explain when and why a business might <strong>outsource</strong> a function</li>
</ol>
<p><strong>Running story continues:</strong> the snack box is three weeks old, the cousin has joined, and a parent just asked a question that the handshake can't answer.</p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="4" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="the-handshake-scenario">The handshake scenario</h2>
<p>Saturday morning. The cousin has been helping for two weeks — carrying coolers, loading vans, handing off boxes at the field.</p>
<p>This Saturday, the cousin stops mid-lift:</p>
<blockquote>
<p><em>&quot;Half the work means half the profit. We're partners now.&quot;</em></p>
</blockquote>
<p>A handshake. No paperwork. No filings. No written agreement.</p>
<p><strong>Twenty minutes later</strong>, a parent picks up a snack box and the cooler lid slams down on their phone screen. The screen cracks. The parent turns to both kids:</p>
<blockquote>
<p><em>&quot;Which one of you pays for this?&quot;</em></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="5" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="the-question-the-handshake-cant-answer">The question the handshake can't answer</h2>
<p>The handshake <strong>divided the profits.</strong> It never mentioned the <strong>debts.</strong></p>
<ul>
<li>If something breaks, who is liable?</li>
<li>If the business owes money, whose pocket does it come from?</li>
<li>If the business needs to grow, where does the money come from?</li>
</ul>
<blockquote>
<p><strong>These are structure questions — and the handshake has no answers.</strong> Today we name the four structures that do.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="6" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="the-four-legal-structures--definition">The four legal structures — definition</h2>
<p>Every business sits inside a <strong>legal structure.</strong> The structure decides three things: who <strong>controls</strong> the decisions, who <strong>pays</strong> the debts, and how the business <strong>grows.</strong></p>
<table>
<thead>
<tr>
<th>Structure</th>
<th>Owners</th>
<th>Control &amp; profits</th>
<th>Liability</th>
<th>Funding</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Sole proprietorship</strong></td>
<td>1</td>
<td>full control, keeps every dollar</td>
<td><strong>personal</strong></td>
<td>limited</td>
</tr>
<tr>
<td><strong>Partnership</strong></td>
<td>2+</td>
<td>shared control/profits</td>
<td><strong>personal</strong></td>
<td>limited</td>
</tr>
<tr>
<td><strong>LLC</strong></td>
<td>owners</td>
<td>retain control, keep profits</td>
<td><strong>shielded</strong></td>
<td>limited</td>
</tr>
<tr>
<td><strong>Corporation</strong></td>
<td>shareholders</td>
<td><strong>ceded</strong> to an elected board</td>
<td><strong>shielded</strong></td>
<td>greatest</td>
</tr>
</tbody>
</table>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="7" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="the-four-legal-structures--in-the-examples">The four legal structures — in the examples</h2>
<p>Each structure maps onto one moment in the snack box story:</p>
<ul>
<li><strong>Sole proprietorship:</strong> the snack box founder alone — five hats on a single Saturday, every dollar his, every risk his</li>
<li><strong>Partnership:</strong> the cousin joins, handshake agreement, no filings — shared control, shared profits, <strong>shared personal liability</strong></li>
<li><strong>LLC:</strong> what the snack box <em>should</em> become after the phone-screen question — owners keep control, but the business's debts belong to the business</li>
<li><strong>Corporation:</strong> if they needed to sell shares for a 40-league expansion — cede control to shareholders and a board, gain the most funding</li>
</ul>
<blockquote>
<p><strong>The structure fits the stage.</strong> One kid, one Saturday = sole prop. Two kids, one handshake = partnership. The phone-screen question = time for an LLC.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="8" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="sole-proprietorship--definition">Sole proprietorship — definition</h2>
<p>A <strong>sole proprietorship</strong> is a business owned and run by <strong>one person.</strong></p>
<ul>
<li>The owner has <strong>full control</strong> over every decision</li>
<li>The owner <strong>keeps all the profits</strong></li>
<li>The owner is <strong>personally liable</strong> for all business debts</li>
<li>Funding comes from the owner's <strong>own savings and loans</strong></li>
</ul>
<blockquote>
<p><strong>Simplest structure.</strong> No filings, no partners, no board. One person, one business.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="9" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="sole-proprietorship--in-the-examples">Sole proprietorship — in the examples</h2>
<p>The snack box founder on the first Saturday:</p>
<ul>
<li><strong>One owner</strong> — nobody else has a claim</li>
<li><strong>Full control</strong> — he decides the menu, the price, the route</li>
<li><strong>Keeps every dollar</strong> — profit = revenue minus cost, all his</li>
<li><strong>Personal liability</strong> — if the cooler lid breaks a phone, <strong>he pays from his own pocket</strong></li>
<li><strong>Limited funding</strong> — growth depends on what he can save or borrow</li>
</ul>
<blockquote>
<p><strong>Five hats, one head.</strong> CEO, marketer, product developer, financial manager, operations manager — all on the same Saturday.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="10" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="partnership--definition">Partnership — definition</h2>
<p>A <strong>partnership</strong> is a business owned by <strong>two or more people</strong> who share control and profits.</p>
<ul>
<li>Owners <strong>share control</strong> and <strong>share profits</strong> — usually by agreement</li>
<li>All partners are <strong>personally liable</strong> for business debts — <strong>even debts caused by the other partner</strong></li>
<li>Funding is still <strong>limited</strong> — comes from the partners' savings and loans</li>
<li>No legal filings required to form (in most cases) — <strong>a handshake can do it</strong></li>
</ul>
<blockquote>
<p><strong>The exam's favorite trap:</strong> liability is <strong>shared</strong>, not <strong>divided by who did the work.</strong> If the cousin drops the cooler, the founder still pays.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="11" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="partnership--in-the-examples">Partnership — in the examples</h2>
<p>The cousin joins the snack box:</p>
<ul>
<li><strong>Two owners</strong> — handshake agreement, no paperwork</li>
<li><strong>Shared control</strong> — the cousin handles logistics, the founder handles the product</li>
<li><strong>Shared profits</strong> — they split the cash box at the end of the day</li>
<li><strong>Personal liability</strong> — if the cooler lid breaks a phone, <strong>both</strong> pay, regardless of whose hand was on the lid</li>
<li><strong>Limited funding</strong> — still just two kids' savings</li>
</ul>
<blockquote>
<p><strong>The handshake divided the profits. It never mentioned the debts.</strong> Both are personally liable — the exam tests this exact point.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="12" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="llc--definition">LLC — definition</h2>
<p>A <strong>limited liability company (LLC)</strong> is a business structure where owners <strong>retain control</strong> and keep profits, but their <strong>personal assets are shielded</strong> from business debts.</p>
<ul>
<li>Owners <strong>keep control</strong> — no board, no shareholders</li>
<li><strong>Liability is shielded</strong> — business debts belong to the business, not to the owners personally</li>
<li>Funding is still <strong>limited</strong> — no shares to sell</li>
<li>Requires <strong>legal filings</strong> to form</li>
</ul>
<blockquote>
<p><strong>The LLC draws a wall between the business and the owner's personal money.</strong> The phone-screen question stops here.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="13" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="llc--in-the-examples">LLC — in the examples</h2>
<p>The phone-screen question pushes the snack box toward an LLC:</p>
<ul>
<li><strong>Same two owners</strong> — but now with a legal filing</li>
<li><strong>Same control</strong> — they still make every decision together</li>
<li><strong>Shielded liability</strong> — if the cooler lid breaks a phone, the <strong>business</strong> pays, not their personal savings</li>
<li><strong>Limited funding</strong> — they can't sell shares, so growth still depends on savings and loans</li>
</ul>
<blockquote>
<p><strong>The LLC answers the parent's question:</strong> &quot;Which one of you pays?&quot; → <strong>The business does.</strong> That's the wall the filing builds.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="14" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="corporation--definition">Corporation — definition</h2>
<p>A <strong>corporation</strong> is a business owned by <strong>shareholders</strong> who elect a <strong>board of directors</strong> to make major decisions.</p>
<ul>
<li>Owners <strong>cede control</strong> to shareholders and an elected board</li>
<li><strong>Liability is shielded</strong> — same wall as the LLC</li>
<li><strong>Greatest access to funding</strong> — the corporation can <strong>sell shares</strong> to raise money</li>
<li>The most <strong>complex and expensive</strong> structure to form and maintain</li>
</ul>
<blockquote>
<p><strong>The trade:</strong> you give up control, and in exchange you get the most funding and the strongest liability shield.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="15" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="corporation--in-the-examples">Corporation — in the examples</h2>
<p>If the snack box needed to expand to 40 leagues at once:</p>
<ul>
<li><strong>Shareholders</strong> buy in — each one owns a piece of the business</li>
<li><strong>A board is elected</strong> — the founder no longer makes every call alone</li>
<li><strong>Selling shares</strong> raises the money for 40 new vans and 40 new cooler sets</li>
<li><strong>Shielded liability</strong> — same wall as the LLC</li>
</ul>
<blockquote>
<p><strong>The founder traded control for scale.</strong> He can't decide the menu alone anymore — but the business can reach leagues he could never fund by himself.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="16" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="tradeoff-line-1--control-vs-funding">Tradeoff line 1 — control vs. funding</h2>
<blockquote>
<p><strong>Control and funding pull in opposite directions.</strong></p>
</blockquote>
<p>Owners of a <strong>sole proprietorship, partnership, or LLC</strong> <strong>retain control</strong> over decision making and keep the profits — but the price is that <strong>growth may be limited</strong>, because these structures have <strong>less access to funding.</strong></p>
<p>A <strong>corporation flips the trade:</strong> its owners <strong>cede control</strong> to shareholders and an elected board, and in exchange the corporation gains <strong>greater access to funding and room to grow</strong>, with the company itself controlling the profits.</p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="17" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="tradeoff-line-1--in-the-examples">Tradeoff line 1 — in the examples</h2>
<p>The snack box faces this trade at every growth decision:</p>
<table>
<thead>
<tr>
<th>Stage</th>
<th>Structure</th>
<th>Control</th>
<th>Funding</th>
</tr>
</thead>
<tbody>
<tr>
<td>One kid, one field</td>
<td>Sole proprietorship</td>
<td>Total</td>
<td>His savings</td>
</tr>
<tr>
<td>Two kids, handshake</td>
<td>Partnership</td>
<td>Shared between two</td>
<td>Two savings pools</td>
</tr>
<tr>
<td>After the phone-screen filing</td>
<td>LLC</td>
<td>Same two owners</td>
<td>Same limited pool</td>
</tr>
<tr>
<td>40-league expansion</td>
<td>Corporation</td>
<td>Board + shareholders</td>
<td>Selling shares</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>The more control you keep, the harder it is to raise money.</strong> The snack box can stay small and stay in charge — or grow big and share the wheel.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="18" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="tradeoff-line-2--liability--definition">Tradeoff line 2 — liability — definition</h2>
<blockquote>
<p><strong>Who pays when something goes wrong?</strong></p>
</blockquote>
<p><strong>Sole proprietors and partners</strong> are <strong>personally liable</strong> for all business debts — a broken screen, an unpaid loan, or a lawsuit can reach into <strong>their own pockets.</strong></p>
<p>Organizing as an <strong>LLC</strong> lets owners <strong>avoid that personal exposure</strong> — the business's debts belong to the business. A <strong>corporation</strong> draws the same wall.</p>
<table>
<thead>
<tr>
<th></th>
<th>Personally liable</th>
<th>Liability shielded</th>
</tr>
</thead>
<tbody>
<tr>
<td>Structures</td>
<td>Sole proprietorship, Partnership</td>
<td>LLC, Corporation</td>
</tr>
</tbody>
</table>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="19" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="tradeoff-line-2--liability--in-the-examples">Tradeoff line 2 — liability — in the examples</h2>
<p>The phone-screen question is the test:</p>
<ul>
<li><strong>Sole proprietorship:</strong> the founder pays from his own savings</li>
<li><strong>Partnership:</strong> both the founder and the cousin pay — <strong>regardless of whose hand was on the lid</strong></li>
<li><strong>LLC:</strong> the business pays — the owners' personal savings are untouched</li>
<li><strong>Corporation:</strong> same wall — the business pays</li>
</ul>
<blockquote>
<p><strong>The parent's question — &quot;which one of you pays?&quot; — has a different answer in every structure.</strong> That's why the structure matters.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="20" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="the-3-question-identification-method">The 3-question identification method</h2>
<blockquote>
<p>Every identification question in this topic surrenders to these three questions, in order:</p>
</blockquote>
<ol>
<li><strong>How many owners</strong> — one or several?</li>
<li><strong>Who pays the business's debts</strong> — the owners personally, or the business alone?</li>
<li><strong>How does growth get funded</strong> — from savings and loans, or by selling shares?</li>
</ol>
<table>
<thead>
<tr>
<th>Answer pattern</th>
<th>Structure</th>
</tr>
</thead>
<tbody>
<tr>
<td>One owner, personal liability, self-funded</td>
<td><strong>Sole proprietorship</strong></td>
</tr>
<tr>
<td>Several owners, personal liability</td>
<td><strong>Partnership</strong></td>
</tr>
<tr>
<td>Owners shielded, no shareholders/board</td>
<td><strong>LLC</strong></td>
</tr>
<tr>
<td>Shareholders, a board, stock funding</td>
<td><strong>Corporation</strong></td>
</tr>
</tbody>
</table>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="21" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="the-3-question-method--in-the-examples">The 3-question method — in the examples</h2>
<p>Run the snack box through the three questions at each stage:</p>
<p><strong>Stage 1 — one kid, one Saturday:</strong></p>
<blockquote>
<p>How many owners? <strong>One.</strong> Who pays debts? <strong>He does — personally.</strong> How funded? <strong>His savings.</strong> → <strong>Sole proprietorship.</strong></p>
</blockquote>
<p><strong>Stage 2 — the cousin joins:</strong></p>
<blockquote>
<p>How many owners? <strong>Two.</strong> Who pays debts? <strong>Both — personally.</strong> How funded? <strong>Their savings.</strong> → <strong>Partnership.</strong></p>
</blockquote>
<p><strong>Stage 3 — after the filing:</strong></p>
<blockquote>
<p>How many owners? <strong>Two.</strong> Who pays debts? <strong>The business — liability shielded.</strong> How funded? <strong>Still their savings.</strong> → <strong>LLC.</strong></p>
</blockquote>
<p><strong>Stage 4 — 40-league expansion:</strong></p>
<blockquote>
<p>How many owners? <strong>Shareholders.</strong> Who pays debts? <strong>The business — liability shielded.</strong> How funded? <strong>Selling shares.</strong> → <strong>Corporation.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="22" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="exam-tip--start-with-question-1">Exam tip — start with question 1</h2>
<blockquote>
<p><strong>Start with the first question (how many owners?) and you can eliminate half the options immediately.</strong></p>
</blockquote>
<ul>
<li>One owner → sole proprietorship or (rarely) an LLC with one member</li>
<li>Two or more owners, personal liability → partnership</li>
<li>Two or more owners, shielded, no board → LLC</li>
<li>Shareholders and a board → corporation</li>
</ul>
<blockquote>
<p><strong>The first question is the fastest filter.</strong> Use it before reading the full scenario.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-class="invert" data-theme="default" class="invert" data-marpit-pagination="23" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--class:invert;--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>

<h1 id="your-turn--identify-the-structure">Your turn — identify the structure</h1>
<p><em>Read each scenario. Run the three questions. Name the structure.</em></p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="24" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="scenario-1">Scenario 1</h2>
<p>A business has <strong>one owner</strong>, who is <strong>personally liable</strong> for all debts, and funds growth through <strong>savings and a bank loan.</strong></p>
<blockquote>
<p><strong>What is the legal structure?</strong></p>
</blockquote>
<p>Run the three questions:</p>
<ol>
<li>How many owners? → One</li>
<li>Who pays debts? → The owner personally</li>
<li>How funded? → Savings and loans</li>
</ol>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="25" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="scenario-1--answer">Scenario 1 — answer</h2>
<p><strong>Sole proprietorship.</strong></p>
<p>One owner + personal liability + self-funded. The other options fail on the first question:</p>
<ul>
<li><strong>Partnership</strong> requires 2+ owners</li>
<li><strong>LLC</strong> requires a liability shield</li>
<li><strong>Corporation</strong> requires shareholders and a board</li>
</ul>
<blockquote>
<p><strong>Start with question 1 and eliminate.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="26" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="scenario-2">Scenario 2</h2>
<p>Two friends start a delivery service. They <strong>shake hands</strong>, split profits equally, and <strong>file no legal paperwork.</strong> A customer's package is damaged.</p>
<blockquote>
<p><strong>Who is liable for the damage?</strong></p>
</blockquote>
<p>A. Only the friend who made the delivery<br />
B. Only the friend who took the order<br />
C. The business alone — neither friend is personally liable<br />
D. Both friends — personally and jointly</p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="27" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="scenario-2--answer">Scenario 2 — answer</h2>
<p><strong>D. Both friends — personally and jointly.</strong></p>
<p>A partnership with no filings = personal liability for <strong>all</strong> partners. The exam's favorite trap: liability is <strong>shared</strong>, not <strong>divided by who did the work.</strong> The friend who didn't make the delivery still pays.</p>
<blockquote>
<p><strong>Trap: A and B.</strong> Partnership liability doesn't sort by whose hand was on the package. Both partners are liable for all business debts.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="28" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="scenario-3">Scenario 3</h2>
<p>A business has <strong>three owners</strong> who filed legal paperwork. The owners <strong>make all decisions together</strong>, and the business's debts <strong>do not reach their personal savings.</strong> The business has <strong>no shareholders and no board.</strong></p>
<blockquote>
<p><strong>What is the legal structure?</strong></p>
</blockquote>
<p>A. Partnership<br />
B. Corporation<br />
C. Sole proprietorship<br />
D. LLC</p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="29" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="scenario-3--answer">Scenario 3 — answer</h2>
<p><strong>D. LLC.</strong></p>
<p>Run the three questions:</p>
<ol>
<li>How many owners? → Three (eliminates sole proprietorship)</li>
<li>Who pays debts? → The business — liability shielded (eliminates partnership)</li>
<li>How funded? → No shareholders, no board (eliminates corporation)</li>
</ol>
<blockquote>
<p><strong>LLC = shielded liability + no shareholders/board.</strong> The middle structure.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-class="invert" data-theme="default" class="invert" data-marpit-pagination="30" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--class:invert;--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>

<h1 id="roles-and-responsibilities">Roles and responsibilities</h1>
<p><strong>Structure says who <em>owns</em> the business. Roles say who <em>does the work.</em></strong></p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="31" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="one-owner-every-hat--definition">One owner, every hat — definition</h2>
<p>In a sole proprietorship, one person does all of it — <strong>five roles at once:</strong></p>
<table>
<thead>
<tr>
<th>Role</th>
<th>What it means</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Chief executive officer</strong></td>
<td>Setting the direction, making the big calls</td>
</tr>
<tr>
<td><strong>Marketer</strong></td>
<td>Getting the word out, building the brand</td>
</tr>
<tr>
<td><strong>Product developer</strong></td>
<td>Designing and improving what's sold</td>
</tr>
<tr>
<td><strong>Financial manager</strong></td>
<td>Counting the money, tracking costs</td>
</tr>
<tr>
<td><strong>Operations manager</strong></td>
<td>Running the day-to-day — logistics, delivery, execution</td>
</tr>
</tbody>
</table>
<blockquote>
<p>The hats <strong>compete for hours</strong> — a Saturday spent under the operations hat leaves the marketing hat unworn all week.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="32" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="one-owner-every-hat--in-the-examples">One owner, every hat — in the examples</h2>
<p>The snack box founder on a single Saturday:</p>
<table>
<thead>
<tr>
<th>Role</th>
<th>What he does</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>CEO</strong></td>
<td>Decides to add fruit cups after the families' feedback</td>
</tr>
<tr>
<td><strong>Marketer</strong></td>
<td>Posts the new menu in the league group chat</td>
</tr>
<tr>
<td><strong>Product developer</strong></td>
<td>Tests the fruit cup recipe on Friday night</td>
</tr>
<tr>
<td><strong>Financial manager</strong></td>
<td>Counts the cash box, calculates the weekend profit</td>
</tr>
<tr>
<td><strong>Operations manager</strong></td>
<td>Loads the cooler, drives to the field, hands off at halftime</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>Five hats, one head.</strong> Every minute under one hat is a minute stolen from another. That's why partners matter.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="33" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="partners-divide-the-roles--definition">Partners divide the roles — definition</h2>
<p><strong>Partners</strong> carry the same full responsibility, but typically <strong>divide the roles according to each partner's strengths and interests.</strong></p>
<ul>
<li>One partner might handle <strong>operations and logistics</strong> — routes, schedules, handoffs</li>
<li>The other might handle <strong>product, pricing, and money</strong> — the menu, the cash box, the group chat</li>
<li>The division isn't about hierarchy — it's about <strong>fit</strong></li>
</ul>
<blockquote>
<p><strong>A partnership where both partners fight over the same hat wastes one of its two advantages.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="34" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="partners-divide-the-roles--in-the-examples">Partners divide the roles — in the examples</h2>
<p>The cousin joins the snack box:</p>
<table>
<thead>
<tr>
<th>Partner</th>
<th>Strengths</th>
<th>Hats worn</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>The founder</strong></td>
<td>Product design, pricing, customer relationships</td>
<td>CEO, product developer, financial manager, marketer</td>
</tr>
<tr>
<td><strong>The cousin</strong></td>
<td>Logistics, scheduling, physical delivery</td>
<td>Operations manager</td>
</tr>
</tbody>
</table>
<blockquote>
<p>The cousin loves logistics — routes, coolers, handoffs. The founder keeps the product, the pricing, and the money. <strong>Each partner wears the hats that fit.</strong></p>
</blockquote>
<blockquote>
<p><strong>The exam tests this as &quot;dividing roles by strengths and interests&quot; — not by seniority or ownership percentage.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="35" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="growing-into-departments--definition">Growing into departments — definition</h2>
<p>As a business grows in size and complexity, many businesses organize roles into <strong>specialized departments.</strong></p>
<ul>
<li><strong>Executive leaders</strong> (e.g., a CEO) are responsible for the <strong>overall vision, operations, strategy, and performance</strong></li>
<li><strong>Managers</strong> lead the specialized departments and <strong>report to</strong> those executives</li>
<li>In a <strong>corporation</strong>, the executive leaders themselves <strong>report upward</strong> to the <strong>board of directors and the shareholders</strong></li>
</ul>
<blockquote>
<p><strong>Authority flows down the chart; accountability flows right back up.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="36" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="growing-into-departments--in-the-examples">Growing into departments — in the examples</h2>
<p>The snack box at 40-league scale:</p>
<ul>
<li>The <strong>founder becomes CEO</strong> — setting direction, answering to shareholders</li>
<li><strong>Department managers</strong> report to the CEO — each one owns a piece of the operation</li>
<li>The <strong>board of directors</strong> holds the CEO accountable for performance</li>
</ul>
<blockquote>
<p><strong>Specialization is the payoff:</strong> departments develop <strong>deep expertise</strong>, which improves the business's ability to meet customer needs <strong>efficiently and effectively.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="37" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="organizational-structure--definition">Organizational structure — definition</h2>
<p><strong>Organizational structure</strong> = the arrangement of roles, responsibility, authority, and communication. Drawing it as a chart (an <strong>org chart</strong>) makes the reporting lines readable at a glance.</p>
<p>Watch one decision travel the chart:</p>
<ol>
<li>An <strong>operations manager</strong> pitches opening league 41</li>
<li>The <strong>CEO</strong> weighs it against strategy and says yes</li>
<li>At the next <strong>board meeting</strong> the CEO answers to the <strong>directors and shareholders</strong> for how the expansion performed</li>
</ol>
<blockquote>
<p><strong>Authority flows down; accountability flows up.</strong> That's the structure doing its job.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="38" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="organizational-structure--in-the-examples">Organizational structure — in the examples</h2>
<p>The snack box at league 41:</p>
<ul>
<li><strong>Operations manager:</strong> &quot;League 41 needs a team. Here's the cost.&quot;</li>
<li><strong>CEO (the founder):</strong> &quot;Does it fit the expansion plan? Can we staff it?&quot;</li>
<li><strong>Board meeting:</strong> &quot;How did league 41 perform against the budget?&quot;</li>
</ul>
<blockquote>
<p><strong>The org chart isn't a drawing — it's the path every decision follows.</strong> Authority goes down, accountability comes back up.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="39" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="the-six-departments--definition">The six departments — definition</h2>
<table>
<thead>
<tr>
<th>Department</th>
<th>Function</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Sales and marketing</strong></td>
<td>Market research, sales strategies, brand management, customer relationships</td>
</tr>
<tr>
<td><strong>Research and development (R&amp;D)</strong></td>
<td>Innovates around new goods, services, and processes</td>
</tr>
<tr>
<td><strong>Operations</strong></td>
<td>Making the goods or developing the services and getting products to customers</td>
</tr>
<tr>
<td><strong>Accounting</strong></td>
<td>Tracks expenditures and earnings, prepares financial statements</td>
</tr>
<tr>
<td><strong>Finance</strong></td>
<td>Secures and manages funds, recommends strategies for improving performance</td>
</tr>
<tr>
<td><strong>Human resources</strong></td>
<td>Recruits, trains, and oversees evaluation of employees</td>
</tr>
</tbody>
</table>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="40" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="the-six-departments--in-the-examples">The six departments — in the examples</h2>
<p>Six departments, one product (a snack box at 40-league scale):</p>
<ul>
<li><strong>R&amp;D</strong> invents and tests new snack combinations</li>
<li><strong>Sales and marketing</strong> surveys families, prices the boxes, and builds the brand across leagues</li>
<li><strong>Operations</strong> produces thousands of boxes and routes them to every field</li>
<li><strong>Accounting</strong> records what the launch spends and earns</li>
<li><strong>Finance</strong> decides the launch budget and reads the early numbers</li>
<li><strong>Human resources</strong> hires and trains the extra Saturday staff</li>
</ul>
<blockquote>
<p><strong>Six departments, one product.</strong> A question about any single desk is answered by <strong>naming that desk's function.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="41" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="the-swap-pair-accounting-vs-finance--definition">The swap pair: Accounting vs. Finance — definition</h2>
<blockquote>
<p><strong>Accounting and Finance are the swap pair the exam loves.</strong></p>
</blockquote>
<table>
<thead>
<tr>
<th></th>
<th>Accounting</th>
<th>Finance</th>
</tr>
</thead>
<tbody>
<tr>
<td>Direction</td>
<td>Records and reports money that <strong>already moved</strong></td>
<td>Works <strong>forward</strong></td>
</tr>
<tr>
<td>What it does</td>
<td>Tracks, prepares statements, monitors health</td>
<td>Secures funds, manages them, recommends what's next</td>
</tr>
<tr>
<td>Looks</td>
<td><strong>Backward</strong></td>
<td><strong>Forward</strong></td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>Records look backward, funding looks forward.</strong> Pin this difference now.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="42" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="the-swap-pair-accounting-vs-finance--in-the-examples">The swap pair: Accounting vs. Finance — in the examples</h2>
<p>The snack box cash box:</p>
<ul>
<li><strong>Accounting</strong> = the cash box itself — every dollar in, every dollar out, the weekend totals on a sheet of paper. <strong>Looking backward</strong> at what already happened.</li>
<li><strong>Finance</strong> = the decision to fund league 41 — do we have enough cash? Should we borrow? Is the return worth it? <strong>Looking forward</strong> at what should happen next.</li>
</ul>
<blockquote>
<p>A scenario about <strong>preparing statements</strong> belongs to <strong>accounting</strong> — <strong>even when the word &quot;finance&quot; appears in it.</strong></p>
</blockquote>
<blockquote>
<p><strong>The cash box is accounting. The decision to spend from it is finance.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="43" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="accounting-vs-finance--the-exam-trick">Accounting vs. Finance — the exam trick</h2>
<p>The exam writes scenarios that <strong>use the word &quot;financial&quot;</strong> to pull you toward the wrong answer:</p>
<ul>
<li><em>&quot;The department that prepares the financial statements&quot;</em> → <strong>Accounting</strong> (backward — records)</li>
<li><em>&quot;The department that secures funds for expansion&quot;</em> → <strong>Finance</strong> (forward — funding)</li>
</ul>
<blockquote>
<p><strong>&quot;Financial&quot; is unreliable as a signal.</strong> The direction test works every time: <strong>backward = accounting, forward = finance.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-class="invert" data-theme="default" class="invert" data-marpit-pagination="44" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--class:invert;--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>

<h1 id="your-turn--identify-the-department">Your turn — identify the department</h1>
<p><em>Read each scenario. Name the department. Watch for the swap pair.</em></p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="45" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="scenario-a">Scenario A</h2>
<p>A department at a mid-size company <strong>tracks the year's expenditures and earnings and prepares the financial statements</strong> that management reviews each quarter.</p>
<blockquote>
<p><strong>Which department is this?</strong></p>
</blockquote>
<p>A. Finance<br />
B. Accounting<br />
C. Operations<br />
D. Research and development</p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="46" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="scenario-a--answer">Scenario A — answer</h2>
<p><strong>B. Accounting.</strong></p>
<p>Accounting tracks expenditures and earnings and prepares financial statements — the question restates that job almost word for word.</p>
<blockquote>
<p><strong>Trap: A.</strong> Finance secures and manages funds and recommends strategies <strong>going forward.</strong> Preparing statements about money that <strong>already moved</strong> is accounting — <strong>even when the word &quot;financial&quot; appears.</strong></p>
</blockquote>
<blockquote>
<p><strong>Records look backward, funding looks forward.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="47" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="scenario-b">Scenario B</h2>
<p>A department <strong>secures funding</strong> for a new product launch and <strong>recommends strategies</strong> for improving the company's financial performance over the next fiscal year.</p>
<blockquote>
<p><strong>Which department is this?</strong></p>
</blockquote>
<p>A. Accounting<br />
B. Operations<br />
C. Finance<br />
D. Human resources</p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="48" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="scenario-b--answer">Scenario B — answer</h2>
<p><strong>C. Finance.</strong></p>
<p>Securing funds and recommending forward-looking strategies = finance. The direction is <strong>forward</strong> — planning for what comes next.</p>
<blockquote>
<p><strong>Trap: A.</strong> The word &quot;financial&quot; appears in the scenario, but the direction is forward, not backward. <strong>&quot;Financial&quot; is not a reliable signal.</strong> The direction test is.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-class="invert" data-theme="default" class="invert" data-marpit-pagination="49" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--class:invert;--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>

<h1 id="outsourcing">Outsourcing</h1>
<p><strong>Buy the function, or build it.</strong></p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="50" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="outsourcing--definition">Outsourcing — definition</h2>
<p><strong>Outsourcing</strong> = hiring another business to handle a function <strong>instead of doing it internally.</strong></p>
<p>A business may outsource a function when doing so is likely to <strong>increase efficiency or reduce costs.</strong></p>
<p><strong>Classic triggers:</strong></p>
<ol>
<li>The business <strong>lacks employees with the specific skills</strong></li>
<li>Existing <strong>labor costs run high</strong></li>
</ol>
<blockquote>
<p><strong>The outsourcing decision in one sentence: &quot;buy the function, or build it.&quot;</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="51" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="outsourcing--in-the-examples">Outsourcing — in the examples</h2>
<p>The snack box meets the first trigger:</p>
<ul>
<li>Pre-orders outgrow the group chat — families want a real ordering system</li>
<li>Neither the founder nor the cousin can code</li>
<li>They pay someone to build a simple order page</li>
</ul>
<blockquote>
<p><strong>Hiring the skill for a fee beat learning it for a season.</strong> The function moved outside because the skill didn't exist inside.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="52" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="outsourcing--the-second-trigger">Outsourcing — the second trigger</h2>
<p>A business might also outsource when <strong>labor costs run high:</strong></p>
<ul>
<li>A company in a high-wage city hires an outside firm to run customer support from a lower-cost region</li>
<li>A manufacturer contracts packaging to a third party because building a packaging line is too expensive</li>
</ul>
<blockquote>
<p><strong>Two triggers, same decision:</strong> the function moves outside when <strong>building it in-house costs more</strong> — in money, time, or both.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="53" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="outsourcing-vs-core-competency">Outsourcing vs. core competency</h2>
<blockquote>
<p><strong>Outsourcing is the opposite of developing a core competency.</strong></p>
</blockquote>
<table>
<thead>
<tr>
<th></th>
<th>Core competency</th>
<th>Outsourcing</th>
</tr>
</thead>
<tbody>
<tr>
<td>Direction</td>
<td>Develop a function <strong>in-house</strong></td>
<td>Move a function <strong>outside</strong></td>
</tr>
<tr>
<td>Why</td>
<td>The function is a source of <strong>competitive advantage</strong></td>
<td>The function is a <strong>cost to manage</strong></td>
</tr>
<tr>
<td>Example</td>
<td>The snack box's halftime handoff (a skill they built)</td>
<td>The order page (a skill they bought)</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>If a function is your edge, keep it. If a function is a cost, buy it.</strong> The exam tests this distinction.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-class="invert" data-theme="default" class="invert" data-marpit-pagination="54" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--class:invert;--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>

<h1 id="your-turn--apply-the-concepts">Your turn — apply the concepts</h1>
<p><em>Read the scenario. Identify the concept. Explain your reasoning.</em></p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="55" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="discussion-scenario">Discussion scenario</h2>
<p>A small bakery makes everything in-house. Demand for wedding cakes is growing, but the bakery has no one trained in cake decorating. The owner considers two options:</p>
<ol>
<li><strong>Hire and train</strong> a cake decorator (build the skill)</li>
<li><strong>Contract</strong> a freelance cake decorator for each order (buy the skill)</li>
</ol>
<blockquote>
<p><strong>Pair up. 2 minutes.</strong></p>
</blockquote>
<ol>
<li>What is the outsourcing decision here — buy or build?</li>
<li>What are the tradeoffs of each option?</li>
<li>Which option would you recommend, and why?</li>
</ol>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="56" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="discussion--key-points">Discussion — key points</h2>
<p><strong>Build (hire and train):</strong></p>
<ul>
<li>The skill stays in-house — becomes a potential <strong>core competency</strong></li>
<li>Higher upfront cost (salary, training time)</li>
<li>Long-term control over quality</li>
</ul>
<p><strong>Buy (contract):</strong></p>
<ul>
<li>Lower upfront cost — pay per order</li>
<li>The skill stays <strong>outside</strong> — no core competency built</li>
<li>Less control over quality and availability</li>
</ul>
<blockquote>
<p><strong>The outsourcing decision depends on whether the function is a cost to manage or an edge to build.</strong> Wedding cakes might be the bakery's future — or just a seasonal spike.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="57" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="exam-points-to-remember">Exam points to remember</h2>
<ul>
<li><strong>3-question method:</strong> owners? debts? funding? → run it every time</li>
<li><strong>Control and funding</strong> pull in opposite directions</li>
<li><strong>Liability:</strong> sole prop + partnership = personal; LLC + corporation = shielded</li>
<li><strong>Partnership liability is shared</strong> — not divided by who did the work</li>
<li><strong>One owner = five hats;</strong> partners divide by <strong>strengths and interests</strong></li>
<li><strong>Departments:</strong> six types; <strong>accounting = backward, finance = forward</strong></li>
<li><strong>&quot;Financial&quot; is unreliable</strong> — use the direction test</li>
<li><strong>Outsourcing:</strong> buy vs. build; triggers = missing skills or high costs</li>
<li><strong>Outsourcing ≠ core competency</strong> — one moves out, one develops in</li>
</ul>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-class="invert" data-theme="default" class="invert" data-marpit-pagination="58" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--class:invert;--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>

<h1 id="practice--6-questions">Practice — 6 questions</h1>
<p><strong>4 on one stimulus (Tumble Route)</strong> · <strong>2 standalone</strong></p>
<p>Read → pause → <strong>commit to an answer</strong> → then reveal.</p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-header="AP Business · 1.7 Organization, Roles, and Responsibilities" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="59" style="--paginate:true;--header:AP Business · 1.7 Organization, Roles, and Responsibilities;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="73" data-size="16:9">
<header>AP Business · 1.7 Organization, Roles, and Responsibilities</header>
<h2 id="stimulus-tumble-route">Stimulus: Tumble Route</h2>
<p><strong>Aiko Mori</strong> and <strong>Jordan Lee</strong> started <strong>Tumble Route</strong>, a laundry pickup-and-delivery service, with a <strong>spoken agreement and no legal filings.</strong> Aiko manages the routes, the machines, and the schedule. Jordan handles pricing, advertising, and the accounts.</p>
<p>Last month a customer's <strong>designer jacket was ruined</strong> in a machine. The customer demands <strong>$800.</strong> The partners are weighing two options:</p>
<ol>
