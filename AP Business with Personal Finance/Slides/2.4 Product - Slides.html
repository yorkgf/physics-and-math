<h2 id="what-is-product-development">What is product development?</h2>
<p>Product development is the process of turning a <strong>customer problem</strong> into a product people will <strong>pay for</strong>.</p>
<p>It is not one moment — it is a <strong>sequence of six stages</strong>, each with a different key question.</p>
<blockquote>
<p><strong>The goal at every stage is the same: reduce uncertainty before spending more money.</strong></p>
</blockquote>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-header="AP Business · 2.4 Product" data-footer="Lesson deck — concepts + practice" data-theme="default" data-marpit-pagination="5" style="--paginate:true;--header:AP Business · 2.4 Product;--footer:Lesson deck — concepts + practice;--theme:default;" data-marpit-pagination-total="56" data-size="16:9">
<header>AP Business · 2.4 Product</header>
<h2 id="the-six-stages-at-a-glance">The six stages at a glance</h2>
<table>
<thead>
<tr>
<th>Stage</th>
<th>Key Question</th>
<th>Output</th>
</tr>
</thead>
<tbody>
<tr>
<td>1. Generate Idea</td>
<td>What customer problem can we solve?</td>
<td>List of product concepts</td>
</tr>
<tr>
<td>2. Screen &amp; Refine</td>
<td>Is this idea feasible?</td>
<td>Shortlist of viable ideas</td>
</tr>
<tr>
<td>3. Develop Prototype</td>
<td>What will the product look and function like?</td>
<td>Visual or working model</td>
</tr>
<tr>
<td>4. Test Concept</td>
<td>Does this solve a real problem for real people?</td>
<td>Validated customer interest</td>
</tr>
<tr>
<td>5. Develop MVP</td>
<td>What is the simplest version customers will pay for?</td>
<td>Basic sellable product</td>
</tr>
<tr>
<td>6. Refine with Feedback</td>
<td>What do early users want changed?</td>
<td>Improved product, ready to scale</td>
</tr>
</tbody>
</table>
<footer>Lesson deck — concepts + practice</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-header="AP Business · 2.4 Product" data-footer="Lesson deck — concepts + practice" data-theme="default" data-marpit-pagination="6" style="--paginate:true;--header:AP Business · 2.4 Product;--footer:Lesson deck — concepts + practice;--theme:default;" data-marpit-pagination-total="56" data-size="16:9">
<header>AP Business · 2.4 Product</header>
<h2 id="stage-1--generate-idea">Stage 1 — Generate Idea</h2>
<p>Ideas come from many sources:</p>
<ul>
<li><strong>Customer input</strong> — complaints, reviews, surveys, social media</li>
<li><strong>Brainstorming</strong> — team sessions, design thinking workshops</li>
<li><strong>Observation</strong> — watching how people actually use (or struggle with) existing products</li>
<li><strong>Trend analysis</strong> — spotting gaps in the market</li>
</ul>
<blockquote>
<p><strong>Best ideas start with a problem, not a product.</strong></p>
</blockquote>
<p>If you start with &quot;I want to build X,&quot; you may build something nobody needs.<br />
If you start with &quot;People struggle with Y,&quot; you already have a customer.</p>
<footer>Lesson deck — concepts + practice</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-header="AP Business · 2.4 Product" data-footer="Lesson deck — concepts + practice" data-theme="default" data-marpit-pagination="7" style="--paginate:true;--header:AP Business · 2.4 Product;--footer:Lesson deck — concepts + practice;--theme:default;" data-marpit-pagination-total="56" data-size="16:9">
<header>AP Business · 2.4 Product</header>
<h2 id="stage-2--screen--refine">Stage 2 — Screen &amp; Refine</h2>
<p>Not every idea deserves to move forward. Screening filters out weak concepts <strong>before</strong> you spend money building.</p>
<p><strong>Screening criteria:</strong></p>
<table>
<thead>
<tr>
<th>Factor</th>
<th>Question to Ask</th>
</tr>
</thead>
<tbody>
<tr>
<td>Market size</td>
<td>Are enough people experiencing this problem?</td>
</tr>
<tr>
<td>Competition</td>
<td>Is someone already solving it well? If so, can we do it differently?</td>
</tr>
<tr>
<td>Cost</td>
<td>Can we build this at a price customers will accept?</td>
</tr>
<tr>
<td>Regulatory</td>
<td>Are there legal barriers (safety, patents, licenses)?</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>Screening is an internal exercise — you haven't talked to customers yet.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-header="AP Business · 2.4 Product" data-footer="Lesson deck — concepts + practice" data-theme="default" data-marpit-pagination="8" style="--paginate:true;--header:AP Business · 2.4 Product;--footer:Lesson deck — concepts + practice;--theme:default;" data-marpit-pagination-total="56" data-size="16:9">
<header>AP Business · 2.4 Product</header>
<h2 id="stage-3--develop-prototype">Stage 3 — Develop Prototype</h2>
<p>A prototype is a <strong>preliminary model</strong> of the product.</p>
<p>It can range from:</p>
<ul>
<li>A <strong>sketch or 3D render</strong> (visual prototype)</li>
<li>A <strong>cardboard mockup</strong> (physical prototype)</li>
<li>A <strong>clickable app wireframe</strong> (digital prototype)</li>
<li>A <strong>working model</strong> with real materials (functional prototype)</li>
</ul>
<blockquote>
<p><strong>Prototypes are built to learn, not to sell.</strong><br />
Each version teaches you something — what works, what breaks, what confuses users.</p>
</blockquote>
<footer>Lesson deck — concepts + practice</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-header="AP Business · 2.4 Product" data-footer="Lesson deck — concepts + practice" data-theme="default" data-marpit-pagination="9" style="--paginate:true;--header:AP Business · 2.4 Product;--footer:Lesson deck — concepts + practice;--theme:default;" data-marpit-pagination-total="56" data-size="16:9">
<header>AP Business · 2.4 Product</header>
<h2 id="stage-4--test-concept-with-customers">Stage 4 — Test Concept with Customers</h2>
<p>Concept testing means presenting the idea to <strong>real potential customers</strong> to check:</p>
<ul>
<li>Does this solve a problem <strong>they actually have</strong>?</li>
<li>Would they <strong>pay</strong> for it?</li>
<li>What would make it <strong>better</strong>?</li>
</ul>
<p>This is different from idea screening:</p>
<ul>
<li><strong>Screening</strong> = internal evaluation (costs, competition, regulations)</li>
<li><strong>Concept testing</strong> = external validation (what do real customers think?)</li>
</ul>
<blockquote>
<p><strong>A product that excites your team but bores your customers is not a product.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-header="AP Business · 2.4 Product" data-footer="Lesson deck — concepts + practice" data-theme="default" data-marpit-pagination="10" style="--paginate:true;--header:AP Business · 2.4 Product;--footer:Lesson deck — concepts + practice;--theme:default;" data-marpit-pagination-total="56" data-size="16:9">
<header>AP Business · 2.4 Product</header>
<h2 id="stage-5--develop-mvp">Stage 5 — Develop MVP</h2>
<p><strong>MVP = Minimum Viable Product</strong></p>
<p>The most basic version of a product that includes only <strong>core features</strong> — and that customers are <strong>willing to pay for</strong>.</p>
<table>
<thead>
<tr>
<th>MVP is NOT...</th>
<th>MVP IS...</th>
</tr>
</thead>
<tbody>
<tr>
<td>A prototype (built to explore)</td>
<td>A product (built to sell)</td>
</tr>
<tr>
<td>Full-featured</td>
<td>Core features only</td>
</tr>
<tr>
<td>Perfect</td>
<td>Good enough to learn from</td>
</tr>
<tr>
<td>Free</td>
<td>Something customers pay for</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>The MVP exists to answer one question: &quot;Will real people exchange real money for this?&quot;</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-header="AP Business · 2.4 Product" data-footer="Lesson deck — concepts + practice" data-theme="default" data-marpit-pagination="11" style="--paginate:true;--header:AP Business · 2.4 Product;--footer:Lesson deck — concepts + practice;--theme:default;" data-marpit-pagination-total="56" data-size="16:9">
<header>AP Business · 2.4 Product</header>
<h2 id="stage-6--refine-based-on-feedback">Stage 6 — Refine Based on Feedback</h2>
<p>After early customers use the MVP, collect feedback and improve:</p>
<ul>
<li>Which features do they <strong>love</strong>? → Keep and strengthen</li>
<li>Which features do they <strong>ignore</strong>? → Consider removing</li>
<li>What is <strong>missing</strong>? → Add in next version</li>
<li>What <strong>frustrates</strong> them? → Fix immediately</li>
</ul>
<p>This is an <strong>iterative cycle</strong> — version 1 → feedback → version 2 → feedback → version 3...</p>
<blockquote>
<p><strong>The best products are not designed in one shot. They evolve through repeated customer feedback loops.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-header="AP Business · 2.4 Product" data-footer="Lesson deck — concepts + practice" data-theme="default" data-marpit-pagination="12" style="--paginate:true;--header:AP Business · 2.4 Product;--footer:Lesson deck — concepts + practice;--theme:default;" data-marpit-pagination-total="56" data-size="16:9">
<header>AP Business · 2.4 Product</header>
<h2 id="your-turn--stage-check">Your turn — Stage check</h2>
<p>A small team wants to create a meal-prep app for college students.</p>
<p>They have:</p>
<ul>
<li>Sketched wireframes of the app screens</li>
<li>Surveyed 50 students about meal planning habits</li>
<li>Built a version with only 3 recipes and a shopping list</li>
<li>Found that students want a &quot;share with roommate&quot; feature</li>
</ul>
<p><strong>Which stage are they in?</strong></p>
<footer>Lesson deck — concepts + practice</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-header="AP Business · 2.4 Product" data-footer="Lesson deck — concepts + practice" data-theme="default" data-marpit-pagination="13" style="--paginate:true;--header:AP Business · 2.4 Product;--footer:Lesson deck — concepts + practice;--theme:default;" data-marpit-pagination-total="56" data-size="16:9">
<header>AP Business · 2.4 Product</header>
<h2 id="your-turn--stage-check-answer">Your turn — Stage check answer</h2>
<p>They are in <strong>Stage 6 — Refine Based on Feedback</strong>.</p>
<ul>
<li>Wireframes → Stage 3 (prototype) <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@14.1.2/assets/svg/2705.svg" data-marp-twemoji=""/> done</li>
<li>Surveyed students → Stage 4 (concept testing) <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@14.1.2/assets/svg/2705.svg" data-marp-twemoji=""/> done</li>
<li>Built a basic version → Stage 5 (MVP) <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@14.1.2/assets/svg/2705.svg" data-marp-twemoji=""/> done</li>
<li>Found a missing feature from user feedback → <strong>Stage 6</strong> ← they are here</li>
</ul>
<blockquote>
<p><strong>Key clue: they already have a sellable product AND are learning from early users.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-header="AP Business · 2.4 Product" data-footer="Lesson deck — concepts + practice" data-theme="default" data-marpit-pagination="14" style="--paginate:true;--header:AP Business · 2.4 Product;--footer:Lesson deck — concepts + practice;--theme:default;" data-marpit-pagination-total="56" data-size="16:9">
<header>AP Business · 2.4 Product</header>
<h2 id="%F0%9F%94%91-exam-points-to-remember--product-development"><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@14.1.2/assets/svg/1f511.svg" data-marp-twemoji=""/> Exam points to remember — Product Development</h2>
<table>
<thead>
<tr>
<th>#</th>
<th>Point</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td>The six stages are <strong>sequential</strong> — each reduces uncertainty before the next investment</td>
</tr>
<tr>
<td>2</td>
<td><strong>Screening</strong> (internal) ≠ <strong>Concept testing</strong> (external/customer-facing)</td>
</tr>
<tr>
<td>3</td>
<td>A <strong>prototype</strong> is for exploring; an <strong>MVP</strong> is for selling</td>
</tr>
<tr>
<td>4</td>
<td>The MVP includes only <strong>core features</strong> customers will pay for</td>
</tr>
<tr>
<td>5</td>
<td>Product development is <strong>iterative</strong> — feedback loops refine the product over time</td>
</tr>
<tr>
<td>6</td>
<td><strong>Value proposition</strong> = why a customer should choose your product over competitors</td>
</tr>
</tbody>
</table>
<footer>Lesson deck — concepts + practice</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-header="AP Business · 2.4 Product" data-footer="Lesson deck — concepts + practice" data-theme="default" data-marpit-pagination="15" style="--paginate:true;--header:AP Business · 2.4 Product;--footer:Lesson deck — concepts + practice;--theme:default;" data-marpit-pagination-total="56" data-size="16:9">
<header>AP Business · 2.4 Product</header>
<h2 id="dyson--a-product-development-story">Dyson — A product development story</h2>
<p>James Dyson (born 1947) had already invented the <strong>Ballbarrow</strong> — a wheelbarrow with a ball instead of a wheel. It sold well in the UK, but US competitors <strong>copied the design</strong>. Dyson lost that battle.</p>
<p>Then, while renovating his farmhouse, he noticed his vacuum cleaner <strong>lost suction</strong> every time the bag filled with dust.</p>
<p>At a local sawmill, he observed a <strong>30-foot conical centrifuge</strong> — spinning air that separated sawdust without any filter.</p>
<blockquote>
<p><strong>Dyson's idea: What if a vacuum could use cyclone technology instead of a bag?</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-header="AP Business · 2.4 Product" data-footer="Lesson deck — concepts + practice" data-theme="default" data-marpit-pagination="16" style="--paginate:true;--header:AP Business · 2.4 Product;--footer:Lesson deck — concepts + practice;--theme:default;" data-marpit-pagination-total="56" data-size="16:9">
<header>AP Business · 2.4 Product</header>
<h2 id="dyson--5127-prototypes">Dyson — 5,127 prototypes</h2>
<p>Dyson spent <strong>five years</strong> (1979–1984) building prototypes in a barn behind his house.</p>
<ul>
<li><strong>Prototype 1:</strong> Did not work at all</li>
<li><strong>Prototype 500:</strong> Partial suction, but air leaked</li>
<li><strong>Prototype 2,000:</strong> Cyclone worked, but the machine was too large</li>
<li><strong>Prototype 5,127:</strong> Finally worked perfectly</li>
</ul>
<p>He had <strong>no income</strong> during this period. His wife supported the family by teaching art.</p>
<blockquote>
<p><strong>Each failed prototype was not wasted — it was a lesson that informed the next version.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-header="AP Business · 2.4 Product" data-footer="Lesson deck — concepts + practice" data-theme="default" data-marpit-pagination="17" style="--paginate:true;--header:AP Business · 2.4 Product;--footer:Lesson deck — concepts + practice;--theme:default;" data-marpit-pagination-total="56" data-size="16:9">
<header>AP Business · 2.4 Product</header>
<h2 id="dyson--rejection-and-mvp">Dyson — Rejection and MVP</h2>
<p>When Dyson approached vacuum manufacturers with his working prototype:</p>
<ul>
<li><strong>Every major brand refused</strong> to license it</li>
<li>Why? They made <strong>billions selling replacement bags</strong> — a bagless vacuum would destroy that revenue stream</li>
</ul>
<p>So Dyson <strong>manufactured it himself</strong>:</p>
<ul>
<li>Launched the <strong>G-Force</strong> in Japan (1986) — sold for $2,000, a premium price</li>
<li>Japan launch = <strong>MVP test</strong> — would customers pay for bagless technology?</li>
<li>Japanese customers loved it → validated the concept</li>
</ul>
<blockquote>
<p><strong>The G-Force was Dyson's MVP: the simplest version of his technology, sold to test demand.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-header="AP Business · 2.4 Product" data-footer="Lesson deck — concepts + practice" data-theme="default" data-marpit-pagination="18" style="--paginate:true;--header:AP Business · 2.4 Product;--footer:Lesson deck — concepts + practice;--theme:default;" data-marpit-pagination-total="56" data-size="16:9">
<header>AP Business · 2.4 Product</header>
<h2 id="dyson--from-mvp-to-global-brand">Dyson — From MVP to global brand</h2>
<p>After Japan validated demand, Dyson launched the <strong>DC01</strong> in the UK (1993):</p>
<ul>
<li>Priced <strong>twice</strong> as high as competitor vacuums</li>
<li>Became the <strong>#1 selling vacuum</strong> in the UK within 18 months</li>
<li>Expanded to the US, Europe, and Asia</li>
</ul>
<p><strong>Key product development stages in Dyson's story:</strong></p>
<table>
<thead>
<tr>
<th>Stage</th>
<th>Dyson's Action</th>
</tr>
</thead>
<tbody>
<tr>
<td>Generate Idea</td>
<td>Saw industrial cyclone at sawmill</td>
</tr>
<tr>
<td>Screen &amp; Refine</td>
<td>Analyzed vacuum market, found bag pain point</td>
</tr>
<tr>
<td>Develop Prototype</td>
<td>5,127 versions over 5 years</td>
</tr>
<tr>
<td>Test Concept</td>
<td>Showed working prototype to manufacturers (rejected)</td>
</tr>
<tr>
<td>Develop MVP</td>
<td>G-Force launch in Japan (1986)</td>
</tr>
<tr>
<td>Refine with Feedback</td>
<td>DC01 in UK (1993) — refined design, price, and features</td>
</tr>
</tbody>
</table>
<footer>Lesson deck — concepts + practice</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-header="AP Business · 2.4 Product" data-footer="Lesson deck — concepts + practice" data-theme="default" data-marpit-pagination="19" style="--paginate:true;--header:AP Business · 2.4 Product;--footer:Lesson deck — concepts + practice;--theme:default;" data-marpit-pagination-total="56" data-size="16:9">
<header>AP Business · 2.4 Product</header>
<h2 id="dyson--case-discussion">Dyson — Case discussion</h2>
<p>Watch the case study video:<br />
<strong>&quot;The Dyson Story: From Vacuum Revolution to Global Success&quot;</strong></p>
<p><a href="https://www.youtube.com/watch?v=nyvax5Sl-N8">https://www.youtube.com/watch?v=nyvax5Sl-N8</a></p>
<p><strong>While watching, look for:</strong></p>
<ol>
<li>How did the <strong>Ballbarrow failure</strong> shape Dyson's approach to the vacuum idea?</li>
<li>Why did <strong>every manufacturer reject</strong> his working prototype — and what does that tell us about idea screening?</li>
<li>Why was the <strong>Japan launch</strong> (G-Force, $2,000) an example of an MVP — not just another prototype?</li>
<li>The <strong>Contra Rotator washing machine</strong> had great reviews but failed commercially. Which stage of product development went wrong?</li>
<li>Dyson invested <strong>$2.5 billion</strong> in an electric car, then cancelled. Is that a failure or good product portfolio management?</li>
</ol>
<footer>Lesson deck — concepts + practice</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-header="AP Business · 2.4 Product" data-footer="Lesson deck — concepts + practice" data-class="lead" data-theme="default" class="lead" data-marpit-pagination="20" style="--paginate:true;--header:AP Business · 2.4 Product;--footer:Lesson deck — concepts + practice;--class:lead;--theme:default;" data-marpit-pagination-total="56" data-size="16:9">
<header>AP Business · 2.4 Product</header>

<h1 id="part-2-branding">Part 2: Branding</h1>
<h3 id="lo-24b--building-identity-and-trust">LO 2.4.B — Building identity and trust</h3>
<footer>Lesson deck — concepts + practice</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-header="AP Business · 2.4 Product" data-footer="Lesson deck — concepts + practice" data-theme="default" data-marpit-pagination="21" style="--paginate:true;--header:AP Business · 2.4 Product;--footer:Lesson deck — concepts + practice;--theme:default;" data-marpit-pagination-total="56" data-size="16:9">
<header>AP Business · 2.4 Product</header>
<h2 id="what-is-a-brand">What is a brand?</h2>
<p>A <strong>brand</strong> is a name, term, design, symbol, or combination that <strong>identifies and differentiates</strong> a company's products from competitors.</p>
<p>Examples:</p>
<ul>
<li><strong>Apple</strong> — minimalist design, innovation, premium pricing</li>
<li><strong>Nike</strong> — athletic performance, &quot;Just Do It&quot; attitude</li>
<li><strong>Dyson</strong> — engineering excellence, premium innovation</li>
</ul>
<blockquote>
<p><strong>A brand is not a logo. A brand is what customers feel when they see that logo.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-header="AP Business · 2.4 Product" data-footer="Lesson deck — concepts + practice" data-theme="default" data-marpit-pagination="22" style="--paginate:true;--header:AP Business · 2.4 Product;--footer:Lesson deck — concepts + practice;--theme:default;" data-marpit-pagination-total="56" data-size="16:9">
<header>AP Business · 2.4 Product</header>
<h2 id="brand-vs-branding-vs-brand-equity">Brand vs. Branding vs. Brand Equity</h2>
<table>
<thead>
<tr>
<th>Concept</th>
<th>What It Is</th>
<th>Example</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Brand</strong></td>
<td>The identifiable mark (name, logo, symbol)</td>
<td>The Dyson logo and name</td>
</tr>
<tr>
<td><strong>Branding</strong></td>
<td>The strategic process of shaping customer perception over time</td>
<td>Dyson's consistent message: &quot;Better engineering, no compromise&quot;</td>
</tr>
<tr>
<td><strong>Brand Equity</strong></td>
<td>The added financial value from customer recognition, trust, and loyalty</td>
<td>Customers pay $500+ for a Dyson vacuum when a $100 vacuum exists</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>Branding builds brand equity over time. You cannot buy equity — you earn it.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-header="AP Business · 2.4 Product" data-footer="Lesson deck — concepts + practice" data-theme="default" data-marpit-pagination="23" style="--paginate:true;--header:AP Business · 2.4 Product;--footer:Lesson deck — concepts + practice;--theme:default;" data-marpit-pagination-total="56" data-size="16:9">
<header>AP Business · 2.4 Product</header>
<h2 id="why-does-branding-matter">Why does branding matter?</h2>
<p>Branding creates <strong>three advantages</strong>:</p>
<ol>
<li><strong>Differentiation</strong> — In a crowded market, a strong brand stands out</li>
<li><strong>Trust and loyalty</strong> — Customers return to brands they recognize and trust</li>
<li><strong>Pricing power</strong> — Strong brands can charge more because customers perceive higher value</li>
</ol>
<blockquote>
<p><strong>Brand equity is the reason a $50 t-shirt with a logo sells better than a $10 t-shirt without one.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-header="AP Business · 2.4 Product" data-footer="Lesson deck — concepts + practice" data-theme="default" data-marpit-pagination="24" style="--paginate:true;--header:AP Business · 2.4 Product;--footer:Lesson deck — concepts + practice;--theme:default;" data-marpit-pagination-total="56" data-size="16:9">
<header>AP Business · 2.4 Product</header>
<h2 id="building-brand-equity--consistency-is-key">Building brand equity — Consistency is key</h2>
<p>Brand equity is built through <strong>consistent branding across every touchpoint</strong>:</p>
<table>
<thead>
<tr>
<th>Touchpoint</th>
<th>What It Communicates</th>
</tr>
</thead>
<tbody>
<tr>
<td>Packaging</td>
<td>Quality, personality, values</td>
</tr>
<tr>
<td>Advertising</td>
<td>Message, tone, target audience</td>
</tr>
<tr>
<td>Social media</td>
<td>Voice, engagement, authenticity</td>
</tr>
<tr>
<td>Customer service</td>
<td>Care, reliability, responsiveness</td>
</tr>
<tr>
<td>Product design</td>
<td>Innovation, attention to detail</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>One bad experience at any touchpoint can damage years of brand building.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-header="AP Business · 2.4 Product" data-footer="Lesson deck — concepts + practice" data-theme="default" data-marpit-pagination="25" style="--paginate:true;--header:AP Business · 2.4 Product;--footer:Lesson deck — concepts + practice;--theme:default;" data-marpit-pagination-total="56" data-size="16:9">
<header>AP Business · 2.4 Product</header>
<h2 id="dyson--branding-strategy">Dyson — Branding strategy</h2>
<p>Dyson built one of the strongest brands in consumer electronics:</p>
<table>
<thead>
<tr>
<th>Brand Element</th>
<th>How Dyson Does It</th>
</tr>
</thead>
<tbody>
<tr>
<td>Product design</td>
<td>Distinctive industrial look — you recognize a Dyson instantly</td>
</tr>
<tr>
<td>Pricing</td>
<td>Always premium — signals quality and innovation</td>
</tr>
<tr>
<td>Advertising</td>
<td>&quot;Say goodbye to the bag&quot; — focused on solving the customer's pain point</td>
</tr>
<tr>
<td>R&amp;D investment</td>
<td><strong>15–20% of annual revenue</strong> on R&amp;D; labs in UK, Singapore, US</td>
</tr>
<tr>
<td>Patents</td>
<td><strong>~6,000</strong> granted and pending patents — protects innovation from imitation</td>
</tr>
<tr>
<td>Leadership</td>
<td>James Dyson hired a CEO so he could personally focus on design and engineering</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>Dyson's brand message is consistent: &quot;We engineer things better.&quot;</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-header="AP Business · 2.4 Product" data-footer="Lesson deck — concepts + practice" data-theme="default" data-marpit-pagination="26" style="--paginate:true;--header:AP Business · 2.4 Product;--footer:Lesson deck — concepts + practice;--theme:default;" data-marpit-pagination-total="56" data-size="16:9">
<header>AP Business · 2.4 Product</header>
<h2 id="dyson--brand-equity-in-action">Dyson — Brand equity in action</h2>
<p>Why do customers pay <strong>2–3x more</strong> for a Dyson vacuum?</p>
<ul>
<li>They trust the brand to deliver <strong>superior performance</strong></li>
<li>The distinctive design <strong>signals quality</strong> to visitors in their home</li>
<li>Years of consistent messaging created <strong>perceived value</strong> beyond the product</li>
</ul>
<blockquote>
<p><strong>Brand equity turns a $150 manufacturing cost into a $500 retail price — and customers feel they got a good deal.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-header="AP Business · 2.4 Product" data-footer="Lesson deck — concepts + practice" data-theme="default" data-marpit-pagination="27" style="--paginate:true;--header:AP Business · 2.4 Product;--footer:Lesson deck — concepts + practice;--theme:default;" data-marpit-pagination-total="56" data-size="16:9">
<header>AP Business · 2.4 Product</header>
<h2 id="your-turn--brand-check">Your turn — Brand check</h2>
<p>A new coffee shop opens in a neighborhood with 6 existing coffee shops.</p>
<p>They name it &quot;Coffee Shop&quot; with a plain white sign and generic cups.</p>
<p><strong>What is the branding problem, and what would you recommend?</strong></p>
<footer>Lesson deck — concepts + practice</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-header="AP Business · 2.4 Product" data-footer="Lesson deck — concepts + practice" data-theme="default" data-marpit-pagination="28" style="--paginate:true;--header:AP Business · 2.4 Product;--footer:Lesson deck — concepts + practice;--theme:default;" data-marpit-pagination-total="56" data-size="16:9">
<header>AP Business · 2.4 Product</header>
<h2 id="your-turn--brand-check-answer">Your turn — Brand check answer</h2>
<p><strong>Problem:</strong> No differentiation. &quot;Coffee Shop&quot; tells customers nothing about why this shop is different from the 6 others.</p>
<p><strong>Recommendations:</strong></p>
<ul>
<li>Choose a <strong>distinctive name</strong> that communicates a value proposition</li>
<li>Design a <strong>logo and visual identity</strong> that stands out</li>
<li>Use <strong>consistent packaging</strong> (cups, bags, signage) to build recognition</li>
<li>Define a <strong>brand voice</strong> — what does this coffee shop stand for? (local beans? cozy atmosphere? speed?)</li>
</ul>
<blockquote>
<p><strong>Branding is not decoration — it is a strategic decision about how customers will perceive and remember you.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-header="AP Business · 2.4 Product" data-footer="Lesson deck — concepts + practice" data-theme="default" data-marpit-pagination="29" style="--paginate:true;--header:AP Business · 2.4 Product;--footer:Lesson deck — concepts + practice;--theme:default;" data-marpit-pagination-total="56" data-size="16:9">

<header>AP Business · 2.4 Product</header>

<h1 id="part-3-product-life-cycle">Part 3: Product Life Cycle</h1>
<h3 id="lo-24c--four-stages-four-strategies">LO 2.4.C — Four stages, four strategies</h3>
<footer>Lesson deck — concepts + practice</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-header="AP Business · 2.4 Product" data-footer="Lesson deck — concepts + practice" data-theme="default" data-marpit-pagination="31" style="--paginate:true;--header:AP Business · 2.4 Product;--footer:Lesson deck — concepts + practice;--theme:default;" data-marpit-pagination-total="56" data-size="16:9">
<header>AP Business · 2.4 Product</header>
<h2 id="what-is-the-product-life-cycle">What is the product life cycle?</h2>
<p>The <strong>Product Life Cycle (PLC)</strong> is a model describing the <strong>four stages</strong> every product passes through from launch to withdrawal.</p>
<p>Understanding the PLC helps businesses:</p>
<ul>
<li>Anticipate <strong>changes in sales and profit</strong></li>
<li>Adjust <strong>marketing, production, and financial strategy</strong></li>
<li>Manage a <strong>portfolio</strong> of products at different stages</li>
</ul>
<blockquote>
<p><strong>No product sells forever. Every product has a life cycle — the question is how long each stage lasts.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-header="AP Business · 2.4 Product" data-footer="Lesson deck — concepts + practice" data-theme="default" data-marpit-pagination="32" style="--paginate:true;--header:AP Business · 2.4 Product;--footer:Lesson deck — concepts + practice;--theme:default;" data-marpit-pagination-total="56" data-size="16:9">
<header>AP Business · 2.4 Product</header>
<h2 id="the-four-stages">The four stages</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Sales /
Profit
  │        ╱‾‾‾‾‾‾‾‾╲
  │       ╱  Growth   ╲  Maturity
  │      ╱             ╲________
  │     ╱ Introduction        ╲
  │    ╱                    Decline
  │___╱
  └──────────────────────────────── Time
</code></pre>
<table>
<thead>
<tr>
<th>Stage</th>
<th>Sales</th>
<th>Profit</th>
<th>Competition</th>
</tr>
</thead>
<tbody>
<tr>
<td>Introduction</td>
<td>Low, slowly rising</td>
<td>Negative (losses)</td>
<td>Few or none</td>
</tr>
<tr>
<td>Growth</td>
<td>Rapidly increasing</td>
<td>Turning positive</td>
<td>Entering fast</td>
</tr>
<tr>
<td>Maturity</td>
<td>Peak, slowing</td>
<td>High but pressured</td>
<td>Heavy, price wars</td>
</tr>
<tr>
<td>Decline</td>
<td>Falling</td>
<td>Shrinking</td>
<td>Exiting</td>
</tr>
</tbody>
</table>
<footer>Lesson deck — concepts + practice</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-header="AP Business · 2.4 Product" data-footer="Lesson deck — concepts + practice" data-theme="default" data-marpit-pagination="33" style="--paginate:true;--header:AP Business · 2.4 Product;--footer:Lesson deck — concepts + practice;--theme:default;" data-marpit-pagination-total="56" data-size="16:9">
<header>AP Business · 2.4 Product</header>
<h2 id="stage-1--introduction">Stage 1 — Introduction</h2>
<p><strong>What happens:</strong></p>
<ul>
<li>Product just launched — most customers <strong>don't know it exists</strong></li>
<li>Sales are <strong>low</strong> and grow slowly</li>
<li>Costs are <strong>high</strong> (R&amp;D, production setup, promotion)</li>
<li>The business often operates at a <strong>loss</strong></li>
</ul>
<p><strong>Strategy focus:</strong></p>
<ul>
<li>Build <strong>awareness</strong> — advertising, demonstrations, free trials</li>
<li>Educate <strong>early adopters</strong> — explain why this product matters</li>
<li>Invest heavily in <strong>promotion</strong> — customers need a reason to try something new</li>
</ul>
<blockquote>
<p><strong>Introduction is about convincing the market that your product exists and is worth trying.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-header="AP Business · 2.4 Product" data-footer="Lesson deck — concepts + practice" data-theme="default" data-marpit-pagination="34" style="--paginate:true;--header:AP Business · 2.4 Product;--footer:Lesson deck — concepts + practice;--theme:default;" data-marpit-pagination-total="56" data-size="16:9">
<header>AP Business · 2.4 Product</header>
<h2 id="stage-2--growth">Stage 2 — Growth</h2>
<p><strong>What happens:</strong></p>
<ul>
<li>Sales rise <strong>rapidly</strong> — word spreads, demand accelerates</li>
<li>Profits begin to appear as <strong>economies of scale</strong> reduce unit costs</li>
<li><strong>Competitors enter</strong> the market, attracted by visible demand</li>
</ul>
<p><strong>Strategy focus:</strong></p>
<ul>
<li><strong>Expand distribution</strong> — get the product into more stores, channels, regions</li>
<li><strong>Differentiate</strong> from new competitors — improve features, branding, service</li>
<li><strong>Scale production</strong> — invest in capacity to meet rising demand</li>
</ul>
<blockquote>
<p><strong>Growth is exciting but dangerous — competitors arrive just as the market gets profitable.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-header="AP Business · 2.4 Product" data-footer="Lesson deck — concepts + practice" data-theme="default" data-marpit-pagination="35" style="--paginate:true;--header:AP Business · 2.4 Product;--footer:Lesson deck — concepts + practice;--theme:default;" data-marpit-pagination-total="56" data-size="16:9">
<header>AP Business · 2.4 Product</header>
<h2 id="stage-3--maturity">Stage 3 — Maturity</h2>
<p><strong>What happens:</strong></p>
<ul>
<li>Sales reach their <strong>peak</strong> but growth slows</li>
<li>The market is <strong>saturated</strong> — most potential customers already have the product</li>
<li>Competition is <strong>heaviest</strong> — many competitors fight for the same customers</li>
<li><strong>Price wars</strong> become common</li>
</ul>
<p><strong>Strategy focus:</strong></p>
<ul>
<li><strong>Defend market share</strong> — loyalty programs, brand reinforcement</li>
<li><strong>Optimize costs</strong> — improve efficiency to protect margins</li>
<li><strong>Product extensions</strong> — new features, new colors, limited editions</li>
</ul>
<blockquote>
<p><strong>Maturity is about holding your position, not expanding it.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-header="AP Business · 2.4 Product" data-footer="Lesson deck — concepts + practice" data-theme="default" data-marpit-pagination="36" style="--paginate:true;--header:AP Business · 2.4 Product;--footer:Lesson deck — concepts + practice;--theme:default;" data-marpit-pagination-total="56" data-size="16:9">
<header>AP Business · 2.4 Product</header>
<h2 id="stage-4--decline">Stage 4 — Decline</h2>
<p><strong>What happens:</strong></p>
<ul>
<li>Sales <strong>fall</strong> as customer preferences shift or new technology arrives</li>
<li>Profits <strong>shrink</strong> — the business must decide what to do</li>
</ul>
<p><strong>Three strategic options:</strong></p>
<table>
<thead>
<tr>
<th>Option</th>
<th>When to Choose</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Reduce investment</strong></td>
<td>Harvest remaining profits with minimal spending</td>
</tr>
<tr>
<td><strong>Discontinue</strong></td>
<td>Exit the market and redirect resources</td>
</tr>
<tr>
<td><strong>Reinvent</strong></td>
<td>Update the product to start a new life cycle</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>Decline is not failure — it is a signal to make a strategic decision.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-header="AP Business · 2.4 Product" data-footer="Lesson deck — concepts + practice" data-theme="default" data-marpit-pagination="37" style="--paginate:true;--header:AP Business · 2.4 Product;--footer:Lesson deck — concepts + practice;--theme:default;" data-marpit-pagination-total="56" data-size="16:9">
<header>AP Business · 2.4 Product</header>
<h2 id="product-portfolio-management">Product portfolio management</h2>
<p>Smart businesses manage <strong>multiple products at different life cycle stages</strong>:</p>
<table>
<thead>
<tr>
<th>Product</th>
<th>PLC Stage</th>
<th>Role in Portfolio</th>
</tr>
</thead>
<tbody>
<tr>
<td>Product A</td>
<td>Maturity</td>
<td>Cash cow — funds other products</td>
</tr>
<tr>
<td>Product B</td>
<td>Growth</td>
<td>Rising star — needs investment to capture market</td>
</tr>
<tr>
<td>Product C</td>
<td>Introduction</td>
<td>Future bet — may succeed or fail</td>
</tr>
<tr>
<td>Product D</td>
<td>Decline</td>
<td>Harvest or exit</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>A portfolio with products in different stages balances risk — when one declines, another grows.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-header="AP Business · 2.4 Product" data-footer="Lesson deck — concepts + practice" data-theme="default" data-marpit-pagination="38" style="--paginate:true;--header:AP Business · 2.4 Product;--footer:Lesson deck — concepts + practice;--theme:default;" data-marpit-pagination-total="56" data-size="16:9">
<header>AP Business · 2.4 Product</header>
<h2 id="dyson--product-life-cycle-in-action">Dyson — Product life cycle in action</h2>

</tr>
</thead>

</tbody>
</table>
<blockquote>
<p><strong>Dyson manages a portfolio: mature vacuums fund the growth of newer product lines. Failed projects teach lessons.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-header="AP Business · 2.4 Product" data-footer="Lesson deck — concepts + practice" data-theme="default" data-marpit-pagination="39" style="--paginate:true;--header:AP Business · 2.4 Product;--footer:Lesson deck — concepts + practice;--theme:default;" data-marpit-pagination-total="56" data-size="16:9">
<header>AP Business · 2.4 Product</header>
<h2 id="your-turn--plc-stage-check">Your turn — PLC stage check</h2>
<p>Match each scenario to its PLC stage:</p>
<ol>
<li>A new electric skateboard launches with a YouTube ad campaign and a $50 discount for the first 100 buyers</li>
<li>A soda brand releases a &quot;limited edition summer flavor&quot; to boost slowing sales</li>
<li>A smartphone model sees sales double each quarter and three competitors release similar products</li>
<li>A DVD rental chain closes 40% of its stores as streaming services dominate</li>

<footer>Lesson deck — concepts + practice</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-header="AP Business · 2.4 Product" data-footer="Lesson deck — concepts + practice" data-theme="default" data-marpit-pagination="40" style="--paginate:true;--header:AP Business · 2.4 Product;--footer:Lesson deck — concepts + practice;--theme:default;" data-marpit-pagination-total="56" data-size="16:9">
<header>AP Business · 2.4 Product</header>
<h2 id="your-turn--plc-stage-check-answer">Your turn — PLC stage check answer</h2>
<ol>
<li><strong>Introduction</strong> — launch promotion, discount to attract early adopters</li>
<li><strong>Maturity</strong> — limited edition = product extension to defend slowing sales</li>
<li><strong>Growth</strong> — rapid sales increase + competitors entering</li>
<li><strong>Decline</strong> — falling sales, closing stores, new technology replacing it</li>
</ol>
<blockquote>
<p><strong>Clues to look for:</strong></p>
<ul>
<li>&quot;Launch&quot; / &quot;first&quot; / &quot;discount for early buyers&quot; → Introduction</li>
<li>&quot;Doubling sales&quot; / &quot;competitors entering&quot; → Growth</li>
<li>&quot;Slowing&quot; / &quot;limited edition&quot; / &quot;saturated&quot; → Maturity</li>
<li>&quot;Closing&quot; / &quot;replaced by&quot; / &quot;falling demand&quot; → Decline</li>
</ul>
</blockquote>
<footer>Lesson deck — concepts + practice</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-header="AP Business · 2.4 Product" data-footer="Lesson deck — concepts + practice" data-theme="default" data-marpit-pagination="41" style="--paginate:true;--header:AP Business · 2.4 Product;--footer:Lesson deck — concepts + practice;--theme:default;" data-marpit-pagination-total="56" data-size="16:9">
<header>AP Business · 2.4 Product</header>
<h2 id="%F0%9F%94%91-exam-points-to-remember--product-life-cycle"><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@14.1.2/assets/svg/1f511.svg" data-marp-twemoji=""/> Exam points to remember — Product Life Cycle</h2>
<table>
<thead>
<tr>
<th>#</th>
<th>Point</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td>Four stages: <strong>Introduction → Growth → Maturity → Decline</strong></td>
</tr>
<tr>
<td>2</td>
<td>Each stage requires <strong>different</strong> marketing, production, and financial strategies</td>
</tr>
<tr>
<td>3</td>
<td><strong>Introduction</strong>: low sales, high costs, losses; focus on awareness</td>
</tr>
<tr>
<td>4</td>
<td><strong>Growth</strong>: rising sales, new competitors; focus on expansion and differentiation</td>
</tr>
<tr>
<td>5</td>
<td><strong>Maturity</strong>: peak sales, heavy competition, price wars; focus on defending share</td>
</tr>
<tr>
<td>6</td>
<td><strong>Decline</strong>: falling sales; reduce, discontinue, or reinvent</td>
</tr>
<tr>
<td>7</td>
<td><strong>Product portfolio management</strong> = managing multiple products at different PLC stages</td>
</tr>
</tbody>
</table>
<footer>Lesson deck — concepts + practice</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-header="AP Business · 2.4 Product" data-footer="Lesson deck — concepts + practice" data-theme="default" data-marpit-pagination="42" style="--paginate:true;--header:AP Business · 2.4 Product;--footer:Lesson deck — concepts + practice;--theme:default;" data-marpit-pagination-total="56" data-size="16:9">
<header>AP Business · 2.4 Product</header>
<h2 id="practice--stimulus">Practice — Stimulus</h2>
<p><strong>Artisan Pops</strong> is a small company that makes gourmet ice pops using local fruit.</p>
<ul>
<li><strong>Year 1:</strong> Sold at one farmers' market; 120 pops/week; lost money on a rented freezer cart and custom molds</li>
<li><strong>Year 2:</strong> Added two farmers' markets and a food truck; sales tripled; two copycat brands appeared</li>
<li><strong>Year 3:</strong> Sold in 15 grocery stores; sales grew 20%; launched a &quot;tropical collection&quot; with mango and passion fruit flavors</li>
<li><strong>Year 4:</strong> Sales flatlined; grocery stores demanded slotting fees; a new competitor launched organic pops at a lower price</li>
</ul>
<footer>Lesson deck — concepts + practice</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-header="AP Business · 2.4 Product" data-footer="Lesson deck — concepts + practice" data-theme="default" data-marpit-pagination="43" style="--paginate:true;--header:AP Business · 2.4 Product;--footer:Lesson deck — concepts + practice;--theme:default;" data-marpit-pagination-total="56" data-size="16:9">
<header>AP Business · 2.4 Product</header>
<h2 id="practice--q1">Practice — Q1</h2>
<blockquote>
<p>In Year 1, Artisan Pops operated at a loss despite selling 120 pops per week. Which statement <strong>best</strong> explains why?</p>
</blockquote>
<blockquote>
<p>A. The company failed to screen its idea before launching</p>
<p>B. The costs of the freezer cart and custom molds exceeded early revenue</p>
<p>C. The company should have launched in grocery stores first</p>
<p>D. Customer demand was too low to support the business</p>
</blockquote>
<footer>Lesson deck — concepts + practice</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-header="AP Business · 2.4 Product" data-footer="Lesson deck — concepts + practice" data-theme="default" data-marpit-pagination="44" style="--paginate:true;--header:AP Business · 2.4 Product;--footer:Lesson deck — concepts + practice;--theme:default;" data-marpit-pagination-total="56" data-size="16:9">
<header>AP Business · 2.4 Product</header>
<h2 id="practice--q1-answer">Practice — Q1 answer</h2>
<p><strong>Answer: B.</strong></p>
<p>In the introduction stage, fixed costs (equipment, setup) are high and sales volume is low. Revenue from 120 pops/week did not cover the rental and mold costs.</p>
<p><strong>Traps:</strong></p>
<ul>
<li><strong>A</strong> — Screening happened before launch; the question asks about Year 1 performance</li>
<li><strong>C</strong> — Farmers' markets are a common MVP launch channel; there is no evidence grocery stores would have been better</li>
<li><strong>D</strong> — 120 pops/week is decent demand; the problem is cost structure, not demand</li>
</ul>
<blockquote>
<p><strong>In the introduction stage, losses are normal — high fixed costs + low volume = operating at a deficit.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-header="AP Business · 2.4 Product" data-footer="Lesson deck — concepts + practice" data-theme="default" data-marpit-pagination="45" style="--paginate:true;--header:AP Business · 2.4 Product;--footer:Lesson deck — concepts + practice;--theme:default;" data-marpit-pagination-total="56" data-size="16:9">
<header>AP Business · 2.4 Product</header>
<h2 id="practice--q2">Practice — Q2</h2>
<blockquote>
<p>In Year 2, two copycat brands appeared. This is most consistent with which stage of the product life cycle?</p>
</blockquote>
<blockquote>
<p>A. Introduction — competitors test the concept</p>
<p>B. Growth — visible demand attracts new entrants</p>
<p>C. Maturity — all competitors are already established</p>
<p>D. Decline — competitors try to capture remaining demand</p>
</blockquote>
<footer>Lesson deck — concepts + practice</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-header="AP Business · 2.4 Product" data-footer="Lesson deck — concepts + practice" data-theme="default" data-marpit-pagination="46" style="--paginate:true;--header:AP Business · 2.4 Product;--footer:Lesson deck — concepts + practice;--theme:default;" data-marpit-pagination-total="56" data-size="16:9">
<header>AP Business · 2.4 Product</header>
<h2 id="practice--q2-answer">Practice — Q2 answer</h2>
<p><strong>Answer: B.</strong></p>
<p>Sales tripled (rapid growth signal), and competitors entered because they could see the demand. This is the hallmark of the growth stage.</p>
<p><strong>Traps:</strong></p>
<ul>
<li><strong>A</strong> — In introduction, few or no competitors exist; the market is unproven</li>
<li><strong>C</strong> — Maturity has heavy existing competition, not new entrants arriving</li>
<li><strong>D</strong> — Decline has falling sales, not tripling sales</li>
</ul>
<blockquote>
<p><strong>&quot;Sales rising fast + competitors appearing&quot; = growth stage every time.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-header="AP Business · 2.4 Product" data-footer="Lesson deck — concepts + practice" data-theme="default" data-marpit-pagination="47" style="--paginate:true;--header:AP Business · 2.4 Product;--footer:Lesson deck — concepts + practice;--theme:default;" data-marpit-pagination-total="56" data-size="16:9">
<header>AP Business · 2.4 Product</header>
<h2 id="practice--q3">Practice — Q3</h2>
<blockquote>
<p>Artisan Pops launched the &quot;tropical collection&quot; in Year 3. This is an example of:</p>
</blockquote>
<blockquote>
<p>A. Product development — generating a new idea</p>
<p>B. Product extension — adding variations to a mature product</p>
<p>C. Brand repositioning — changing how customers see the brand</p>
<p>D. Market penetration — entering a new geographic market</p>
</blockquote>
<footer>Lesson deck — concepts + practice</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-header="AP Business · 2.4 Product" data-footer="Lesson deck — concepts + practice" data-theme="default" data-marpit-pagination="48" style="--paginate:true;--header:AP Business · 2.4 Product;--footer:Lesson deck — concepts + practice;--theme:default;" data-marpit-pagination-total="56" data-size="16:9">
<header>AP Business · 2.4 Product</header>
<h2 id="practice--q3-answer">Practice — Q3 answer</h2>
<p><strong>Answer: B.</strong></p>
<p>Adding new flavors (mango, passion fruit) to an existing product line is a classic product extension strategy used during the maturity stage to boost slowing sales.</p>
<p><strong>Traps:</strong></p>
<ul>
<li><strong>A</strong> — This is not a new product; it is a new flavor of the same product</li>
<li><strong>C</strong> — The brand positioning did not change; only the product variety expanded</li>
<li><strong>D</strong> — Market penetration means selling more of the same product in the same market; new flavors are product variation, not market expansion</li>
</ul>
<blockquote>
<p><strong>Product extension = new variations of the same product to re-energize sales.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-header="AP Business · 2.4 Product" data-footer="Lesson deck — concepts + practice" data-theme="default" data-marpit-pagination="49" style="--paginate:true;--header:AP Business · 2.4 Product;--footer:Lesson deck — concepts + practice;--theme:default;" data-marpit-pagination-total="56" data-size="16:9">
<header>AP Business · 2.4 Product</header>
<h2 id="practice--q4">Practice — Q4</h2>
<blockquote>
<p>In Year 4, grocery stores demanded slotting fees and a new competitor launched organic pops at a lower price. Which PLC stage is Artisan Pops most likely entering?</p>
</blockquote>
<blockquote>
<p>A. Introduction — still paying to enter the market</p>
<p>B. Growth — expanding distribution with new costs</p>
<p>C. Maturity — saturated market, intense competition, margin pressure</p>
<p>D. Decline — sales have already fallen to zero</p>
</blockquote>
<footer>Lesson deck — concepts + practice</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-header="AP Business · 2.4 Product" data-footer="Lesson deck — concepts + practice" data-theme="default" data-marpit-pagination="50" style="--paginate:true;--header:AP Business · 2.4 Product;--footer:Lesson deck — concepts + practice;--theme:default;" data-marpit-pagination-total="56" data-size="16:9">
<header>AP Business · 2.4 Product</header>
<h2 id="practice--q4-answer">Practice — Q4 answer</h2>
<p><strong>Answer: C.</strong></p>
<p>Sales flatlined (saturation), slotting fees squeeze margins, and a competitor is undercutting on price. All three are signals of the maturity stage.</p>
<p><strong>Traps:</strong></p>
<ul>
<li><strong>A</strong> — Slotting fees are a retailer demand, not a launch cost; the product is already in stores</li>
<li><strong>B</strong> — Sales are not rising; &quot;flatlined&quot; ≠ growth</li>
<li><strong>D</strong> — Sales have not fallen to zero; they have plateaued. Decline requires falling sales</li>
</ul>
<blockquote>
<p><strong>Flat sales + margin pressure + price competition = maturity. Falling sales = decline.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-header="AP Business · 2.4 Product" data-footer="Lesson deck — concepts + practice" data-theme="default" data-marpit-pagination="51" style="--paginate:true;--header:AP Business · 2.4 Product;--footer:Lesson deck — concepts + practice;--theme:default;" data-marpit-pagination-total="56" data-size="16:9">
<header>AP Business · 2.4 Product</header>
<h2 id="practice--q5">Practice — Q5</h2>
<blockquote>
<p>Artisan Pops wants to avoid decline. Which strategy is <strong>most</strong> appropriate for a product in the late maturity stage?</p>
</blockquote>
<blockquote>
<p>A. Increase prices to maximize revenue from loyal customers</p>
<p>B. Reduce investment and harvest remaining profits</p>
<p>C. Launch a new product line to diversify the portfolio while defending the existing brand</p>
<p>D. Discontinue the product before losses begin</p>
</blockquote>
<footer>Lesson deck — concepts + practice</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-header="AP Business · 2.4 Product" data-footer="Lesson deck — concepts + practice" data-theme="default" data-marpit-pagination="52" style="--paginate:true;--header:AP Business · 2.4 Product;--footer:Lesson deck — concepts + practice;--theme:default;" data-marpit-pagination-total="56" data-size="16:9">
<header>AP Business · 2.4 Product</header>
<h2 id="practice--q5-answer">Practice — Q5 answer</h2>
<p><strong>Answer: C.</strong></p>
<p>Portfolio diversification (new product lines) is the strongest long-term strategy during late maturity. Defending the existing brand while developing new products balances risk.</p>
<p><strong>Traps:</strong></p>
<ul>
<li><strong>A</strong> — Raising prices in a price-competitive market accelerates customer loss</li>
<li><strong>B</strong> — &quot;Harvest&quot; is a decline-stage strategy; in late maturity, there is still time to reinvest</li>
<li><strong>D</strong> — Discontinuing a product with still-positive sales is premature; reinvention is better</li>
</ul>
<blockquote>
<p><strong>Late maturity strategy: defend what you have + invest in what comes next.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-header="AP Business · 2.4 Product" data-footer="Lesson deck — concepts + practice" data-theme="default" data-marpit-pagination="53" style="--paginate:true;--header:AP Business · 2.4 Product;--footer:Lesson deck — concepts + practice;--theme:default;" data-marpit-pagination-total="56" data-size="16:9">
<header>AP Business · 2.4 Product</header>
<h2 id="practice--q6">Practice — Q6</h2>
<blockquote>
<p>A student says: &quot;Dyson's bagless vacuum is in the decline stage because the technology is old.&quot; Which statement <strong>best</strong> evaluates this claim?</p>
</blockquote>
<blockquote>
<p>A. Correct — old technology always enters decline</p>
<p>B. Incorrect — the vacuum is still in the introduction stage because Dyson keeps launching new models</p>
<p>C. Incorrect — PLC stage is determined by sales trends and competitive dynamics, not by the age of the technology</p>
<p>D. Correct — Dyson should discontinue the vacuum and focus only on hair products</p>
</blockquote>
<footer>Lesson deck — concepts + practice</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-header="AP Business · 2.4 Product" data-footer="Lesson deck — concepts + practice" data-theme="default" data-marpit-pagination="54" style="--paginate:true;--header:AP Business · 2.4 Product;--footer:Lesson deck — concepts + practice;--theme:default;" data-marpit-pagination-total="56" data-size="16:9">
<header>AP Business · 2.4 Product</header>
<h2 id="practice--q6-answer">Practice — Q6 answer</h2>
<p><strong>Answer: C.</strong></p>
<p>The PLC stage is determined by <strong>sales trends, market saturation, and competitive dynamics</strong> — not by how old the underlying technology is. A product with old technology can still be in growth or maturity if sales are strong.</p>
<p><strong>Traps:</strong></p>
<ul>
<li><strong>A</strong> — Age of technology ≠ PLC stage. Many products use old technology and remain in maturity (e.g., bicycles, umbrellas)</li>
<li><strong>B</strong> — New models do not reset the PLC to introduction; they are product extensions within the current stage</li>
<li><strong>D</strong> — The vacuum line still generates significant revenue; discontinuing it would be a poor business decision</li>
</ul>
<blockquote>
<p><strong>PLC stage = what the sales data says, not what the calendar says.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-header="AP Business · 2.4 Product" data-footer="Lesson deck — concepts + practice" data-theme="default" data-marpit-pagination="55" style="--paginate:true;--header:AP Business · 2.4 Product;--footer:Lesson deck — concepts + practice;--theme:default;" data-marpit-pagination-total="56" data-size="16:9">
<header>AP Business · 2.4 Product</header>
<h2 id="trap-patterns-to-watch">Trap patterns to watch</h2>
<table>
<thead>
<tr>
<th>#</th>
<th>Trap type</th>
<th>Where it appears</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td><strong>Cost ≠ demand</strong> — introduction losses come from high fixed costs, not low demand</td>
<td>Q1</td>
</tr>
<tr>
<td>2</td>
<td><strong>&quot;Competitors entering&quot; = growth</strong>, not maturity (maturity = competitors already there)</td>
<td>Q2</td>
</tr>
<tr>
<td>3</td>
<td><strong>New flavors ≠ new product</strong> — product extension is not the same as product development</td>
<td>Q3</td>
</tr>
<tr>
<td>4</td>
<td><strong>Flat sales ≠ decline</strong> — flat sales = maturity; falling sales = decline</td>
<td>Q4</td>
</tr>
<tr>
<td>5</td>
<td><strong>Harvest is a decline strategy</strong> — in maturity, invest in new products instead</td>
<td>Q5</td>
</tr>
<tr>
<td>6</td>
<td><strong>Technology age ≠ PLC stage</strong> — stage is determined by sales data, not by calendar time</td>
<td>Q6</td>
</tr>
</tbody>
</table>
<footer>Lesson deck — concepts + practice</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-header="AP Business · 2.4 Product" data-footer="Lesson deck — concepts + practice" data-theme="default" data-marpit-pagination="56" style="--paginate:true;--header:AP Business · 2.4 Product;--footer:Lesson deck — concepts + practice;--theme:default;" data-marpit-pagination-total="56" data-size="16:9">
<header>AP Business · 2.4 Product</header>
<h2 id="wrap-up--24-product">Wrap-up — 2.4 Product</h2>
<p><strong>What we covered:</strong></p>
<ul>
<li>Product development has <strong>six stages</strong>: idea → screen → prototype → concept test → MVP → refine</li>
<li><strong>Screening</strong> (internal) ≠ <strong>Concept testing</strong> (customer-facing)</li>
<li>A <strong>prototype</strong> explores; an <strong>MVP</strong> sells</li>
<li><strong>Branding</strong> builds identity, trust, and pricing power over time through consistency</li>
<li><strong>Brand equity</strong> = the added value from customer recognition and loyalty</li>
<li><strong>Product life cycle</strong>: Introduction → Growth → Maturity → Decline</li>
<li>Each PLC stage requires <strong>different strategies</strong> for marketing, production, and finance</li>
<li><strong>Product portfolio management</strong> balances risk across multiple products</li>
</ul>
<p><strong>Coming up next:</strong> 2.5 Price — you know what to build and what to call it. Now: <strong>how much do you charge?</strong></p>
<footer>Lesson deck — concepts + practice</footer>
