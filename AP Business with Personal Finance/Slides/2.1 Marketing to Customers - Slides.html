<h2 id="todays-goals">Today's goals</h2>
<p>By the end of this lesson you can:</p>
<ol>
<li>Explain <strong>why and how</strong> marketers collect customer data</li>
<li>Use <strong>market segmentation</strong> to identify target customers and build a <strong>customer profile</strong></li>
<li>Describe how <strong>customer relationships</strong> affect acquisition cost and lifetime value</li>
<li>Explain how data collection creates <strong>privacy risks</strong> for customers and businesses</li>
</ol>
<p><strong>Running example all period:</strong> Theo, 16, rebuilding bikes in his family's garage — <strong>Trued Cycles.</strong></p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>

<header>AP Business · 2.1 Marketing to Customers</header>
<h2 id="meet-theo--trued-cycles">Meet Theo — Trued Cycles</h2>
<p>Theo is 16. He rebuilds neglected bikes in his family's garage.</p>
<ul>
<li>His first customer is <strong>Ricky</strong> (the candy seller from Unit 1)</li>
<li>Ricky needs a bike to haul crates to his soccer-park snack box</li>
<li>Theo sells him a <strong>$60 used bike with a cargo rack</strong></li>
<li>Ricky pays cash and asks for a <strong>receipt</strong></li>
</ul>
<p>Theo has no receipts — so he opens a <strong>$2 spiral notebook</strong> and writes one line: buy price, parts cost, hours, sale price.</p>
<blockquote>
<p>One request for paperwork created a <strong>ledger</strong> — and a ledger full of buyers is <strong>customer data.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-header="AP Business · 2.1 Marketing to Customers" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="4" style="--paginate:true;--header:AP Business · 2.1 Marketing to Customers;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="51" data-size="16:9">
<header>AP Business · 2.1 Marketing to Customers</header>
<h2 id="from-receipt-to-ledger">From receipt to ledger</h2>
<p>Six weeks later, the notebook tells Theo something:</p>
<ul>
<li>Line 1: the $60 cargo bike (Ricky)</li>
<li>Lines 2–7: <strong>the same buyer six times</strong> — a parent buying a safe first commuter bike for a middle schooler</li>
</ul>
<blockquote>
<p>Six lines of ledger told Theo <strong>who to serve, what to rebuild, and who his listings should speak to.</strong></p>
</blockquote>
<p>That's the power of customer data — and today you learn to read it.</p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-header="AP Business · 2.1 Marketing to Customers" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="5" style="--paginate:true;--header:AP Business · 2.1 Marketing to Customers;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="51" data-size="16:9">
<header>AP Business · 2.1 Marketing to Customers</header>
<h2 id="what-is-marketing">What is marketing?</h2>
<p><strong>Marketing</strong> = all the activities a business undertakes to <strong>identify customers' problems, needs, and wants</strong>, and to <strong>promote, sell, and deliver products</strong> that meet them.</p>
<ul>
<li>Marketing ≠ advertising — advertising is <strong>one piece</strong> of marketing</li>
<li>Theo studying local listings to see which bikes sell fast → <strong>marketing</strong></li>
<li>Pricing a finished bike, posting it, handing it over with the seat adjusted → <strong>marketing</strong></li>
</ul>
<blockquote>
<p>Marketing covers the <strong>entire journey</strong> from understanding the customer to delivering the product.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-header="AP Business · 2.1 Marketing to Customers" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="6" style="--paginate:true;--header:AP Business · 2.1 Marketing to Customers;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="51" data-size="16:9">
<header>AP Business · 2.1 Marketing to Customers</header>
<h2 id="what-marketing-is--in-the-examples">What marketing is — in the examples</h2>
<table>
<thead>
<tr>
<th>Activity</th>
<th>Why it's marketing</th>
</tr>
</thead>
<tbody>
<tr>
<td>Theo reads marketplace listings to see which bike styles sell fastest</td>
<td><strong>Identifying</strong> what customers want</td>
</tr>
<tr>
<td>He writes a listing that says &quot;21-point safety inspection&quot;</td>
<td><strong>Promoting</strong> to the right audience</td>
</tr>
<tr>
<td>He adjusts the seat height before handoff</td>
<td><strong>Delivering</strong> a product that fits</td>
</tr>
</tbody>
</table>
<p>Every one of these is marketing — <strong>none of them are advertising.</strong></p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-header="AP Business · 2.1 Marketing to Customers" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="7" style="--paginate:true;--header:AP Business · 2.1 Marketing to Customers;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="51" data-size="16:9">
<header>AP Business · 2.1 Marketing to Customers</header>
<h2 id="why-collect-customer-data">Why collect customer data?</h2>
<p>Customer data feeds <strong>three decisions</strong> (EK 2.1.A.2):</p>
<ol>
<li>Which <strong>customers</strong> the business should serve</li>
<li>Which <strong>products</strong> it should produce</li>
<li><strong>How</strong> to market them effectively and profitably</li>
</ol>
<p>Theo's notebook answered all three:</p>
<ul>
<li><strong>Who:</strong> parents of middle schoolers (6 of 6 sales)</li>
<li><strong>What:</strong> safe commuter bikes ($95 range)</li>
<li><strong>How:</strong> listings that mention safety inspection + tune-up promise</li>
</ul>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-header="AP Business · 2.1 Marketing to Customers" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="8" style="--paginate:true;--header:AP Business · 2.1 Marketing to Customers;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="51" data-size="16:9">
<header>AP Business · 2.1 Marketing to Customers</header>
<h2 id="why-collect-customer-data--in-the-examples">Why collect customer data — in the examples</h2>
<p><strong>Riverbend Suds</strong> — Dana Whitfield's small-batch soap business:</p>
<ul>
<li>Saturday farmers market stall + small online store</li>
<li>Stall shoppers who join her <strong>email list</strong> get a free sample</li>
<li>The online store <strong>logs what each account browses and buys</strong></li>
<li>A <strong>checkout survey</strong> asks age range, zip code, and what matters most</li>
</ul>
<p>Reading the results → Dana sees <strong>two clusters</strong> and decides which one to serve next.</p>
<blockquote>
<p>Data answered: who buys, what they buy, and what they care about.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-header="AP Business · 2.1 Marketing to Customers" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="9" style="--paginate:true;--header:AP Business · 2.1 Marketing to Customers;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="51" data-size="16:9">
<header>AP Business · 2.1 Marketing to Customers</header>
<h2 id="two-kinds-of-customer-data">Two kinds of customer data</h2>
<table>
<thead>
<tr>
<th></th>
<th>Demographic</th>
<th>Psychographic</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Definition</strong></td>
<td><strong>Measurable qualities</strong> describing a population</td>
<td><strong>Cognitive and behavioral factors</strong> within a population</td>
</tr>
<tr>
<td><strong>Examples</strong></td>
<td>age, sex, race, ethnicity, income, location</td>
<td>interests, activities, values, lifestyles</td>
</tr>
<tr>
<td><strong>Sorting test</strong></td>
<td>Could a <strong>census form</strong> record it? → demographic</td>
<td>Does it describe <strong>what a person cares about</strong> or how they spend time? → psychographic</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>Traits of the person = demographic · Contents of the mind = psychographic</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-header="AP Business · 2.1 Marketing to Customers" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="10" style="--paginate:true;--header:AP Business · 2.1 Marketing to Customers;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="51" data-size="16:9">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-header="AP Business · 2.1 Marketing to Customers" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="11" style="--paginate:true;--header:AP Business · 2.1 Marketing to Customers;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="51" data-size="16:9">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-header="AP Business · 2.1 Marketing to Customers" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="12" style="--paginate:true;--header:AP Business · 2.1 Marketing to Customers;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="51" data-size="16:9">
<header>AP Business · 2.1 Marketing to Customers</header>
<h2 id="where-data-comes-from--digital-tools">Where data comes from — digital tools</h2>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-header="AP Business · 2.1 Marketing to Customers" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="13" style="--paginate:true;--header:AP Business · 2.1 Marketing to Customers;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="51" data-size="16:9">
<header>AP Business · 2.1 Marketing to Customers</header>
<h2 id="where-data-comes-from--traditional--purchased">Where data comes from — traditional + purchased</h2>
<p><strong>Traditional tools:</strong></p>
<ul>
<li><strong>Survey</strong> = the same short questions put to many customers</li>
<li><strong>Interview</strong> = a longer conversation with one customer</li>
<li>Theo's version: <strong>two questions at every pickup</strong> — <em>&quot;How did you find this bike?&quot;</em> and <em>&quot;What almost stopped you from buying it?&quot;</em></li>
</ul>
<p><strong>Purchased data:</strong></p>
<ul>
<li>Businesses <strong>buy customer data</strong> from other businesses</li>
<li>Example: a national parts retailer pays a race organizer for its rider mailing list</li>
<li>Theo buys nothing — but his notebook is exactly the kind of asset the market trades</li>
</ul>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-header="AP Business · 2.1 Marketing to Customers" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="14" style="--paginate:true;--header:AP Business · 2.1 Marketing to Customers;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="51" data-size="16:9">
<header>AP Business · 2.1 Marketing to Customers</header>

<table>

<th>Dana's tool</th>
<th>Type</th>
<th>What it captures</th>
</tr>
</thead>

<td>Who wants to hear from her</td>
</tr>

<td>Online store software</td>
<td>Digital — online accounts + click-tracking</td>
<td>What each account browses and buys</td>
</tr>
<tr>
<td>Checkout survey</td>
<td>Traditional — survey</td>
<td>Age range, zip code, what matters most</td>
</tr>
<tr>
<td>Marketplace chat logs</td>
<td>Digital — social media monitoring</td>

</tr>

<blockquote>
<p>One survey can collect <strong>both demographic and psychographic data</strong> — it depends on the <strong>question asked</strong>, never the tool.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-header="AP Business · 2.1 Marketing to Customers" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="15" style="--paginate:true;--header:AP Business · 2.1 Marketing to Customers;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="51" data-size="16:9">
<header>AP Business · 2.1 Marketing to Customers</header>
<h2 id="market-segmentation">Market segmentation</h2>
<p><strong>Market segmentation</strong> = aggregating potential customers into groups — <strong>market segments</strong> — based on <strong>shared demographic and psychographic characteristics</strong> (EK 2.1.B.1)</p>
<ul>
<li>Helps businesses understand what each group <strong>needs</strong></li>
<li>Shows how products might <strong>address</strong> those needs</li>
</ul>
<p>Theo's buyers sort into <strong>three segments:</strong></p>
<table>
<thead>
<tr>
<th>Segment</th>
<th>Buys</th>
<th>Cares about</th>
</tr>
</thead>
<tbody>
<tr>
<td>Parents of younger kids</td>
<td>$60 bikes</td>
<td>mostly working brakes</td>
</tr>
<tr>
<td><strong>Parents of middle schoolers</strong></td>
<td><strong>$95 commuters</strong></td>
<td>safety, test ride, guarantee</td>
</tr>
<tr>
<td>Adult hobbyists</td>
<td>$150 road bikes</td>
<td>parts list, negotiate hardest</td>
</tr>
</tbody>
</table>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-header="AP Business · 2.1 Marketing to Customers" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="16" style="--paginate:true;--header:AP Business · 2.1 Marketing to Customers;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="51" data-size="16:9">
<header>AP Business · 2.1 Marketing to Customers</header>
<h2 id="market-segmentation--in-the-examples">Market segmentation — in the examples</h2>
<p><strong>Riverbend Suds — Dana's two clusters:</strong></p>
<table>
<thead>
<tr>
<th>Segment</th>
<th>Demographic traits</th>
<th>Psychographic traits</th>
</tr>
</thead>
<tbody>
<tr>
<td>Shoppers <strong>over 50</strong></td>
<td>age 50+</td>
<td>buy single unscented bars; rank <strong>sensitive-skin ingredients</strong> first</td>
</tr>
<tr>
<td>Shoppers in their <strong>late 20s–30s</strong></td>
<td>age 25–39</td>
<td>buy <strong>gift sets</strong>; follow shop on social media; rank <strong>plastic-free packaging</strong> first</td>
</tr>
</tbody>
</table>
<p>Dana decides her next product line will serve the <strong>younger cluster.</strong></p>
<blockquote>
<p>Segments are groups. But Dana needs to go <strong>one zoom level deeper.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-header="AP Business · 2.1 Marketing to Customers" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="17" style="--paginate:true;--header:AP Business · 2.1 Marketing to Customers;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="51" data-size="16:9">
<header>AP Business · 2.1 Marketing to Customers</header>
<h2 id="target-customers">Target customers</h2>
<p><strong>Target customers</strong> = the buyers <strong>most likely to purchase</strong> a specific product because their wants, needs, and preferences already point at it (EK 2.1.B.2)</p>
<p>Theo's notebook makes the choice: <strong>6 of 6 sales</strong> sit in the commuter-parent segment.</p>
<blockquote>
<p>That segment gets his rebuild hours, stall space, and listing wording.</p>
</blockquote>
<p><strong>Why narrow the aim?</strong></p>
<p>Products, branding, pricing, and advertising designed for <strong>one target population</strong> usually work <strong>better</strong> and cost <strong>less</strong> than appeals to everyone.</p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-header="AP Business · 2.1 Marketing to Customers" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="18" style="--paginate:true;--header:AP Business · 2.1 Marketing to Customers;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="51" data-size="16:9">
<header>AP Business · 2.1 Marketing to Customers</header>
<h2 id="target-customers--in-the-examples">Target customers — in the examples</h2>
<p>Two listings that cost the same to post:</p>
<p><strong>Broad:</strong> <em>&quot;Used bikes for sale, all sizes, good prices.&quot;</em></p>
<p><strong>Targeted:</strong> <em>&quot;Inspected commuter bikes for middle schoolers, 21-point safety check on an orange tag, test rides Saturday, 30-day tune-up included.&quot;</em></p>
<p>The second answers <strong>Renee's exact worries in order</strong> — and Renee is the one holding the money.</p>
<blockquote>
<p>Targeting <strong>improves the odds</strong> — it never <strong>guarantees</strong> the sale.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-header="AP Business · 2.1 Marketing to Customers" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="19" style="--paginate:true;--header:AP Business · 2.1 Marketing to Customers;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="51" data-size="16:9">
<header>AP Business · 2.1 Marketing to Customers</header>
<h2 id="customer-profile">Customer profile</h2>
<p><strong>Customer profile</strong> = a <strong>fictional description</strong> of a specific sample customer, combining demographic data, psychographic data, and that person's wants, needs, and preferences (EK 2.1.B.3)</p>
<p>Theo's customer profile — written on an index card:</p>
<blockquote>
<p><strong>Renee, 41.</strong> Wants a safe first commuter bike for her middle schooler.<br />
Budget: $90. Deadline: Saturday.<br />
Values the test ride and the tune-up promise more than the price.</p>
</blockquote>
<p>Renee is <strong>fictional</strong> — but every line on her card is backed by <strong>six real buyers</strong> in the notebook.</p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-header="AP Business · 2.1 Marketing to Customers" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="20" style="--paginate:true;--header:AP Business · 2.1 Marketing to Customers;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="51" data-size="16:9">
<header>AP Business · 2.1 Marketing to Customers</header>
<h2 id="customer-profile--in-the-examples">Customer profile — in the examples</h2>
<p><strong>Dana's customer profile:</strong></p>
<blockquote>
<p><strong>Marisol, 31.</strong> Renter who hosts friends often.<br />
Follows zero-waste creators on social media.<br />
Buys gifts locally.<br />
Cares most about <strong>plastic-free packaging.</strong></p>
</blockquote>
<table>
<thead>
<tr>
<th>Profile element</th>
<th>Type</th>
</tr>
</thead>
<tbody>
<tr>
<td>Age 31, renter</td>
<td>Demographic</td>
</tr>
<tr>
<td>Hosts friends, follows zero-waste creators, buys locally</td>
<td>Psychographic</td>
</tr>
<tr>
<td>Plastic-free packaging</td>
<td>Psychographic (values)</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>Segment = the group · Profile = one invented person who stands for it.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>

<header>AP Business · 2.1 Marketing to Customers</header>
<h2 id="your-turn--segment-or-profile">Your turn — segment or profile?</h2>
<blockquote>
<p>Dana sees two clusters in her data and writes a one-page description: <strong>&quot;Marisol, 31, renter, hosts friends, follows zero-waste creators, buys gifts locally.&quot;</strong></p>
</blockquote>
<p>Is this a <strong>market segment</strong> or a <strong>customer profile</strong>?</p>
<p>Think first, then we'll check.</p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-header="AP Business · 2.1 Marketing to Customers" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="22" style="--paginate:true;--header:AP Business · 2.1 Marketing to Customers;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="51" data-size="16:9">
<header>AP Business · 2.1 Marketing to Customers</header>
<h2 id="building-customer-relationships">Building customer relationships</h2>
<p>A sale to Renee is worth more if the <strong>relationship outlives it</strong> (EK 2.1.C.1).</p>
<p>Three standard tactics:</p>
<table>
<thead>
<tr>
<th>Tactic</th>
<th>What it does</th>
<th>Theo's version</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Personalized service</strong></td>
<td>Treats a customer as a known individual</td>
<td>30-day free tune-up — greets the kid by name</td>
</tr>
<tr>
<td><strong>Rewards programs</strong></td>
<td>Gives repeat buyers a reason to return</td>
<td>$10 off a sibling's bike for any family in the notebook</td>
</tr>
<tr>
<td><strong>Customer feedback opportunities</strong></td>
<td>Asks buyers what to fix</td>
<td>Two questions at every pickup</td>
</tr>
</tbody>
</table>
<p>Social media and the internet make all three <strong>cheaper to run.</strong></p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-header="AP Business · 2.1 Marketing to Customers" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="23" style="--paginate:true;--header:AP Business · 2.1 Marketing to Customers;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="51" data-size="16:9">
<header>AP Business · 2.1 Marketing to Customers</header>
<h2 id="building-relationships--in-the-examples">Building relationships — in the examples</h2>
<p><strong>Theo's 30-day tune-up:</strong></p>
<ul>
<li>Bike comes back within a month</li>
<li>He trues the wheels free</li>
<li>Greets the kid by name</li>
<li>Every post on social media (with permission) reminds past buyers Trued Cycles is still open</li>
</ul>
<p><strong>Theo's sibling discount:</strong></p>
<ul>
<li>$10 off for any family already in the notebook</li>
<li>Satisfied customers <strong>refer new customers</strong></li>
<li>A referred buyer arrives at <strong>zero marketing cost</strong></li>
</ul>
<blockquote>
<p>Strong relationships push acquisition cost <strong>down</strong> and lifetime value <strong>up.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-header="AP Business · 2.1 Marketing to Customers" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="24" style="--paginate:true;--header:AP Business · 2.1 Marketing to Customers;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="51" data-size="16:9">
<header>AP Business · 2.1 Marketing to Customers</header>
<h2 id="customer-acquisition-cost-cac">Customer acquisition cost (CAC)</h2>
<p><strong>CAC</strong> = total marketing, advertising, and sales costs used to acquire customers <strong>÷</strong> number of customers acquired (EK 2.1.C.2)</p>
<p><strong>Theo's first month at the flea market:</strong></p>
<ul>
<li>Spends <strong>$20</strong> (stall fees + photocopied flyers)</li>
<li><strong>4 buyers</strong> come in through them</li>
</ul>

<header>AP Business · 2.1 Marketing to Customers</header>
<h2 id="cac--the-trap">CAC — the trap</h2>
<p>Fall's CAC ($30) is <strong>higher</strong> than Spring's ($20).</p>
<p>Does that mean Fall was worse?</p>
<p><strong>Not necessarily.</strong> Watch what happens when we add lifetime value next.</p>
<blockquote>
<p>Never judge CAC <strong>on its own</strong> — always compare it to LTV.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>

<header>AP Business · 2.1 Marketing to Customers</header>
<h2 id="lifetime-value-ltv">Lifetime value (LTV)</h2>
<p><strong>LTV</strong> = the estimated amount a customer will spend on the business's products <strong>over time</strong> (EK 2.1.C.3)</p>
<p>Track LTV in <strong>margin</strong> (the part you keep) so value and cost stay in the same units.</p>
<p><strong>Building Renee's LTV:</strong></p>
<table>
<thead>
<tr>
<th>Step</th>
<th>Value</th>
</tr>
</thead>
<tbody>
<tr>
<td>Margin on her first bike</td>
<td>$38</td>
</tr>
<tr>
<td>Two paid tune-ups over the years ($12 margin each)</td>
<td>$24</td>
</tr>
<tr>
<td>A sibling bike later (~$65), given a 40% chance → 0.40 × 65</td>
<td>$26</td>
</tr>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-header="AP Business · 2.1 Marketing to Customers" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="31" style="--paginate:true;--header:AP Business · 2.1 Marketing to Customers;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="51" data-size="16:9">
<header>AP Business · 2.1 Marketing to Customers</header>
<h2 id="data-risks--privacy">Data risks — privacy</h2>
<p>Every tactic in this topic runs on collected data — and <strong>collection creates risk</strong> (EK 2.1.D.1).</p>
<p><strong>Theo's problem:</strong> His notes app holds <strong>19 customer phone numbers.</strong> He never wrote down <strong>why</strong> he keeps them. Nothing on the form says <strong>how long</strong> a number stays or what else it might be used for.</p>
<blockquote>
<p>Collecting, compiling, and storing customer data can violate customers' <strong>privacy</strong> — especially when people are <strong>unaware</strong> the collection is happening or <strong>uninformed</strong> about how the data may be used.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-header="AP Business · 2.1 Marketing to Customers" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="32" style="--paginate:true;--header:AP Business · 2.1 Marketing to Customers;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="51" data-size="16:9">
<header>AP Business · 2.1 Marketing to Customers</header>
<h2 id="data-risks--breach-identity-theft-fraud">Data risks — breach, identity theft, fraud</h2>
<p>Unsecured data adds a second layer of risk (EK 2.1.D.2):</p>
<table>
<thead>
<tr>
<th>Risk</th>
<th>What it means</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Data breach</strong></td>
<td>Exposes stored information to outsiders</td>
</tr>
<tr>
<td><strong>Identity theft</strong></td>
<td>Uses stolen personal details to impersonate a person</td>
</tr>
<tr>
<td><strong>Fraud</strong></td>
<td>Uses deception (often powered by stolen data) to take money or property</td>
</tr>
</tbody>
</table>
<p>Theo's whole database is <strong>one phone carried through a flea market every Saturday.</strong> One stolen bag hands a stranger 19 families' names, numbers, and chat logs showing which kid rides which bike home.</p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-header="AP Business · 2.1 Marketing to Customers" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="33" style="--paginate:true;--header:AP Business · 2.1 Marketing to Customers;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="51" data-size="16:9">
<header>AP Business · 2.1 Marketing to Customers</header>
<h2 id="data-risks--in-the-examples">Data risks — in the examples</h2>
<p><strong>The neighborhood gym</strong> — advertises itself as a <strong>trusted community space</strong> but stores members' payment card numbers and check-in histories in an <strong>unsecured spreadsheet.</strong></p>
<p>A breach could:</p>
<ul>
<li><strong>Drive members away</strong> — customers who no longer feel safe leave</li>
<li><strong>Violate the gym's stated values</strong> — &quot;trusted&quot; becomes a broken promise</li>
<li><strong>Damage its reputation</strong> — the story reaches people who never joined</li>
</ul>
<blockquote>
<p>The three business-side risks: <strong>lost customers, violated values, damaged reputation.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-header="AP Business · 2.1 Marketing to Customers" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="34" style="--paginate:true;--header:AP Business · 2.1 Marketing to Customers;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="51" data-size="16:9">
<header>AP Business · 2.1 Marketing to Customers</header>
<h2 id="balancing-data-benefits-and-risks">Balancing data benefits and risks</h2>
<p>Businesses must balance the <strong>benefits</strong> of using data against the <strong>potential risks</strong> (EK 2.1.D.3):</p>
<table>
<thead>
<tr>
<th>Benefits</th>
<th>Risks</th>
</tr>
</thead>
<tbody>
<tr>
<td>Better targeting</td>
<td>Privacy violations</td>
</tr>
<tr>
<td>Higher LTV</td>
<td>Data breaches</td>
</tr>
<tr>
<td>Lower CAC</td>
<td>Identity theft / fraud</td>
</tr>
<tr>
<td>Better products</td>
<td>Loss of customers</td>
</tr>
<tr>
<td></td>
<td>Violation of core values</td>
</tr>
<tr>
<td></td>
<td>Harm to reputation</td>
</tr>
</tbody>
</table>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-header="AP Business · 2.1 Marketing to Customers" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="35" style="--paginate:true;--header:AP Business · 2.1 Marketing to Customers;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="51" data-size="16:9">
<header>AP Business · 2.1 Marketing to Customers</header>
<h2 id="theos-fix--three-steps">Theo's fix — three steps</h2>
<ol>
<li><strong>Lock</strong> the phone</li>
<li><strong>Delete</strong> every number that has no purpose</li>
<li><strong>Add one line</strong> to the order form stating what gets kept and why</li>
</ol>
<blockquote>
<p>Lock → Delete → Disclose. Simple, but most small businesses skip all three.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-header="AP Business · 2.1 Marketing to Customers" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="36" style="--paginate:true;--header:AP Business · 2.1 Marketing to Customers;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="51" data-size="16:9">
<header>AP Business · 2.1 Marketing to Customers</header>
<h2 id="exam-points-to-remember">Exam points to remember</h2>
<ul>
<li><strong>Marketing ≠ advertising</strong> — it's identify + promote + sell + deliver; data feeds the who / what / how decisions</li>
<li><strong>Demographic</strong> (measurable, census-recordable) vs. <strong>psychographic</strong> (cares about / how they spend time) — use the <strong>sorting test</strong></li>
<li><strong>Segmentation → target customer → customer profile (Renee):</strong> narrow the aim because targeted appeals work better and cost less</li>
<li><strong>Three relationship tactics:</strong> personalized service, rewards programs, customer feedback opportunities</li>
<li><strong>CAC</strong> = ALL acquisition costs ÷ customers acquired (referrals push it toward zero)</li>
<li><strong>LTV</strong> = estimated spending over time — track in margin to compare with cost</li>
<li><strong>Data risks:</strong> privacy violation, data breach, identity theft, fraud — weigh benefits against trust / core values / reputation</li>
<li><strong>Fix pattern:</strong> lock → delete → disclose</li>
</ul>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-header="AP Business · 2.1 Marketing to Customers" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="37" style="--paginate:true;--header:AP Business · 2.1 Marketing to Customers;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="51" data-size="16:9">
<header>AP Business · 2.1 Marketing to Customers</header>
<h2 id="practice--stimulus">Practice — stimulus</h2>
<blockquote>
<p><strong>Riverbend Suds</strong></p>
<p>Dana Whitfield owns Riverbend Suds, a small-batch soap business with a Saturday farmers market stall and a small online store. Stall shoppers who <strong>join her email list</strong> get a free sample bar. The store requires an <strong>account</strong>, and its software <strong>logs what each account browses and buys.</strong> A short <strong>checkout survey</strong> asks each customer's <strong>age range, zip code, and what matters most</strong> when choosing soap.</p>
<p>Reading the results, Dana sees <strong>two clusters:</strong></p>
<ul>
<li>Shoppers <strong>over 50</strong> who buy single unscented bars and rank <strong>sensitive-skin ingredients</strong> first.</li>
<li>Shoppers in their <strong>late 20s–30s</strong> who buy <strong>gift sets</strong>, follow the shop on social media, and rank <strong>plastic-free packaging</strong> first.</li>
</ul>
<p>Dana decides her next product line will serve the <strong>younger cluster</strong>, and drafts a one-page description of an imaginary shopper: <strong>Marisol, 31</strong>, a renter who hosts friends often, follows zero-waste creators, and buys gifts locally.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-header="AP Business · 2.1 Marketing to Customers" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="38" style="--paginate:true;--header:AP Business · 2.1 Marketing to Customers;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="51" data-size="16:9">
<header>AP Business · 2.1 Marketing to Customers</header>
<h2 id="practice--q1">Practice — Q1</h2>
<blockquote>
<p>Which best describes the customer data the checkout survey collects?</p>
<p>A. Only demographic data, because survey answers can be counted</p>
<p>B. <strong>Both</strong> demographic data (age + zip code) <strong>and</strong> psychographic data (what matters most)</p>
<p>C. Only psychographic data, because surveys record opinions</p>
<p>D. Neither type, because a survey is a traditional tool rather than a digital one</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-header="AP Business · 2.1 Marketing to Customers" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="39" style="--paginate:true;--header:AP Business · 2.1 Marketing to Customers;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="51" data-size="16:9">
<header>AP Business · 2.1 Marketing to Customers</header>
<h2 id="practice--q1-answer">Practice — Q1 answer</h2>
<p><strong>Answer: B.</strong></p>
<p>Demographic = measurable qualities (age, income, location) → <strong>age range + zip code</strong><br />
Psychographic = interests, activities, values, lifestyles → <strong>&quot;what matters most&quot;</strong></p>
<p>One survey can collect <strong>both at once.</strong></p>
<p><strong>Traps:</strong></p>
<ul>
<li><strong>A</strong> — &quot;measurable&quot; bait. Dana <em>can</em> count how many ranked plastic-free first, but <strong>counting never changes what the data describes.</strong></li>
<li><strong>D</strong> — <strong>confuses the tool with the data type.</strong> Type depends on the <strong>question asked</strong>, never the channel.</li>
</ul>
<blockquote>
<p><strong>Traits of the person = demographic · Contents of the mind = psychographic.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-header="AP Business · 2.1 Marketing to Customers" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="40" style="--paginate:true;--header:AP Business · 2.1 Marketing to Customers;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="51" data-size="16:9">
<header>AP Business · 2.1 Marketing to Customers</header>
<h2 id="practice--q2">Practice — Q2</h2>
<blockquote>
<p>Which best explains the advantage Dana gains by designing the next product line for the younger cluster?</p>
<p>A. She can design branding, pricing, and advertising that appeal to <strong>anyone who might ever buy</strong> soap</p>
<p>B. Serving one segment <strong>guarantees</strong> the new line outsells her current products</p>
<p>C. She can stop collecting data from customers outside the chosen segment</p>
<p>D. Focusing design, branding, pricing, and advertising on the buyers most likely to purchase is typically <strong>more effective and less costly</strong> than appealing to a wide audience</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-header="AP Business · 2.1 Marketing to Customers" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="41" style="--paginate:true;--header:AP Business · 2.1 Marketing to Customers;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="51" data-size="16:9">
<header>AP Business · 2.1 Marketing to Customers</header>
<h2 id="practice--q2-answer">Practice — Q2 answer</h2>
<p><strong>Answer: D.</strong></p>
<p>Target customer = buyer <strong>most likely to purchase</strong> because of wants/needs/preferences. Aiming at one group usually <strong>converts better and costs less.</strong></p>
<p><strong>Traps:</strong></p>
<ul>
<li><strong>A</strong> — <strong>the opposite strategy.</strong> Appealing to anyone who might ever buy is the expensive, unfocused path that targeting exists to replace.</li>
<li><strong>B</strong> — <strong>&quot;guarantees&quot;</strong> is the tell. Targeting <strong>improves the odds</strong> and promises nothing.</li>
</ul>
<blockquote>
<p><strong>Targeting improves odds — never guarantees.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-header="AP Business · 2.1 Marketing to Customers" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="42" style="--paginate:true;--header:AP Business · 2.1 Marketing to Customers;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="51" data-size="16:9">
<header>AP Business · 2.1 Marketing to Customers</header>
<h2 id="practice--q3">Practice — Q3</h2>
<blockquote>
<p>The one-page description of Marisol is best identified as which?</p>
<p>A. A <strong>customer profile</strong> — a fictional sample customer built from demographic and psychographic data</p>
<p>B. A <strong>market segment</strong> because it represents many customers who share traits</p>
<p>C. A record of Dana's single best <strong>real</strong> customer</p>
<p>D. A <strong>subscriber list</strong> entry generated by the online store</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-header="AP Business · 2.1 Marketing to Customers" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="43" style="--paginate:true;--header:AP Business · 2.1 Marketing to Customers;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="51" data-size="16:9">
<header>AP Business · 2.1 Marketing to Customers</header>
<h2 id="practice--q3-answer">Practice — Q3 answer</h2>
<p><strong>Answer: A.</strong></p>
<p>A customer profile <strong>personifies the target customer</strong> — one specific invented person. Marisol's age + renter = demographic; hosting, zero-waste creators, local gifting = psychographic.</p>
<p><strong>Traps:</strong></p>
<ul>
<li><strong>B</strong> — <strong>one zoom level too far out.</strong> The segment is the <strong>group</strong>; the profile is <strong>one imaginary member</strong> drawn from it.</li>
<li><strong>C</strong> — misses the word <strong>&quot;fictional.&quot;</strong> A profile is invented; <strong>no single real shopper is its subject.</strong></li>
</ul>
<blockquote>
<p><strong>Segment = the group · Profile = the invented person who stands for it.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-header="AP Business · 2.1 Marketing to Customers" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="44" style="--paginate:true;--header:AP Business · 2.1 Marketing to Customers;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="51" data-size="16:9">
<header>AP Business · 2.1 Marketing to Customers</header>
<h2 id="practice--q4">Practice — Q4</h2>
<blockquote>
<p>Which best explains how a rewards program for frequent buyers can increase a business's profits?</p>
<p>A. It reduces the <strong>cost of manufacturing</strong> each unit sold</p>
<p>B. It <strong>guarantees</strong> members will keep making repeat purchases</p>
<p>C. It builds <strong>brand loyalty and repeat purchasing</strong>, which raises the <strong>lifetime value</strong> of each customer</p>
<p>D. It removes any need to attract new customers</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-header="AP Business · 2.1 Marketing to Customers" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="45" style="--paginate:true;--header:AP Business · 2.1 Marketing to Customers;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="51" data-size="16:9">
<header>AP Business · 2.1 Marketing to Customers</header>
<h2 id="practice--q4-answer">Practice — Q4 answer</h2>
<p><strong>Answer: C.</strong></p>
<p>Relationship tactics (rewards, personalized service, feedback) <strong>raise LTV</strong> because loyal customers make repeat purchases. Satisfied customers also <strong>refer friends</strong>, pushing CAC <strong>down.</strong></p>
<p><strong>Traps:</strong></p>
<ul>
<li><strong>B</strong> — <strong>&quot;guarantees&quot;</strong> again. A rewards program <strong>raises the probability</strong> and promises nothing.</li>
<li><strong>A</strong> — <strong>borrows from operations.</strong> A punch card changes buying behavior and leaves manufacturing cost <strong>untouched.</strong></li>
</ul>
<blockquote>
<p><strong>Relationship tactics move LTV and CAC — never production cost.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-header="AP Business · 2.1 Marketing to Customers" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="46" style="--paginate:true;--header:AP Business · 2.1 Marketing to Customers;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="51" data-size="16:9">
<header>AP Business · 2.1 Marketing to Customers</header>
<h2 id="practice--q5">Practice — Q5</h2>
<p><strong>Cinder Peak Cocoa</strong> ran one campaign in spring and one in fall:</p>
<table>
<thead>
<tr>
<th></th>
<th>Spring</th>
<th>Fall</th>
</tr>
</thead>
<tbody>
<tr>
<td>Advertising costs</td>
<td>$6,000</td>
<td>$6,000</td>
</tr>
<tr>
<td>Other marketing &amp; sales costs</td>
<td>$2,000</td>
<td>$3,000</td>
</tr>
<tr>
<td>New customers acquired</td>
<td>400</td>
<td>300</td>
</tr>
<tr>
<td>Average customer lifetime value</td>
<td>$60</td>
<td>$90</td>
</tr>
</tbody>

<blockquote>
<p>Which conclusion is supported by the table?</p>
</blockquote>

<header>AP Business · 2.1 Marketing to Customers</header>
<h2 id="practice--q6">Practice — Q6</h2>
<blockquote>
<p>A neighborhood gym that advertises itself as a <strong>trusted community space</strong> stores members' payment card numbers and check-in histories in an <strong>unsecured spreadsheet.</strong> Which best explains the risk this creates <strong>for the gym itself?</strong></p>
<p>A. None — a breach harms only the customers whose information is exposed</p>
<p>B. A breach could <strong>drive members away, violate the gym's stated values, and damage its reputation</strong></p>
<p>C. <strong>Any</strong> collection of customer data violates the law</p>
<p>D. The risk ends once members accept the gym's terms of service</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-header="AP Business · 2.1 Marketing to Customers" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="49" style="--paginate:true;--header:AP Business · 2.1 Marketing to Customers;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="51" data-size="16:9">
<header>AP Business · 2.1 Marketing to Customers</header>
<h2 id="practice--q6-answer">Practice — Q6 answer</h2>
<p><strong>Answer: B.</strong></p>
<p>Unsecured data → breach → exposes members to fraud/identity theft → consequences <strong>rebound on the business.</strong> Customers leave; stated values become broken promises; the story reaches people who never joined.</p>
<p><strong>Traps:</strong></p>
<ul>
<li><strong>A</strong> — sends harm in <strong>only one direction.</strong> Customers face identity theft; <strong>the business faces exits, values violation, and reputation damage.</strong></li>
<li><strong>C</strong> — hardens a real concern into a <strong>false absolute.</strong> Collecting data is <strong>legal and routine</strong>; the issue is <strong>securing and disclosing it.</strong></li>
</ul>
<blockquote>
<p><strong>The three business-side risks: lost customers · violated values · damaged reputation.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-header="AP Business · 2.1 Marketing to Customers" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="50" style="--paginate:true;--header:AP Business · 2.1 Marketing to Customers;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="51" data-size="16:9">
<header>AP Business · 2.1 Marketing to Customers</header>
<h2 id="trap-patterns-to-watch">Trap patterns to watch</h2>
<table>
<thead>
<tr>
<th>#</th>
<th>Trap type</th>
<th>Where it appears</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td><strong>&quot;Measurable/countable&quot; bait</strong> — counting responses doesn't change data type; type = the <strong>question asked</strong>, never the tool</td>
<td>Q1</td>
</tr>
<tr>
<td>2</td>
<td><strong>&quot;Appeal to anyone&quot;</strong> = abandoning the target; <strong>&quot;guarantees&quot;</strong> (targeting improves odds, promises nothing)</td>
<td>Q2</td>
</tr>
<tr>
<td>3</td>
<td><strong>Segment vs. profile zoom level</strong> — segment = <em>group</em>; profile = one <em>invented</em> person</td>
<td>Q3</td>
</tr>
<tr>
<td>4</td>
<td><strong>Relationship tactics move LTV and CAC — never production cost</strong></td>
<td>Q4</td>
</tr>
<tr>
<td>5</td>
<td><strong>CAC uses ALL acquisition costs</strong>, not just advertising; judge CAC <strong>against LTV</strong></td>
<td>Q5</td>
</tr>
<tr>
<td>6</td>
<td><strong>Breach harm rebounds on the business</strong>; &quot;any data collection is illegal&quot; = false absolute</td>
<td>Q6</td>
</tr>
</tbody>
</table>

<header>AP Business · 2.1 Marketing to Customers</header>
<h2 id="wrap-up--21-marketing-to-customers">Wrap-up — 2.1 Marketing to Customers</h2>
<p><strong>What we covered:</strong></p>
<ul>
<li>Marketing ≠ advertising — it's the full identify → promote → sell → deliver chain</li>
<li>Two data types: demographic (census traits) vs. psychographic (contents of the mind)</li>
<li>Segmentation → target customer → customer profile (Renee / Marisol)</li>
<li>Three relationship tactics raise LTV and lower CAC</li>
<li>CAC = all acquisition costs ÷ customers; LTV = spending over time</li>
<li>Data risks: privacy, breach, identity theft, fraud → lock, delete, disclose</li>
</ul>
<p><strong>Coming up next:</strong> 2.2 Consumer Behavior — the notebook proves <strong>who</strong> buys, but it cannot explain <strong>why</strong> they say yes.</p>
