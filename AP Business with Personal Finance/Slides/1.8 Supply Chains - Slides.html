<h2 id="opening-question">Opening question</h2>
<p>You know who owns the business (1.7), who does what, and how the departments work.</p>
<blockquote>
<p><strong>But where does the product <em>actually come from</em> — and how does it get to the customer?</strong></p>
</blockquote>
<p>Sunday-night inventory count. The candy seller flips a chocolate bar over and suddenly realizes <strong>he has no idea where it comes from.</strong> Cocoa grew on a farm in another hemisphere. A factory melted, molded, and wrapped it. A warehouse held it. A truck moved it.</p>
<p><strong>Only then did his backpack enter the story.</strong></p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="5" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>
<h2 id="artisan-or-mass-production--definition">Artisan or mass production — definition</h2>
<p>Before anything moves through a chain, somebody has to make it. Two poles:</p>
<table>
<thead>
<tr>
<th></th>
<th>Artisan</th>
<th>Mass production</th>
</tr>
</thead>
<tbody>
<tr>
<td>Relies on</td>
<td><strong>Skilled labor</strong> + close attention to detail</td>
<td><strong>Technology, assembly lines, machinery</strong></td>
</tr>
<tr>
<td>Output</td>
<td><strong>Smaller</strong> quantities</td>
<td><strong>Far larger</strong> quantities</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>Quality can come from either pole.</strong> Artisan does not mean better; mass-produced does not mean worse.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="6" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>
<h2 id="artisan-or-mass-production--in-the-examples">Artisan or mass production — in the examples</h2>
<table>
<thead>
<tr>
<th></th>
<th>Artisan</th>
<th>Mass production</th>
</tr>
</thead>
<tbody>
<tr>
<td>At the park</td>
<td>The <strong>cookie parent</strong> — hours of skilled piping per batch, two dozen cookies, premium price</td>
<td>The <strong>chocolate bars</strong> — machines poured thousands of identical bars in the same time</td>
</tr>
<tr>
<td>What drives it</td>
<td>Hand skill, attention to detail, small batches</td>
<td>Technology, assembly lines, sheer volume</td>
</tr>
</tbody>
</table>
<blockquote>
<p>The cookie parent and the chocolate bar sit at <strong>opposite poles</strong> of the same question: how do you make the product?</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="7" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>
<h2 id="three-inputs-determine-the-choice--definition">Three inputs determine the choice — definition</h2>
<p><strong>Which pole a business chooses depends on three inputs:</strong></p>
<ol>
<li><strong>Customer priorities</strong> (first) — buyers who prize <strong>customization</strong> lean toward artisan; buyers who prize <strong>low price</strong> lean toward mass production</li>
<li><strong>Core competencies</strong> (second, from 1.5) — a business built on handcraft skill should not suddenly pretend to be a factory</li>
<li><strong>Competitive landscape</strong> (third, from 1.2) — entering a market of cheap mass-produced rivals with a mid-priced product satisfies nobody</li>
</ol>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="8" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>
<h2 id="three-inputs-determine-the-choice--in-the-examples">Three inputs determine the choice — in the examples</h2>
<p>The cookie parent read all three correctly:</p>
<table>
<thead>
<tr>
<th>Input</th>
<th>Her read</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Customer priorities</strong></td>
<td>Parents at the park pay extra for birthday-worthy cookies — customization wins</td>
</tr>
<tr>
<td><strong>Core competencies</strong> (1.5)</td>
<td>Her skill is decoration, not factory logistics — stay artisan</td>
</tr>
<tr>
<td><strong>Competitive landscape</strong> (1.2)</td>
<td>No rival at the park can copy her piping — she owns the niche</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>All three pointed the same direction.</strong> That's why artisan was the right call — not because artisan is &quot;better,&quot; but because it matched her customers, her skills, and her market.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="9" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>
<h2 id="the-supply-chain-for-a-good--definition">The supply chain for a good — definition</h2>
<p>A <strong>supply chain</strong> connects all of the individuals and businesses involved at <strong>each stage of producing and distributing a product</strong> — from acquiring raw materials to final customer delivery.</p>
<table>
<thead>
<tr>
<th>Stage</th>
<th>What happens</th>
</tr>
</thead>
<tbody>
<tr>
<td>1. <strong>Raw materials &amp; component parts</strong></td>
<td>Cocoa, sugar, milk, wrappers</td>
</tr>
<tr>
<td>2. <strong>Manufacturing facility</strong></td>
<td>Workers + equipment turn materials into finished goods</td>
</tr>
<tr>
<td>3. <strong>Storage facility (warehouse)</strong></td>
<td>Finished goods wait</td>
</tr>
<tr>
<td>4. <strong>Distribution center / retail store</strong></td>
<td>Goods are put in front of customers</td>
</tr>
<tr>
<td>5. <strong>Customer</strong></td>
<td>The last link in the chain</td>
</tr>
</tbody>
</table>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="10" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>
<h2 id="the-supply-chain-for-a-good--in-the-examples">The supply chain for a good — in the examples</h2>
<p>The chocolate bar's journey — from a farm on another continent to the candy seller's backpack:</p>
<table>
<thead>
<tr>
<th>Stage</th>
<th>What happened</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Raw materials</strong></td>
<td>Cocoa farm, sugar plantation, dairy, wrapper manufacturer</td>
</tr>
<tr>
<td><strong>Manufacturing</strong></td>
<td>Factory melted, molded, wrapped — thousands of identical bars</td>
</tr>
<tr>
<td><strong>Warehouse</strong></td>
<td>Finished bars waited on pallets in a regional storage facility</td>
</tr>
<tr>
<td><strong>Distribution / retail</strong></td>
<td>Truck delivered to the supermarket shelf</td>
</tr>
<tr>
<td><strong>Customer</strong></td>
<td>The candy seller bought it, dropped it in his backpack</td>
</tr>
</tbody>
</table>
<blockquote>
<p>A chain can be <strong>local, regional, or global.</strong> The chocolate bar's chain is global by necessity — cocoa will not grow near the school.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="11" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>
<h2 id="local-regional-or-global--in-the-examples">Local, regional, or global — in the examples</h2>
<table>
<thead>
<tr>
<th>Chain type</th>
<th>At the park</th>
<th>Why</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Local</strong></td>
<td>The cookie parent — flour from the neighborhood bakery, baked at home, sold 500 meters away</td>
<td>Everything happens within one community</td>
</tr>
<tr>
<td><strong>Regional</strong></td>
<td>The snack box — chips from a regional distributor, delivered by truck across the metro area</td>
<td>Multiple cities, same country</td>
</tr>
<tr>
<td><strong>Global</strong></td>
<td>The chocolate bar — cocoa from West Africa, factory in Europe, sold at a school in the US</td>
<td>Multiple continents, many links</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>The longer the chain, the more links can break.</strong> A local chain has few failure points; a global chain has many — and every one of them is a risk.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="12" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>
<h2 id="chain-length-and-risk">Chain length and risk</h2>
<blockquote>
<p><strong>The longer the chain, the more links can break.</strong></p>
</blockquote>
<table>
<thead>
<tr>
<th>Chain length</th>
<th>Failure points</th>
<th>Risk level</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Local</strong></td>
<td>Few — a single supplier, a short drive</td>
<td>Lower</td>
</tr>
<tr>
<td><strong>Regional</strong></td>
<td>Moderate — multiple suppliers, regional trucking</td>
<td>Medium</td>
</tr>
<tr>
<td><strong>Global</strong></td>
<td>Many — overseas suppliers, shipping, customs, currency</td>
<td>Higher</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>Risk is the factor that hides</strong> — and it hides in the <strong>length</strong> of the chain itself. Every additional stage adds a link that can fail.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="13" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>
<h2 id="two-facilities-to-keep-separate--definition">Two facilities to keep separate — definition</h2>
<table>
<thead>
<tr>
<th></th>
<th>Warehouse</th>
<th>Distribution center</th>
</tr>
</thead>
<tbody>
<tr>
<td>Primary function</td>
<td><strong>Storage</strong></td>
<td><strong>Stores and moves onward</strong></td>
</tr>
<tr>
<td>Goods leave…</td>
<td>When someone comes to collect</td>
<td>On their way to stores and customers</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>A warehouse waits. A distribution center relays.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="14" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>
<h2 id="two-facilities-to-keep-separate--in-the-examples">Two facilities to keep separate — in the examples</h2>
<table>
<thead>
<tr>
<th>Facility</th>
<th>At the park</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Warehouse</strong></td>
<td>The supermarket stores pallets of chocolate bars in its back room — they sit until a shelf needs restocking</td>
</tr>
<tr>
<td><strong>Distribution center</strong></td>
<td>A regional distributor receives pallets from the factory and <strong>forwards</strong> them to multiple supermarket locations across the city</td>
</tr>
</tbody>
</table>
<blockquote>
<p>The supermarket <strong>stores.</strong> The distributor <strong>stores and forwards.</strong> Keep them separate.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="15" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>
<h2 id="two-intermediaries-to-keep-separate--definition">Two intermediaries to keep separate — definition</h2>
<table>
<thead>
<tr>
<th></th>
<th>Supplier</th>
<th>Distributor</th>
</tr>
</thead>
<tbody>
<tr>
<td>What it moves</td>
<td>Materials/goods from one business to another</td>
<td><strong>Finished products</strong> from manufacturers to retail stores</td>
</tr>
<tr>
<td>Sits where</td>
<td>Early in the chain</td>
<td>Between manufacturing and retail</td>
</tr>
</tbody>
</table>
<blockquote>
<p>A <strong>supplier</strong> feeds the production process. A <strong>distributor</strong> feeds the retail shelf.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="16" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>
<h2 id="two-intermediaries-to-keep-separate--in-the-examples">Two intermediaries to keep separate — in the examples</h2>
<table>
<thead>
<tr>
<th>Intermediary</th>
<th>In the chocolate bar chain</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Supplier</strong></td>
<td>The cocoa farm — supplies raw materials to the factory</td>
</tr>
<tr>
<td><strong>Distributor</strong></td>
<td>The logistics company — moves finished bars from the factory warehouse to supermarket shelves</td>
</tr>
</tbody>
</table>
<blockquote>
<p>The factory cannot make chocolate bars without a <strong>supplier</strong> (cocoa). The supermarket cannot stock them without a <strong>distributor</strong> (trucks + logistics). Each sits at a different stage.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="17" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>
<h2 id="the-supply-chain-for-a-service--definition">The supply chain for a service — definition</h2>
<p>Services run chains too — and the <strong>parts list differs.</strong> A service business acquires the <strong>employees, the resources, and the delivery systems</strong> needed to provide the service.</p>
<table>
<thead>
<tr>
<th>Example</th>
<th>People</th>
<th>Resources</th>
<th>Delivery system</th>
</tr>
</thead>
<tbody>
<tr>
<td>Tutoring company (virtual)</td>
<td>Tutors</td>
<td>Lesson materials</td>
<td>Video platform</td>
</tr>
<tr>
<td>Lawn-care crew (in-person)</td>
<td>Trained workers</td>
<td>Mowers + trimmers</td>
<td>Scheduling app that routes trucks</td>
</tr>
</tbody>
</table>
<blockquote>
<p>When a scenario describes <strong>hiring, equipping, and delivering — with no factory in sight</strong> — it is a <strong>service supply chain.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="18" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>
<h2 id="the-supply-chain-for-a-service--in-the-examples">The supply chain for a service — in the examples</h2>
<p>The snack box itself is a service supply chain — two workers, coolers, and a group-chat order form:</p>
<table>
<thead>
<tr>
<th>Part</th>
<th>The snack box</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>People</strong></td>
<td>The candy seller + his cousin</td>
</tr>
<tr>
<td><strong>Resources</strong></td>
<td>Coolers, ice, snack inventory, a cash box</td>
</tr>
<tr>
<td><strong>Delivery system</strong></td>
<td>The group-chat order form + the halftime handoff route</td>
</tr>
</tbody>
</table>
<blockquote>
<p>No factory. No warehouse. No truck. <strong>People + resources + delivery system</strong> — that is the service chain.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="19" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>
<h2 id="five-supplier-factors--definition">Five supplier factors — definition</h2>
<p>Every link in a chain is a choice. Businesses weigh <strong>five factors</strong> when choosing suppliers:</p>
<table>
<thead>
<tr>
<th>Factor</th>
<th>Visible?</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Cost</strong></td>
<td>On the price sheet</td>
</tr>
<tr>
<td><strong>Quality</strong></td>
<td>On the price sheet / specs</td>
</tr>
<tr>
<td><strong>Efficiency</strong></td>
<td>On the delivery schedule</td>
</tr>
<tr>
<td><strong>Convenience</strong></td>
<td>On the delivery schedule</td>
</tr>
<tr>
<td><strong>Risk</strong></td>
<td><strong>Hides</strong></td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>Risk is the factor that hides.</strong> Natural disasters, political instability, resource shortages, production errors, and supplier reputation can all delay delivery or raise costs.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="20" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>
<h2 id="five-supplier-factors--in-the-examples">Five supplier factors — in the examples</h2>
<p>The candy seller has two sourcing options — each trades off different factors:</p>
<table>
<thead>
<tr>
<th>Option</th>
<th>Cost</th>
<th>Quality</th>
<th>Efficiency</th>
<th>Convenience</th>
<th>Risk</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Supermarket</strong></td>
<td>Pricier</td>
<td>Same bars</td>
<td>Always stocked</td>
<td>Down the street</td>
<td><strong>Never misses</strong></td>
</tr>
<tr>
<td><strong>Wholesale parent</strong></td>
<td>Cheaper (bulk)</td>
<td>Same bars</td>
<td>Larger quantities</td>
<td>Needs a ride</td>
<td>Van <strong>broke down twice</strong></td>
</tr>
</tbody>
</table>
<blockquote>
<p>Cheap + unreliable vs. pricier + certain — and a Saturday with an <strong>empty cooler earns nothing.</strong></p>
</blockquote>
<p><strong>He splits the order:</strong> the wholesaler carries the bulk, and a supermarket run on Friday night <strong>backstops the risk.</strong></p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="21" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>
<h2 id="supplier-decisions--the-exam-habit">Supplier decisions — the exam habit</h2>
<blockquote>
<p><strong>Every one of the five factors, plus a backup plan, belongs in a supplier answer.</strong></p>
</blockquote>
<p>The exam loves to offer a <strong>cheap option with hidden risk</strong> and ask you to choose. The strong answer:</p>
<ol>
<li>Names <strong>all five factors</strong> — not just cost</li>
<li>Prices in the <strong>risk</strong> — the factor that hides</li>
<li>Mentions a <strong>backup plan</strong></li>
</ol>
<blockquote>
<p><strong>Buying inputs is not outsourcing.</strong> Every producer buys raw materials. The question is always <strong>which</strong> supplier, <strong>why</strong>, and <strong>what happens if they fail.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="22" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>
<h2 id="strategy-shapes-the-chain--definition">Strategy shapes the chain — definition</h2>
<blockquote>
<p>A business's <strong>competitive advantage strategy decides what kind of chain it builds.</strong></p>
</blockquote>
<table>
<thead>
<tr>
<th>Strategy</th>
<th>Chain design</th>
<th>Mechanism</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Low prices</strong></td>
<td>Mass production + cost-cutting (plus or minus scaling)</td>
<td>Cheaper resources, more efficient processes</td>
</tr>
<tr>
<td><strong>High quality</strong></td>
<td>High-quality resources + methods</td>
<td>Better inputs, artisan or mass</td>
</tr>
<tr>
<td><strong>Barriers to entry</strong></td>
<td>Exclusive/restrictive agreements</td>
<td>Lock up suppliers or shelf space</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>The chain itself becomes the source of competitive advantage.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="23" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>
<h2 id="strategy-shapes-the-chain--in-the-examples">Strategy shapes the chain — in the examples</h2>
<table>
<thead>
<tr>
<th>Strategy</th>
<th>At the park</th>
<th>Chain choice</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Cost-tuned</strong></td>
<td>The candy seller buying in bulk from the wholesale parent</td>
<td>Cheaper input, pass savings to buyers</td>
</tr>
<tr>
<td><strong>Quality-tuned</strong></td>
<td>The cookie parent using premium wax for decorating</td>
<td>Better input, commands higher price</td>
</tr>
<tr>
<td><strong>Exclusivity-tuned</strong></td>
<td>The only-vendor permit at the park on Saturdays</td>
<td>Locks out rivals from the same location</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>Name the strategy first, then show how a particular chain choice — a cheaper input, a better input, or a locked-up input — serves exactly that strategy.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="24" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>
<h2 id="the-chain-becomes-the-advantage">The chain becomes the advantage</h2>
<p>Read the three strategies together:</p>
<table>
<thead>
<tr>
<th>Chain type</th>
<th>Advantage it creates</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Cost-tuned</strong></td>
<td>Can support prices rivals struggle to <strong>match</strong></td>
</tr>
<tr>
<td><strong>Quality-tuned</strong></td>
<td>Can produce goods rivals struggle to <strong>imitate</strong></td>
</tr>
<tr>
<td><strong>Exclusivity-tuned</strong></td>
<td>Can leave rivals hunting for <strong>suppliers and shelf space</strong></td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>On the exam, be specific about the mechanism:</strong> name which strategy the business runs, then show how a particular chain choice serves exactly that strategy.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="25" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>
<h2 id="scaling--definition">Scaling — definition</h2>
<p>Some cost-focused businesses go further and <strong>scale:</strong> build higher-capacity chains so that <strong>revenue increases outrun cost increases.</strong></p>
<p><strong>The mechanism:</strong> the second batch reuses the same oven, permits, and order system — the <strong>fixed costs get spread across twice the units</strong> while every unit still sells at full price.</p>
<table>
<thead>
<tr>
<th></th>
<th>Before scaling</th>
<th>After scaling</th>
</tr>
</thead>
<tbody>
<tr>
<td>Units</td>
<td>20,000</td>
<td>40,000</td>
</tr>
<tr>
<td>Revenue</td>
<td>$80,000</td>
<td>$160,000 (+100%)</td>
</tr>
<tr>
<td>Total costs</td>
<td>$60,000</td>
<td>$96,000 (+60%)</td>
</tr>
<tr>
<td><strong>Profit</strong></td>
<td><strong>$20,000</strong></td>
<td><strong>$64,000</strong></td>
</tr>
</tbody>
</table>
<blockquote>
<p>Revenue grew <strong>100%</strong>; costs grew only <strong>60%</strong>. That gap is the entire point of scaling.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="26" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>
<h2 id="scaling--in-the-examples">Scaling — in the examples</h2>
<p>If the snack box <strong>doubled batches</strong> for the same Saturday:</p>
<table>
<thead>
<tr>
<th>What changes</th>
<th>What stays fixed</th>
</tr>
</thead>
<tbody>
<tr>
<td>Inventory cost doubles</td>
<td>The oven (same one, second batch)</td>
</tr>
<tr>
<td>Prep time roughly doubles</td>
<td>The permits (already paid)</td>
</tr>
<tr>
<td></td>
<td>The order system (same group chat)</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>Fixed costs (oven, permits, order system) spread across twice the units.</strong> Each unit still sells at full price — so revenue grows faster than costs.</p>
</blockquote>
<blockquote>
<p><strong>That is the scaling mechanism the exam tests.</strong> Know it as a formula: fixed costs spread, revenue outpaces costs, profit accelerates.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="27" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>
<h2 id="three-question-shapes">Three question shapes</h2>
<p>Chain questions arrive in three shapes:</p>
<table>
<thead>
<tr>
<th>Shape</th>
<th>What it asks</th>
<th>How to answer</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>1. Order the stages</strong></td>
<td>Raw materials to customer</td>
<td>Warehouse comes <strong>after manufacturing, before distribution</strong></td>
</tr>
<tr>
<td><strong>2. Choose a supplier</strong></td>
<td>Weigh the options</td>
<td>Weigh <strong>all five factors</strong>, with <strong>risk priced in</strong></td>
</tr>
<tr>
<td><strong>3. Match strategy to chain</strong></td>
<td>Which design fits</td>
<td>Low price to cost-cutting; quality to better inputs; barriers to exclusive agreements</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>Name the shape first, and the question mostly solves itself.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="28" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>
<h2 id="exam-points-to-remember">Exam points to remember</h2>
<table>
<thead>
<tr>
<th>Concept</th>
<th>Rule</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Production</strong></td>
<td>Artisan (skilled, small) vs. mass production (tech, large) — chosen by customer priorities, competencies, landscape</td>
</tr>
<tr>
<td><strong>Good's chain</strong></td>
<td>Raw materials to manufacturing to warehouse to distribution/retail to customer</td>
</tr>
<tr>
<td><strong>Service chain</strong></td>
<td>People + resources + delivery system (no factory)</td>
</tr>
<tr>
<td><strong>Supplier factors</strong></td>
<td>Cost, quality, efficiency, convenience, <strong>risk</strong> (the one that hides) + backup plan</td>
</tr>
<tr>
<td><strong>Strategy to chain</strong></td>
<td>Low price to cost-cutting; quality to better inputs; barriers to exclusive agreements</td>
</tr>
<tr>
<td><strong>Scaling</strong></td>
<td>Revenue growth outpaces cost growth because fixed costs spread across more units</td>
</tr>
</tbody>
</table>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="29" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>
<h2 id="two-facilities--exam-distinction">Two facilities — exam distinction</h2>
<blockquote>
<p><strong>A warehouse stores. A distribution center stores and forwards.</strong></p>
</blockquote>
<p>The exam will offer both terms in the same question. Sort by <strong>what happens to the goods next:</strong></p>
<ul>
<li>Goods sit until collected = <strong>warehouse</strong></li>
<li>Goods move onward to stores and customers = <strong>distribution center</strong></li>
</ul>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="30" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>
<h2 id="two-intermediaries--exam-distinction">Two intermediaries — exam distinction</h2>
<blockquote>
<p><strong>A supplier feeds production. A distributor feeds retail.</strong></p>
</blockquote>
<p>Sort by <strong>where they sit in the chain:</strong></p>
<ul>
<li>Early in the chain, materials between businesses = <strong>supplier</strong></li>
<li>Between manufacturing and retail, finished products = <strong>distributor</strong></li>
</ul>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="31" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>
<h2 id="service-vs-goods-chains--exam-habit">Service vs. goods chains — exam habit</h2>
<table>
<thead>
<tr>
<th>Signal in the scenario</th>
<th>It is…</th>
</tr>
</thead>
<tbody>
<tr>
<td>Factory, raw materials, warehouse, truck</td>
<td><strong>Goods</strong> supply chain</td>
</tr>
<tr>
<td>Hiring people, acquiring resources, building a delivery system — no factory</td>
<td><strong>Service</strong> supply chain</td>
</tr>
<tr>
<td>&quot;Services cannot have supply chains&quot;</td>
<td><strong>Trap answer</strong> — services absolutely run supply chains</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>The answer to a service supply chain question names three parts: people, resources, and a delivery system.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-class="invert" data-theme="default" class="invert" data-marpit-pagination="32" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--class:invert;--theme:default;" data-marpit-pagination-total="67" data-size="16:9">

<header>AP Business · 1.8 Supply Chains</header>
<h2 id="scenario-a--a-bakery">Scenario A — a bakery</h2>
<p>A bakery buys flour, sugar, and butter from suppliers. Bakers mix and bake in the factory kitchen. Finished loaves cool in a storage room. A delivery truck drops them at grocery stores by 6 AM.</p>
<blockquote>
<p><strong>Goods chain or service chain?</strong> Name the stages or parts.</p>
</blockquote>

<header>AP Business · 1.8 Supply Chains</header>
<h2 id="scenario-b--a-dog-walking-company">Scenario B — a dog-walking company</h2>
<p>A dog-walking company hires trained walkers, equips them with leashes, waste bags, and GPS trackers, and uses a scheduling app to assign routes and send owners live updates.</p>
<blockquote>
<p><strong>Goods chain or service chain?</strong> Name the stages or parts.**</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="35" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>
<h2 id="your-turn--answers">Your turn — answers</h2>
<table>
<thead>
<tr>
<th>Scenario</th>
<th>Chain type</th>
<th>Stages or parts</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>A — Bakery</strong></td>
<td><strong>Goods</strong></td>
<td>Raw materials (flour, sugar, butter) to manufacturing (baking) to warehouse (storage room) to distribution (truck to grocery stores) to customer</td>

<header>AP Business · 1.8 Supply Chains</header>
<h2 id="the-timeline--six-turning-points">The timeline — six turning points</h2>
<table>
<thead>
<tr>
<th>Year</th>
<th>Milestone</th>
<th>1.8 concept</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>1913</strong></td>
<td>Ford's assembly line — 12 hrs to 93 min per car</td>
<td><strong>Mass production + scaling</strong></td>
</tr>
<tr>
<td><strong>1950s</strong></td>
<td>Toyota's just-in-time — no excess inventory</td>
<td><strong>Supplier reliability + efficiency</strong></td>
</tr>
<tr>
<td><strong>1962</strong></td>
<td>Walmart's distribution centers</td>
<td><strong>Warehouse to distribution center</strong></td>
</tr>
<tr>
<td><strong>1990s</strong></td>
<td>Globalization — chains stretch across oceans</td>
<td><strong>Global supply chain + risk</strong></td>
</tr>
<tr>
<td><strong>2000s</strong></td>
<td>Amazon + e-commerce — same-day delivery</td>
<td><strong>Service supply chain</strong></td>
</tr>
<tr>
<td><strong>2020s</strong></td>
<td>COVID + chip shortage — chains break</td>
<td><strong>Risk — the factor that hides</strong></td>
</tr>
</tbody>
</table>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="38" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>
<h2 id="ford-1913--mass-production-and-scaling">Ford (1913) — mass production and scaling</h2>
<p><strong>Ford's assembly line</strong> turned artisan car-making into mass production.</p>
<ul>
<li>Before: one skilled team built an entire car — <strong>12 hours per vehicle</strong></li>
<li>After: each worker performed one task on a moving line — <strong>93 minutes per car</strong></li>
<li>Price dropped from <strong>$850 to $260</strong></li>
</ul>
<blockquote>
<p><strong>Customer priority shifted</strong> from customization (artisan) to <strong>low price</strong> (mass production). The chain was built entirely around <strong>cost-cutting through scale.</strong></p>
</blockquote>
<p><strong>AP connection:</strong> the three inputs (1.8.A) — Ford read customer priorities, matched its competencies to factory production, and exploited a landscape where no rival could match the price.</p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="39" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>
<h2 id="toyota-1950s--just-in-time">Toyota (1950s) — just-in-time</h2>
<p><strong>Toyota's JIT system</strong> synchronized suppliers so precisely that a late part shut down the whole factory.</p>
<ul>
<li>Not bigger — <strong>tighter</strong></li>
<li>Supplier selection prioritized <strong>reliability over cost</strong></li>
<li>The factory held almost no inventory — parts arrived exactly when needed</li>
</ul>
<blockquote>
<p><strong>Which of the five supplier factors</strong> did Toyota prioritize? <strong>Efficiency and reliability</strong> — and when that factor failed, the entire line stopped.</p>
</blockquote>
<p><strong>AP connection:</strong> risk (the factor that hides) plus the need for a <strong>backup plan.</strong> A single late shipment could halt production for a day.</p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="40" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>
<h2 id="walmart-1962--distribution-centers">Walmart (1962) — distribution centers</h2>
<p><strong>Walmart</strong> turned warehouses into distribution centers.</p>
<ul>
<li>A warehouse <strong>stores.</strong> A distribution center <strong>stores and forwards.</strong></li>
<li>This one change cut delivery from <strong>days to hours</strong></li>
<li>Created competitive advantage through <strong>faster delivery at lower cost</strong></li>
</ul>
<blockquote>
<p><strong>The warehouse-to-distribution-center distinction</strong> is not just vocabulary — it is a <strong>strategic choice</strong> that reshapes the entire chain.</p>
</blockquote>
<p><strong>AP connection:</strong> two facilities (1.8.B) — the exam tests whether you can tell them apart. Walmart's advantage came from choosing the right one.</p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="41" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>
<h2 id="globalization-1990s--chains-stretch">Globalization (1990s) — chains stretch</h2>
<p>Supply chains went <strong>global</strong> — raw materials from one country, manufacturing in another, assembly in a third, sale in a fourth.</p>
<ul>
<li><strong>Cost advantage:</strong> labor and materials cheaper overseas</li>
<li><strong>New risk:</strong> one disruption halfway around the world could stop your entire chain</li>
<li>The longer the chain, the <strong>more links can break</strong></li>
</ul>
<blockquote>
<p><strong>The risk was hiding in the length of the chain itself.</strong></p>
</blockquote>
<p><strong>AP connection:</strong> global supply chains are longer and more complex — each stage adds a link that can fail. The five supplier factors apply globally, with <strong>risk amplified by distance.</strong></p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="42" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>
<h2 id="amazon-2000s--the-service-supply-chain">Amazon (2000s) — the service supply chain</h2>
<p><strong>Amazon</strong> turned distribution into a service — and then sold the service itself.</p>
<ul>
<li>Fulfillment centers, delivery fleets, same-day logistics</li>
<li>AWS: the infrastructure <strong>became the product</strong></li>
<li>The supply chain was no longer about <strong>goods</strong> — it was about <strong>people, resources, and a delivery system</strong></li>
</ul>
<blockquote>
<p><strong>The service supply chain</strong> — tutors, lawn-care crews, and now Amazon — runs on the same three parts: people, resources, delivery system.</p>
</blockquote>
<p><strong>AP connection:</strong> service supply chains (1.8.B) — when the scenario describes hiring, equipping, and delivering with no factory, name the three parts.</p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="43" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>
<h2 id="covid-2020s--risk-materializes">COVID (2020s) — risk materializes</h2>
<p><strong>COVID-19</strong> exposed every hidden risk at once:</p>
<ul>
<li>Single-source suppliers in one country = <strong>no backup</strong></li>
<li>Chip shortages halted car production worldwide</li>
<li>Shipping containers sat in the wrong ports</li>
<li>The risk had been hiding <strong>for decades</strong></li>
</ul>
<blockquote>
<p><strong>Every supplier decision should include a backup plan.</strong> The factor that hides eventually shows up — and when it does, chains without a backup stop.</p>
</blockquote>
<p><strong>AP connection:</strong> risk is the factor that hides (1.8.C). COVID was the exam question nobody wanted: &quot;What happens when the risk actually materializes?&quot;</p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="44" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">

<header>AP Business · 1.8 Supply Chains</header>

<h1 id="case-study--huaweis-supply-chain">Case study — Huawei's supply chain</h1>
<p><strong>虎嗅 (Huxiu)</strong> · 370k views · <a href="https://www.bilibili.com/video/BV1tC4y1K7Uy/">B站 link</a></p>
<blockquote>
<p>华为用1566天突破了美国封锁的背后，是长达20年的面壁苦修，和一支牢不可破的&quot;供应铁军。&quot;</p>
</blockquote>
<p>How Huawei survived a <strong>chip ban</strong> by building a supply chain with <strong>10,000+ Chinese suppliers</strong> — and what it teaches about risk, strategy, and chain design.</p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="47" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>
<h2 id="huawei--the-crisis">Huawei — the crisis</h2>
<p>In <strong>2019</strong>, the US government placed Huawei on the <strong>Entity List</strong> — cutting off access to American chip technology overnight.</p>
<ul>
<li>Huawei's smartphones ran on chips it <strong>could no longer buy</strong></li>
<li>Key suppliers (Qualcomm, Google, TSMC) were forced to <strong>stop shipping</strong></li>
<li>The supply chain that looked efficient suddenly had a <strong>single point of failure</strong></li>
</ul>
<blockquote>
<p><strong>Risk — the factor that hides.</strong> For years, Huawei's global supply chain was a strength. Then a <strong>political decision</strong> turned it into a vulnerability overnight.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="48" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>
<h2 id="huawei--the-20-year-preparation">Huawei — the 20-year preparation</h2>
<p>Huawei had been preparing for this moment for <strong>two decades:</strong></p>
<ul>
<li>Over <strong>10,000 Chinese suppliers</strong> in its network — not just chips, but every component</li>
<li><strong>HiSilicon</strong> — Huawei's own chip design subsidiary, built years before the ban</li>
<li>Investment in <strong>domestic manufacturing</strong> partnerships</li>
<li>A strategy of <strong>supply chain self-reliance</strong> long before it was forced</li>
</ul>
<blockquote>
<p><strong>Strategy shapes the chain.</strong> Huawei's strategy was <strong>barriers to entry + self-reliance</strong> — building a chain that could survive without any single foreign supplier.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="49" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="53" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>
<h2 id="stimulus-copper-kettle-candles">Stimulus: Copper Kettle Candles</h2>
<p><strong>Nadia Farouk</strong> owns <strong>Copper Kettle Candles</strong>, pouring small batches by hand with premium wax and charging approximately <strong>twice what machine-made candles cost.</strong> Customers praise the quality and custom scents.</p>
<p>Nadia buys wax from an <strong>overseas supplier</strong> at a price <strong>20% below local</strong> — but <strong>2 of the last 6 shipments arrived weeks late</strong>, and one contained <strong>the wrong blend.</strong></p>
<p>A boutique chain offers a deal: <strong>feature Copper Kettle in 12 stores</strong> if Nadia signs an <strong>exclusive retail rights agreement.</strong></p>
<blockquote>
<p><strong>Watch for three decision points:</strong> production approach, supplier choice, and the exclusive agreement.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="54" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>
<h2 id="q1--classify-production-approach">Q1 — Classify production approach</h2>
<p>Nadia's method of pouring small batches by hand with premium wax is best described as which?</p>
<ul>
<li>A. Mass production, because she sells in multiple locations</li>
<li>B. Artisan production, because she relies on skilled labor and attention to detail in smaller quantities</li>
<li>C. Outsourcing, because she buys wax from an overseas supplier</li>
<li>D. A service supply chain, because she provides custom scents</li>
</ul>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="55" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>
<h2 id="q1--answer-b">Q1 — Answer: <strong>B</strong></h2>
<p><strong>Why:</strong> Artisan production relies on <strong>skilled labor</strong> and close attention to detail, producing <strong>smaller quantities.</strong> Nadia pours by hand, uses premium materials, and makes small batches — every marker points to artisan.</p>
<p><strong>Trap: C</strong> — <strong>buying inputs is not outsourcing.</strong> Every producer buys raw materials. Nadia makes the candles herself; she buys wax the same way a baker buys flour.</p>
<p><strong>Trap: A</strong> — selling in multiple locations does not change the <strong>production method.</strong> She could sell in 100 stores and still be artisan if she pours every candle by hand.</p>
<blockquote>
<p><strong>Classify by how the product is made, not by how many places it is sold.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="56" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>
<h2 id="q2--supplier-decision">Q2 — Supplier decision</h2>
<p>Nadia's overseas wax supplier offers a price 20% below local, but 2 of 6 recent shipments arrived late and one had the wrong blend. Which analysis <strong>best</strong> supports a sound supplier decision?</p>
<ul>
<li>A. Choose the overseas supplier because lower cost always increases profit</li>
<li>B. Choose the local supplier because reliability is the only factor that matters</li>
<li>C. Weigh the lower cost against the risks — including late deliveries, wrong shipments, and potential damage to reputation — and consider a backup plan</li>
<li>D. Choose the overseas supplier because customers will never know about delivery problems</li>
</ul>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="57" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>
<h2 id="q2--answer-c">Q2 — Answer: <strong>C</strong></h2>
<p><strong>Why:</strong> The five supplier factors are cost, quality, efficiency, convenience, and <strong>risk.</strong> The overseas supplier wins on cost but loses on reliability and risk (late deliveries, wrong blend). A sound decision <strong>weighs all five factors</strong> and includes a <strong>backup plan.</strong></p>
<p><strong>Trap: A</strong> — <strong>&quot;always&quot; is an absolute.</strong> Lower cost does not always increase profit if late deliveries cause stockouts and lost customers.</p>
<p><strong>Trap: B</strong> — reliability is one factor, not the <strong>only</strong> factor. The question says &quot;only&quot; — that is as much of a trap as &quot;always.&quot;</p>
<blockquote>
<p><strong>Weigh all five factors, with risk priced in. Name the backup plan.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="58" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>
<h2 id="q3--exclusive-retail-agreement">Q3 — Exclusive retail agreement</h2>
<p>The boutique chain offers to feature Copper Kettle in 12 stores if Nadia signs an exclusive retail rights agreement. This agreement would most directly create competitive advantage through which mechanism?</p>
<ul>
<li>A. Barriers to entry — the exclusive agreement locks up retail shelf space, preventing competitors from accessing those stores</li>
<li>B. Cost leadership — selling in 12 stores reduces per-unit production costs</li>
<li>C. Economies of scale — more stores means Nadia can switch to mass production</li>
<li>D. Guaranteed long-term profits from the partnership</li>
</ul>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="59" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>
<h2 id="q3--answer-a">Q3 — Answer: <strong>A</strong></h2>
<p><strong>Why:</strong> An exclusive retail rights agreement is a <strong>barrier to entry</strong> — it locks up shelf space so competitors cannot access those 12 stores. That is one of the three strategy-to-chain mechanisms the exam tests.</p>
<p><strong>Trap: D</strong> — <strong>&quot;guaranteed&quot; is an absolute.</strong> The deal shifts the odds in Nadia's favor; it guarantees nothing. The boutique chain could drop her line, close stores, or renegotiate.</p>
<p><strong>Trap: C</strong> — selling in 12 stores does not automatically mean Nadia <strong>should</strong> switch to mass production. She is an artisan producer; the agreement gives her <strong>shelf space</strong>, not a factory.</p>
<blockquote>
<p><strong>Exclusive agreements create barriers to entry. They do not guarantee profits.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="60" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>
<h2 id="q4--order-the-supply-chain">Q4 — Order the supply chain</h2>
<p>Which best identifies the order of the supply chain for a mass-produced good, from start to finish?</p>
<ul>
<li>A. Manufacturing, raw materials, retail store, warehouse, customer</li>
<li>B. Raw materials, warehouse, manufacturing, customer, distribution center</li>
<li>C. Distribution center, raw materials, manufacturing, warehouse, customer</li>
<li>D. Raw materials, manufacturing, warehouse, distribution center or retail store, customer</li>
</ul>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="61" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>
<h2 id="q4--answer-d">Q4 — Answer: <strong>D</strong></h2>
<p>The chain runs in one direction:</p>
<blockquote>
<p><strong>Raw materials to manufacturing to warehouse to distribution/retail to customer</strong></p>
</blockquote>
<p><strong>Trap: B</strong> fails twice — it puts the warehouse <strong>before</strong> manufacturing (the warehouse stores <strong>finished</strong> goods), and it ends with a distribution center <strong>after the customer.</strong></p>
<blockquote>
<p><strong>Warehouse comes after manufacturing and before distribution. Never after the customer.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="62" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>
<h2 id="q5--scaling-table">Q5 — Scaling table</h2>
<p><strong>BatchBox Snacks doubled its production scale last year:</strong></p>
<table>
<thead>
<tr>
<th></th>
<th>Before scaling</th>
<th>After scaling</th>
</tr>
</thead>
<tbody>
<tr>
<td>Units</td>
<td>20,000</td>
<td>40,000</td>
</tr>
<tr>
<td>Revenue</td>
<td>$80,000</td>
<td>$160,000</td>
</tr>
<tr>
<td>Total costs</td>
<td>$60,000</td>
<td>$96,000</td>
</tr>
<tr>
<td><strong>Profit</strong></td>
<td><strong>$20,000</strong></td>
<td><strong>$64,000</strong></td>
</tr>
</tbody>
</table>
<p>Which conclusion is <strong>best supported</strong> by the table?</p>
<ul>
<li>A. Scaling failed, because total costs increased by $36,000</li>
<li>B. Scaling succeeded, because revenue grew 100% while costs grew only 60%, raising profit from $20,000 to $64,000</li>
<li>C. Scaling guarantees higher profits every year going forward</li>
<li>D. The business should return to its original scale</li>
</ul>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="63" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>
<h2 id="q5--answer-b">Q5 — Answer: <strong>B</strong></h2>
<p>Compute both growth rates:</p>
<ul>
<li><strong>Revenue:</strong> $80,000 to $160,000 = <strong>+100%</strong></li>
<li><strong>Costs:</strong> $60,000 to $96,000 = <strong>+60%</strong></li>
<li><strong>Profit:</strong> $20,000 to <strong>$64,000</strong> confirms it</li>
</ul>
<p>Revenue growth <strong>outran</strong> cost growth. That is the scaling mechanism.</p>
<p><strong>Trap: A</strong> reads one number and stops — costs rose (as they do when production doubles); the question is whether revenue rose <strong>faster.</strong></p>
<p><strong>Trap: C</strong> converts one good year into a permanent promise — the <strong>&quot;guarantees&quot; alarm</strong> rings here as everywhere.</p>
<blockquote>
<p><strong>Read both growth rates. Compare them. One number alone is never enough.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="64" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>
<h2 id="q6--service-supply-chain">Q6 — Service supply chain</h2>
<p>An <strong>online tutoring company</strong> hires tutors, develops lesson materials, and delivers sessions through a video platform. Which best describes this company's supply chain?</p>
<ul>
<li>A. Raw materials flowing to a manufacturing facility for assembly</li>
<li>B. A warehouse storing finished lessons until customers order them</li>
<li>C. Acquiring tutors, learning resources, and a virtual delivery platform to provide the service</li>
<li>D. Services cannot have supply chains</li>
</ul>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="65" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>
<h2 id="q6--answer-c">Q6 — Answer: <strong>C</strong></h2>
<p>A service supply chain acquires the <strong>employees, the resources, and the delivery systems</strong> needed to provide the service — tutors, materials, and a video platform are those three parts.</p>
<p><strong>Trap: B</strong> borrows the goods chain — warehouses store <strong>physical products</strong>; a tutoring session is <strong>delivered live.</strong></p>
<p><strong>Trap: D</strong> is the misconception this topic exists to correct — <strong>services absolutely run supply chains</strong>, built from people, resources, and delivery systems instead of trucks and pallets.</p>
<blockquote>
<p><strong>When the scenario names hiring, equipping, and delivering — with no factory — it is a service supply chain. The answer names three parts.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="66" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>
<h2 id="trap-patterns-to-watch">Trap patterns to watch</h2>
<table>
<thead>
<tr>
<th>#</th>
<th>Trap</th>
<th>Where</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td><strong>Buying inputs is not outsourcing</strong> — every producer buys raw materials; classify by how the product is <strong>made</strong></td>
<td>Q1</td>
</tr>
<tr>
<td>2</td>
<td><strong>One factor as the whole answer</strong> (cost OR reliability) + <strong>&quot;always&quot;</strong> — weigh all five factors, with risk priced in</td>
<td>Q2</td>
</tr>
<tr>
<td>3</td>
<td><strong>&quot;Guarantee&quot;</strong> in a favorable-deal scenario — deals shift odds, guarantee nothing</td>
<td>Q3</td>
</tr>
<tr>
<td>4</td>
<td><strong>Out-of-order stages</strong> — warehouse after manufacturing, never after customer</td>
<td>Q4</td>
</tr>
<tr>
<td>5</td>
<td><strong>Reading one number and stopping</strong> (costs rose so &quot;failed&quot;) — must compare revenue vs. cost growth</td>
<td>Q5</td>
</tr>
<tr>
<td>6</td>
<td><strong>Permanent promise from one good year</strong> (&quot;guarantees&quot;) — one year is not a pattern</td>
<td>Q5</td>
</tr>
<tr>
<td>7</td>
<td><strong>Borrowing the goods chain for a service</strong> + &quot;services cannot have supply chains&quot; misconception</td>
<td>Q6</td>
</tr>
</tbody>
</table>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="67" data-paginate="true" data-header="AP Business · 1.8 Supply Chains" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-class="lead" data-theme="default" class="lead" data-marpit-pagination="67" style="--paginate:true;--header:AP Business · 1.8 Supply Chains;--footer:Lesson deck — concepts + practice (based on MAMAKO);--class:lead;--theme:default;" data-marpit-pagination-total="67" data-size="16:9">
<header>AP Business · 1.8 Supply Chains</header>

<h2 id="wrap-up">Wrap-up</h2>
<ul>
<li><strong>Artisan</strong> (skilled, small) vs. <strong>mass production</strong> (tech, large) — chosen by customer priorities, competencies, and competitive landscape</li>
<li><strong>Good's chain:</strong> raw materials to manufacturing to warehouse to distribution/retail to customer</li>
<li><strong>Service chain:</strong> people + resources + delivery system (no factory)</li>
<li><strong>Five supplier factors:</strong> cost, quality, efficiency, convenience, <strong>risk</strong> (the one that hides) — plus a backup plan</li>
<li><strong>Strategy shapes the chain:</strong> low price to cost-cutting; quality to better inputs; barriers to exclusive agreements</li>
<li><strong>Scaling:</strong> revenue growth outpaces cost growth because fixed costs spread across more units</li>
<li><strong>The chain itself is where competitive advantage lives</strong></li>
</ul>
<h3 id="next-unit-2--marketing">Next: Unit 2 — Marketing</h3>
<p><em>A kid with a backpack became a business with a supply chain. Now — who exactly is the customer, what do they actually want, and what convinces them to buy?</em></p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
