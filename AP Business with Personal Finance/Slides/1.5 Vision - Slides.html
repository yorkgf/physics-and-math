<header>AP Business · 1.5 Vision</header>
<h2 id="todays-goals">Today's goals</h2>
<p>By the end of this lesson you can:</p>
<ol>
<li>Distinguish between <strong>core values</strong> and <strong>core competencies</strong>, and explain how each shapes business and personal decisions</li>
<li>Evaluate <strong>vision statements</strong> and <strong>mission statements</strong> — and tell them apart</li>
<li>Classify organizations as <strong>businesses</strong>, <strong>social enterprises</strong>, or <strong>nonprofits</strong></li>
</ol>
<p><strong>Running story continues:</strong> the snack box is three weeks old, and <strong>two offers</strong> arrive in the same week that the cash box can't decide between.</p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="3" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="the-two-offers">The two offers</h2>
<p>The snack box has regulars — then one week brings <strong>two offers:</strong></p>
<ol>
<li>A parent offers to <strong>bankroll a candy-only mega cart</strong>: double the inventory, double the margin — but <strong>the fruit the families asked for would have to go</strong></li>
<li>The league asks him to take over the <strong>far field's snack table</strong> — a bigger job that <strong>pays less at first</strong> and runs entirely on trust</li>
</ol>
<p>One pair of hands, one Saturday, two doors.</p>
<blockquote>
<p><strong>Nothing in his cash box answers this</strong>, because it's a decision about <strong>what the business is <em>for</em></strong> and <strong>what it is <em>best at</em></strong> — not about the arithmetic.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="4" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="core-values--definition">Core values — definition</h2>
<p><strong>Core values</strong> = the <strong>defining beliefs and principles</strong> that guide an individual's or a business's actions.</p>
<p>Examples: creativity, excellence, transparency, empathy, reliability.</p>
<p>He writes three on the <strong>lid of his cooler:</strong></p>
<ul>
<li><em>Show up on time</em></li>
<li><em>Listen to the families</em></li>
<li><em>Keep prices fair</em></li>
</ul>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="5" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="why-communicate-core-values">Why communicate core values?</h2>
<p>Businesses communicate core values for <strong>two reasons:</strong></p>
<ol>
<li><strong>Align employees</strong> to a shared purpose</li>
<li><strong>Guide decision makers</strong> toward choices consistent with what the business believes</li>
</ol>
<blockquote>
<p>His cousin helps on Saturdays, and <strong>the cooler lid is how the cousin makes the right call when nobody's watching.</strong> That's the job values do: <strong>turn one person's judgment into the whole team's default.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="6" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="testing-a-stated-value">Testing a stated value</h2>
<p><strong>Run the mega cart past the lid:</strong> double margin, but the fruit goes — and the families asked for that fruit two weeks ago.</p>
<p>The cart <strong>fails &quot;listen to the families&quot; before the math even starts.</strong></p>
<blockquote>
<p><strong>A value the business abandons the first time money appears was a decoration.</strong> Test any stated value by asking: <strong>what did it cost the business at the last real decision?</strong></p>
</blockquote>
<ul>
<li>Transparency → what goes on the label?</li>
<li>Empathy → how a refund is handled?</li>
<li>Excellence → whether a flawed batch ships?</li>
</ul>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="7" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="core-competencies--definition">Core competencies — definition</h2>
<p><strong>Core competencies</strong> = the <strong>capabilities, skills, and expertise</strong> that help an individual or a business <strong>outperform rivals and achieve competitive advantage.</strong></p>
<p>Examples: innovation, customer service, communication, ethical behavior, efficiency.</p>
<p>His list:</p>
<ul>
<li>The <strong>pre-order system</strong> in the group chat (nobody else takes orders before game day)</li>
<li>The <strong>halftime handoff</strong> (one minute per team)</li>
<li>A <strong>reputation for showing up</strong> (carried from the hallway in 1.1)</li>
</ul>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="8" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="core-value-vs-core-competency">Core value vs. core competency</h2>
<p><strong>The pair the exam loves to swap — pin the difference now:</strong></p>
<table>
<thead>
<tr>
<th></th>
<th>Core <strong>value</strong></th>
<th>Core <strong>competency</strong></th>
</tr>
</thead>
<tbody>
<tr>
<td>It is…</td>
<td>what the business <strong>believes</strong></td>
<td>what the business <strong>is good at</strong></td>
</tr>
<tr>
<td>Example</td>
<td>Reliability on the cooler lid (a belief he enforces)</td>
<td>The 60-second handoff (a skill he built)</td>
</tr>
<tr>
<td>Scenario signal</td>
<td>&quot;Believes&quot;</td>
<td>&quot;Good at&quot;</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>A value is what the business <em>believes</em>; a competency is what it is <em>good at</em>.</strong> Speed is a <strong>built skill</strong> → competency.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="9" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="competencies-feed-competitive-advantage">Competencies feed competitive advantage</h2>
<p><strong>Competitive advantage</strong> (from 1.2) = the edge that lets one win customers from a rival.</p>
<p><strong>Core competencies feed that edge.</strong> A differentiated product, a lower cost, a faster service — trace an advantage backward and you usually find <strong>a capability somebody developed.</strong></p>
<blockquote>
<p><strong>Rule of thumb:</strong> pursue the opportunities your <strong>strengths can win</strong>, and spend resources where those strengths <strong>compound.</strong></p>
</blockquote>
<p>The far-field table leans on his logistics + reputation; the mega cart leans mostly on <strong>someone else's money.</strong></p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="10" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="values-and-competencies-for-individuals">Values and competencies for individuals</h2>
<p>The same tool points at <strong>you.</strong> Individuals consider their own core values and core competencies when choosing <strong>educational paths, careers, and jobs.</strong></p>
<ul>
<li>A student who values <strong>independence</strong> and is skilled with <strong>systems</strong> reads one set of options</li>
<li>A student who values <strong>service</strong> and is skilled with <strong>people</strong> reads another</li>
</ul>
<blockquote>
<p><strong>Two job offers:</strong> one pays <strong>20% more</strong> but demands weekend hours that collide with something you refuse to give up; the other pays <strong>less</strong> but builds a skill already on your strengths list.</p>
</blockquote>
<blockquote>
<p><strong>Knowing your list before the offer arrives is the entire advantage.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="11" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="vision-statement--definition">Vision statement — definition</h2>
<p><strong>Vision statement</strong> = a concise description of the <strong>future</strong> the business is trying to create — its <strong>aspirations</strong> and <strong>core values</strong>.</p>
<blockquote>
<p>His vision: <strong>&quot;Game days where no family scrambles.&quot;</strong></p>
</blockquote>
<ul>
<li>Describes <strong>no operations</strong> — just a future worth wanting</li>
<li>The <strong>aspiration</strong>, not the work</li>
</ul>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="12" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="mission-statement--definition">Mission statement — definition</h2>
<p><strong>Mission statement</strong> = describes <strong>what the business does</strong> and <strong>how</strong> it will achieve its long-term goals.</p>
<blockquote>
<p>His mission: <strong>&quot;Deliver pre-ordered snack boxes to every team by halftime, reliably, at prices families can trust.&quot;</strong></p>
</blockquote>
<ul>
<li>Describes <strong>the work</strong> — what it does + how</li>
<li>The <strong>operation</strong>, not the aspiration</li>
</ul>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="13" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="vision-vs-mission--the-test">Vision vs. mission — the test</h2>
<p><strong>Test any statement with one question:</strong> does it describe a <strong>future worth wanting</strong>, or does it describe <strong>the work</strong>?</p>
<table>
<thead>
<tr>
<th></th>
<th><strong>Vision statement</strong></th>
<th><strong>Mission statement</strong></th>
</tr>
</thead>
<tbody>
<tr>
<td>Describes</td>
<td>the <strong>future</strong> the business is trying to create</td>
<td><strong>what the business does</strong> and <strong>how</strong></td>
</tr>
<tr>
<td>In one word</td>
<td>Aspiration</td>
<td>Operation</td>
</tr>
<tr>
<td>Scenario signal</td>
<td>&quot;Aspires&quot; (a future worth wanting)</td>
<td>&quot;Does and how&quot; (the work)</td>
</tr>
</tbody>
</table>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="14" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="classify-by-content--not-by-label">Classify by content — not by label</h2>
<blockquote>
<p><strong>&quot;A city where every student graduates ready&quot;</strong> → no operations, all aspiration → <strong>vision.</strong></p>
<p><strong>&quot;We provide afterschool math tutoring in three neighborhoods, priced by family income&quot;</strong> → what it does + how → <strong>mission.</strong></p>
</blockquote>
<p><strong>The labels are unreliable:</strong> the words &quot;vision&quot; and &quot;mission&quot; rarely appear inside the statements themselves — <strong>classify by content.</strong></p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="15" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="why-vision-and-mission-matter--internally">Why vision and mission matter — internally</h2>
<p>These statements earn their space <strong>twice.</strong> Inside the business:</p>
<ul>
<li>Communicate long-term goals + core values</li>
<li>Guide decision making</li>
<li>Give everyone a shared purpose</li>
</ul>
<blockquote>
<p><strong>The cooler-lid test:</strong> the snack box's vision (&quot;Game days where no family scrambles&quot;) tells the cousin what to do when nobody's watching — that's the internal job.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="16" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="why-vision-and-mission-matter--externally">Why vision and mission matter — externally</h2>
<p>Outside the business, vision and mission statements <strong>earn trust before a single transaction:</strong></p>
<ul>
<li><strong>Customers</strong> read the mission and learn what the business stands for without buying first</li>
<li><strong>Investors and partners</strong> evaluate alignment with their own goals before committing resources</li>
<li><strong>Community members</strong> gauge whether the business shares their values</li>
</ul>
<blockquote>
<p>The mission does the work <strong>before the first sale.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="17" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="vision-and-mission--the-snack-box-test">Vision and mission — the snack box test</h2>
<blockquote>
<p>When the wholesale parent reads the snack box's mission — <em>&quot;Deliver pre-ordered snack boxes to every team by halftime, reliably, at prices families can trust&quot;</em> — <strong>he learns the fruit stays.</strong></p>
</blockquote>
<p>He doesn't need to buy a single bag first. He doesn't need to watch a Saturday.</p>
<p><strong>The statement told him what he needed to know.</strong></p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="18" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="the-external-job--mission-before-the-first-sale">The external job — mission before the first sale</h2>
<blockquote>
<p><strong>That's the external job:</strong> the mission answers the question a customer or partner would otherwise have to ask by experience.</p>
</blockquote>
<p>A parent who reads the mission <strong>knows the fruit stays</strong> — without buying a single bag.<br />
An investor who reads the vision <strong>knows the direction</strong> — without sitting in a single meeting.</p>
<p><strong>The mission does the work before the first transaction.</strong></p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-class="invert" data-theme="default" class="invert" data-marpit-pagination="19" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--class:invert;--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>

<h1 id="case-study--patagonia">Case study — Patagonia</h1>
<p><strong>When a company actually lives its values.</strong></p>
<p><img class="emoji" draggable="false" alt="🎬" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@14.1.2/assets/svg/1f3ac.svg" data-marp-twemoji=""/> <a href="https://www.youtube.com/watch?v=uiGL2UrRvTg">Values Rule — Patagonia</a> · <a href="https://www.youtube.com/watch?v=BapdfqBFw8Y">Mission-Driven Company</a></p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="20" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="patagonia--the-statements">Patagonia — the statements</h2>
<p>Founded 1973 by <strong>Yvon Chouinard</strong> — a climber who built gear for friends.</p>
<table>
<thead>
<tr>
<th>Statement</th>
<th>Content</th>
<th>Type</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Vision</strong></td>
<td><em>&quot;We're in business to save our home planet.&quot;</em></td>
<td>Aspiration — no operations, a future worth wanting</td>
</tr>
<tr>
<td><strong>Mission</strong></td>
<td><em>&quot;Build the best product, cause no unnecessary harm, use business to inspire and implement solutions to the environmental crisis.&quot;</em></td>
<td>What + how — the work itself</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>Run the test:</strong> one sentence describes a <strong>future</strong>; the other describes <strong>the work.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="21" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="patagonia--transparency-tested">Patagonia — transparency tested</h2>
<ul>
<li><strong>Transparency</strong> → published its own supply-chain failures publicly <strong>before anyone asked</strong></li>
</ul>
<p>The company released a report admitting that some suppliers used exploitative labor practices — then published its own plan to fix them. Most companies hide supply-chain problems; Patagonia <strong>volunteered</strong> them.</p>
<blockquote>
<p><strong>The cost:</strong> short-term reputation risk. <strong>The gain:</strong> long-term trust.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="22" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="patagonia--environmental-commitment-tested">Patagonia — environmental commitment tested</h2>
<ul>
<li><strong>Environmental commitment</strong> → ran a full-page ad on Black Friday: <em>&quot;Don't Buy This Jacket&quot;</em> — telling customers to <strong>buy less</strong></li>
</ul>
<p>On the biggest shopping day of the year, Patagonia told consumers <strong>not to buy its products</strong> unless they truly needed them. The ad listed the environmental cost of producing the jacket.</p>
<blockquote>
<p><strong>The cost:</strong> revenue from the biggest sales day of the year. <strong>The gain:</strong> a brand identity no competitor could copy.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="23" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="patagonia--quality-as-a-value">Patagonia — quality as a value</h2>
<ul>
<li><strong>Quality</strong> → offered <strong>free lifetime repairs</strong>, sacrificing repeat purchases</li>
</ul>
<blockquote>
<p>The value said <em>&quot;build things that last&quot;</em> — not <em>&quot;build things that break on schedule so customers come back.&quot;</em></p>
</blockquote>
<p>A jacket that lasts fifteen years <strong>costs Patagonia fifteen years of replacement sales.</strong> The value held anyway.</p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="24" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="the-pattern--values-survived-contact-with-revenue">The pattern — values survived contact with revenue</h2>
<p>Three tests. Three values. <strong>Every one cost money.</strong></p>
<table>
<thead>
<tr>
<th>Value</th>
<th>Decision</th>
<th>Revenue impact</th>
</tr>
</thead>
<tbody>
<tr>
<td>Transparency</td>
<td>Published own supply-chain failures</td>
<td>Short-term reputation risk</td>
</tr>
<tr>
<td>Environmental commitment</td>
<td>&quot;Don't Buy This Jacket&quot; ad</td>
<td>Told customers <strong>not to buy</strong></td>
</tr>
<tr>
<td>Quality</td>
<td>Free lifetime repairs</td>
<td>Sacrificed repeat purchases</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>Test any stated value by asking: what did it cost the business at the last real decision?</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="25" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="the-principle--values-vs-money">The principle — values vs. money</h2>
<blockquote>
<p><strong>A value the business abandons the first time money appears was a decoration.</strong></p>
</blockquote>
<p>Patagonia's values <strong>survived contact with revenue</strong> across every test — transparency, environmental commitment, and quality.</p>
<p><strong>Ask yourself:</strong> does your snack box's cooler-lid list hold up the same way? If a parent offered to double the margin in exchange for cutting the fruit, would <em>&quot;listen to the families&quot;</em> survive?</p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="26" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="patagonia--the-ultimate-test-2022">Patagonia — the ultimate test (2022)</h2>
<p>In September 2022, Chouinard <strong>gave the company away:</strong></p>
<ul>
<li><strong>98%</strong> of shares → Holdfast Collective (<strong>a nonprofit</strong> fighting climate change)</li>
<li><strong>2%</strong> → a trust ensuring the mission is enforced</li>
<li><strong>All future profit</strong> → environmental causes, not owners</li>
</ul>
<blockquote>
<p><em>&quot;Earth is now our only shareholder.&quot;</em></p>
</blockquote>
<p><strong>Ask:</strong> is Patagonia now a <strong>business</strong>, a <strong>social enterprise</strong>, or a <strong>nonprofit</strong>?</p>
<blockquote>
<p><strong>The decision tree:</strong> owners keep profit? → <strong>No</strong> (surplus → mission) → the structure moved <strong>past social enterprise into nonprofit territory</strong> — while the stores still sell jackets.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="27" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="patagonia-vs-seesaw--setup">Patagonia vs. Seesaw — setup</h2>
<p><strong>Two specialty brands. Two relationships with their own vision.</strong></p>
<table>
<thead>
<tr>
<th></th>
<th>Patagonia</th>
<th>Seesaw Coffee</th>
</tr>
</thead>
<tbody>
<tr>
<td>Stated vision</td>
<td><em>&quot;Save our home planet&quot;</em></td>
<td><em>&quot;Bring specialty coffee into everyone's daily life&quot;</em></td>
</tr>
<tr>
<td>Vision connected to business?</td>
<td><strong>Yes</strong> — outdoor gear, supply chain, planet</td>
<td><strong>Started yes</strong> — then chased the 9.9-yuan price war</td>
</tr>
<tr>
<td>Values tested at real decisions?</td>
<td><strong>Yes</strong> — took real revenue hits</td>
<td><strong>No</strong> — sacrificed quality to match Luckin's discounts</td>
</tr>
<tr>
<td>Outcome</td>
<td>Growing; ownership transferred to fight climate change</td>
<td>Bankrupt — closed stores, debts unpaid</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>A vision that guides real decisions is a strategy. A vision that gets abandoned at the first price war is a warning.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-class="invert" data-theme="default" class="invert" data-marpit-pagination="28" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--class:invert;--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>

<h1 id="case-study--seesaw-coffee">Case study — Seesaw Coffee</h1>
<p><strong>What happens when a brand abandons its own vision to chase a price war?</strong></p>
<p><img class="emoji" draggable="false" alt="🎬" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@14.1.2/assets/svg/1f3ac.svg" data-marp-twemoji=""/> <a href="https://www.bilibili.com/video/BV1AHEv6DEAe">Seesaw之后，精品咖啡还剩下什么？</a>（5 min · 解索一线观察）</p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="29" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="seesaw--the-vision">Seesaw — the vision</h2>
<p>Seesaw Coffee was founded in 2012 in Shanghai — one of the <strong>pioneers of China's specialty coffee movement.</strong></p>
<p>Its stated vision:</p>
<blockquote>
<p><em>&quot;Bring specialty coffee into everyone's daily life.&quot;</em></p>
</blockquote>
<p>Core values: <strong>craft, innovation, community</strong> — the brand built its identity around quality beans, skilled baristas, and a curated café experience.</p>
<blockquote>
<p><strong>Run the test:</strong> does this describe a <strong>future worth wanting</strong> or <strong>the work</strong>? It reads like aspiration — a future where specialty coffee is everyday, not premium.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="30" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="seesaw--the-gap">Seesaw — the gap</h2>
<p>The specialty vision worked — until the <strong>9.9-yuan price war</strong> arrived.</p>
<ul>
<li>Luckin Coffee and Cotti flooded the market with <strong>deep-discount coupons</strong> (9.9 yuan per cup)</li>
<li>Seesaw <strong>cut prices and ran its own 9.9 promotions</strong> to keep customers</li>
<li>But specialty beans and trained baristas <strong>cost more than 9.9 yuan per cup</strong> — every discounted sale was a <strong>loss</strong></li>
<li>The brand that stood for <strong>craft</strong> was now competing on <strong>price</strong> — a war it could not win</li>
</ul>
<blockquote>
<p><strong>A value the business abandons the first time money appears was a decoration.</strong> Seesaw's core value of &quot;craft&quot; was discarded the moment the price war started.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="31" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="seesaw--the-result">Seesaw — the result</h2>
<table>
<thead>
<tr>
<th>Year</th>
<th>Event</th>
</tr>
</thead>
<tbody>
<tr>
<td>2012</td>
<td>Founded in Shanghai — specialty coffee pioneer</td>
</tr>
<tr>
<td>2017–2021</td>
<td>VC-funded expansion; stores in major cities across China</td>
</tr>
<tr>
<td>2023–2024</td>
<td>Price war with Luckin/Cotti; 9.9-yuan promotions erode margins</td>
</tr>
<tr>
<td>2024–2025</td>
<td>Mass store closures; debts unpaid; <strong>bankruptcy</strong></td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>The vision could not survive the first competitive shock because the business stopped acting on it.</strong> When the price war arrived, &quot;craft&quot; was the first thing to go — and the brand followed.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="32" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="seesaw--discussion">Seesaw — discussion</h2>
<p><strong>Pair up. 2 minutes.</strong></p>
<ol>
<li>Classify Seesaw's <em>&quot;Bring specialty coffee into everyone's daily life&quot;</em> — vision or mission? <strong>Why?</strong></li>
<li>Seesaw's value was <strong>craft</strong>. At what point did the business <strong>stop testing that value at real decisions</strong>? What did the 9.9-yuan promotion tell customers?</li>
<li>How is Seesaw's outcome <strong>different</strong> from Patagonia's? Both faced pressure to compromise — what made the difference?</li>
</ol>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-class="invert" data-theme="default" class="invert" data-marpit-pagination="33" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--class:invert;--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>

<p><strong>Classify the statement → explain why.</strong></p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="34" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="three-kinds-of-organizations--for-profit">Three kinds of organizations — for-profit</h2>
<p>Both seek profit. <strong>The difference is what else they do.</strong></p>
<table>
<thead>
<tr>
<th>Type</th>
<th>Purpose</th>
<th>Profit?</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Business</strong></td>
<td>Achieve and increase profits, remain competitive and viable</td>
<td>Owners keep or reinvest</td>
</tr>
<tr>
<td><strong>Social enterprise</strong></td>
<td>Profit <strong>plus</strong> a built-in social objective</td>
<td>Owners keep profit</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>The decision tree, step 2:</strong> if owners <strong>can</strong> keep profit → look for a social objective built into the products, operations, or financial model. <strong>Find one</strong> → social enterprise. <strong>Find none</strong> → business.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="35" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="three-kinds-of-organizations--nonprofit">Three kinds of organizations — nonprofit</h2>
<table>
<thead>
<tr>
<th>Type</th>
<th>Purpose</th>
<th>Profit?</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Nonprofit</strong></td>
<td>Serve the public good</td>
<td>Surplus <strong>must</strong> be reinvested; <strong>no payment to owners</strong></td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>The decision tree, step 1:</strong> can owners keep the profit at all? If <strong>no</strong> — every surplus feeds the mission → <strong>nonprofit.</strong></p>
</blockquote>
<p><strong>Surplus reinvestment is the legal signature of a nonprofit.</strong> A nonprofit <em>can</em> sell goods, and revenues <em>can</em> exceed costs — but <strong>none of the surplus may flow to an owner.</strong></p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="36" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="business--definition">Business — definition</h2>
<p>A <strong>business</strong> seeks to <strong>achieve and increase profits</strong>, fulfill its stated mission/goals, and <strong>remain competitive and viable</strong> long-term.</p>
<p>Profit improves in exactly <strong>two ways:</strong></p>
<ul>
<li><strong>Increase revenues</strong></li>
<li><strong>Decrease costs</strong></li>
</ul>
<blockquote>
<p>That's the <strong>revenue − cost</strong> arithmetic from 1.1, now running a whole organization.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="37" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="social-enterprise--definition">Social enterprise — definition</h2>
<p>A <strong>social enterprise</strong> seeks <strong>profit while also, by design, achieving social objectives.</strong></p>
<p>Impact travels through <strong>three channels:</strong></p>
<table>
<thead>
<tr>
<th>Channel</th>
<th>Example</th>
</tr>
</thead>
<tbody>
<tr>
<td>The <strong>products</strong> themselves</td>
<td>A company whose product is a low-cost water filter</td>
</tr>
<tr>
<td><strong>Operations</strong></td>
<td>A moving company that hires workers other employers overlook</td>
</tr>
<tr>
<td>The <strong>financial model</strong></td>
<td>A brand that routes a share of every sale to a local scholarship fund</td>
</tr>
</tbody>
</table>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="38" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="nonprofit-organization--definition">Nonprofit organization — definition</h2>
<p>A <strong>nonprofit</strong> serves the <strong>public good</strong> rather than generating profit for owners.</p>
<blockquote>
<p><strong>Mark the precision — the exam tests the edges:</strong> a nonprofit <strong>can</strong> sell goods and services, and its revenues <strong>can</strong> exceed its costs. The law draws <strong>one hard line: any surplus must be reinvested in the organization, and none of it may flow to owners.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="39" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="nonprofit-revenue-sources">Nonprofit revenue sources</h2>
<p>Nonprofits raise funds through channels that <strong>don't require a sale:</strong></p>
<ul>
<li><strong>Grant</strong> = funding awarded for a stated purpose, usually by a government or foundation; earned <strong>by application, not by sale</strong></li>
<li><strong>Donations</strong> arrive with <strong>no product attached</strong></li>
<li><strong>Volunteers</strong> lower the <strong>labor</strong> side of the cost ledger</li>
</ul>
<blockquote>
<p><strong>Surplus reinvestment is the legal signature of a nonprofit.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="40" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="the-organization-decision-tree">The organization decision tree</h2>
<p><strong>Ask two questions in order:</strong></p>
<ol>
<li><strong>Can owners keep the profit at all?</strong>
<ul>
<li>If <strong>no</strong> (every surplus feeds the mission) → <strong>nonprofit</strong></li>
</ul>
</li>
<li>If <strong>yes</strong> → look for a <strong>social objective</strong> built into the products, operations, or financial model:
<ul>
<li><strong>Find one</strong> → social enterprise</li>
<li><strong>Find none</strong> → business</li>
</ul>
</li>
</ol>
<blockquote>
<p><strong>Surplus reinvestment is the legal signature of a nonprofit.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="41" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="all-three-at-the-park-on-saturday">All three at the park on Saturday</h2>
<table>
<thead>
<tr>
<th>Who</th>
<th>Type</th>
<th>Why</th>
</tr>
</thead>
<tbody>
<tr>
<td>His snack box</td>
<td><strong>Business</strong></td>
<td>Profit is his to keep or reinvest</td>
</tr>
<tr>
<td>The league itself</td>
<td><strong>Nonprofit</strong></td>
<td>Registration fees + bake-sale table fund uniforms and goals; surplus buys nets, never a payout</td>
</tr>
<tr>
<td>Parent floating a drink stand, donating half its profit to field-repair</td>
<td><strong>Social enterprise</strong></td>
<td>Profit-seeking + a built-in social objective</td>
</tr>
</tbody>
</table>
<blockquote>
<p>Same park, three different answers to <strong>whom the gains ultimately serve.</strong></p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="42" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="the-classification-tells--exam-habit">The classification tells — exam habit</h2>
<p>This is a <strong>classification topic</strong> — collect the tells:</p>
<table>
<thead>
<tr>
<th>Signal in the scenario</th>
<th>Points to</th>
</tr>
</thead>
<tbody>
<tr>
<td>&quot;Believes&quot;</td>
<td>Core <strong>value</strong></td>
</tr>
<tr>
<td>&quot;Good at&quot;</td>
<td>Core <strong>competency</strong></td>
</tr>
<tr>
<td>&quot;Aspires&quot; (a future worth wanting)</td>
<td><strong>Vision</strong></td>
</tr>
<tr>
<td>&quot;Does and how&quot; (the work)</td>
<td><strong>Mission</strong></td>
</tr>
<tr>
<td>Owners keep profit, no social objective</td>
<td><strong>Business</strong></td>
</tr>
<tr>
<td>Owners keep profit + built-in social objective</td>
<td><strong>Social enterprise</strong></td>
</tr>
<tr>
<td>No owner keeps surplus; surplus → mission</td>
<td><strong>Nonprofit</strong></td>
</tr>
</tbody>
</table>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-class="invert" data-theme="default" class="invert" data-marpit-pagination="43" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--class:invert;--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>

<h1 id="practice--6-questions">Practice — 6 questions</h1>
<p><strong>3 on one stimulus (Bright Thread)</strong> · <strong>3 standalone</strong></p>
<p>Read → pause → <strong>commit to an answer</strong> → then reveal.</p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="44" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="stimulus-bright-thread">Stimulus: Bright Thread</h2>
<p><strong>Rosa Delgado</strong> owns <strong>Bright Thread</strong>, a clothing alteration and repair shop. Posted <strong>core values:</strong> craftsmanship, honesty, community. Bright Thread is known across the neighborhood for the <strong>fastest turnaround of any tailor</strong> — a strength built on Rosa's <strong>custom scheduling system.</strong> Two framed statements hang by the register:</p>
<ol>
<li><em>&quot;Clothing that lasts, in a neighborhood that thrives.&quot;</em></li>
<li><em>&quot;Bright Thread repairs and alters clothing with same-week service at prices working families can afford.&quot;</em></li>
</ol>
<p>Rosa is weighing two expansions: (1) <strong>reselling inexpensive imported garments she has not inspected</strong> at a high markup, or (2) <strong>launching a same-day uniform repair service</strong> for local businesses.</p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="45" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="q1--classify-the-fastest-turnaround">Q1 — Classify the fastest turnaround</h2>
<p>Bright Thread's fastest-in-the-neighborhood turnaround is best classified as which?</p>
<ul>
<li>A. A core value</li>
<li>B. A vision statement</li>
<li>C. A social objective</li>
<li>D. A core competency</li>
</ul>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="46" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="q1--answer-d">Q1 — Answer: <strong>D</strong></h2>
<p><strong>Why:</strong> Core competencies are capabilities/skills/expertise that help a business <strong>outperform rivals</strong> and achieve competitive advantage. Fastest turnaround is a capability with the <strong>rival comparison built right into the phrase</strong>, resting on a specific skill — Rosa's scheduling system.</p>
<p><strong>Trap: A</strong> — the <strong>paired-concept swap</strong> for this topic. Core <strong>values</strong> are beliefs/principles (the craftsmanship, honesty, community posted on the wall).</p>
<blockquote>
<p><strong>A value is what the business <em>believes</em>; a competency is what it is <em>good at</em>.</strong> Speed here is a <strong>built skill</strong> → competency.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="47" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="q2--how-values--competencies-should-guide-the-choice">Q2 — How values + competencies should guide the choice</h2>
<p>Which best explains how Rosa's core values and core competencies should influence her choice between the two expansions?</p>
<ul>
<li>A. Choose the resale option, because higher markups increase profit fastest</li>
<li>B. Favor the option that aligns with her values and uses her existing strengths — the same-day uniform service</li>
<li>C. Pursue both options, because businesses grow by accepting every opportunity</li>
<li>D. Core values apply only to employees, so they shouldn't affect an owner's decision</li>
</ul>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="48" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="q2--answer-b">Q2 — Answer: <strong>B</strong></h2>
<p><strong>Why:</strong> Businesses consider core competencies when deciding which opportunities to pursue and how to allocate resources, and choose actions <strong>consistent with their values.</strong> The uniform service runs directly on her speed + scheduling system <strong>and</strong> serves the community her values name; reselling uninspected garments strains craftsmanship + honesty while using <strong>none</strong> of her strengths.</p>
<p><strong>Trap: A</strong> — high-margin move that abandons strengths/values <strong>risks the reputation the profits depend on.</strong></p>
<p><strong>Trap: C</strong> — one shop cannot fund and staff every opportunity; <strong>choosing well is the entire skill being tested.</strong></p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="49" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="q3--classify-statement-1">Q3 — Classify statement 1</h2>
<p>The first framed statement — <em>&quot;clothing that lasts, in a neighborhood that thrives&quot;</em> — is best classified as which?</p>
<ul>
<li>A. A vision statement, because it expresses the shop's values and aspirations</li>
<li>B. A mission statement, because it describes the shop's daily operations</li>
<li>C. A code of conduct for employees</li>
<li>D. A business hypothesis to be tested</li>
</ul>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="50" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="q3--answer-a">Q3 — Answer: <strong>A</strong></h2>
<p><strong>Why:</strong> A vision statement is a concise description of <strong>core values and aspirations</strong> — this names <strong>a future the shop wants to exist</strong> (durable clothing, thriving neighborhood) and describes <strong>no operations.</strong></p>
<p><strong>Trap: B</strong> — the <strong>vision-mission swap.</strong> Statement 2 is the <strong>mission:</strong> what it does — repairs/alterations — and how — same-week service at fair prices.</p>
<blockquote>
<p><strong>Run the test:</strong> a <strong>future worth wanting</strong> = vision; a <strong>description of the work</strong> = mission.</p>
</blockquote>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="51" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="q4--why-communicate-core-values">Q4 — Why communicate core values?</h2>
<p>Which best explains why businesses communicate core values to their employees?</p>
<ul>
<li>A. To <strong>guarantee</strong> that no employee ever behaves unethically</li>
<li>B. To increase revenue in the following quarter</li>
<li>C. To align employees to a shared purpose and guide decisions consistent with the business's beliefs</li>
<li>D. To satisfy a legal requirement that businesses publish their values</li>
</ul>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="52" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="q4--answer-c">Q4 — Answer: <strong>C</strong></h2>
<p><strong>Why:</strong> Businesses communicate core values to <strong>align employees</strong> to a shared purpose and <strong>guide decision makers</strong> toward choices consistent with the business's beliefs.</p>
<p><strong>Trap: A</strong> — <strong>&quot;guarantee&quot;</strong> is an absolute. Values <strong>guide</strong> choices; <strong>no statement on a wall guarantees behavior.</strong></p>
<p><strong>Trap: D</strong> — borrows <strong>legal-factor thinking from Topic 1.3</strong> — no law requires a business to publish core values.</p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="53" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="q5--reading-a-financial-table">Q5 — Reading a financial table</h2>
<p><strong>Harbor Kitchen's year in numbers:</strong></p>
<table>
<thead>
<tr>
<th>Line item</th>
<th>Amount</th>
</tr>
</thead>
<tbody>
<tr>
<td>Revenue from meal sales</td>
<td>$180,000</td>
</tr>
<tr>
<td>Grant funding</td>
<td>$60,000</td>
</tr>
<tr>
<td>Donations</td>
<td>$40,000</td>
</tr>
<tr>
<td>Total costs</td>
<td>$250,000</td>
</tr>
</tbody>
</table>
<p><em>Study the numbers. What moved? What didn't?</em></p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="54" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="q5--what-does-the-data-support">Q5 — What does the data support?</h2>
<p>The <strong>$30,000 surplus</strong> was spent expanding the organization's <strong>free cooking classes</strong>, and <strong>no payment went to any owner.</strong> Based on the table, Harbor Kitchen is best classified as which?</p>
<ul>
<li>A. A traditional business, because it earns revenue from selling meals</li>
<li>B. A nonprofit organization, because its surplus is reinvested in its mission and it relies partly on grants and donations</li>
<li>C. A social enterprise, because it sells meals and offers free classes</li>
<li>D. A failing organization, because its costs exceeded its sales revenue</li>
</ul>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="55" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="q5--answer-b">Q5 — Answer: <strong>B</strong></h2>
<p><strong>Why:</strong> Every marker points the same direction: <strong>grants and donations</strong> alongside sales revenue, the surplus went <strong>back into the mission</strong>, and <strong>no owner received a payment.</strong></p>
<blockquote>
<p><strong>Surplus reinvestment is the legal signature of a nonprofit.</strong></p>
</blockquote>
<p><strong>Trap: C</strong> — the tell is the <strong>destination of the money:</strong> a social enterprise seeks profit <strong>for its owners</strong> alongside social objectives; Harbor Kitchen pays <strong>no owner anything.</strong></p>
<p><strong>Trap: D</strong> — reads one row and stops: sales alone fall short of costs, but <strong>total revenue is $280,000 against $250,000</strong> = a $30,000 surplus. <strong>A nonprofit running a surplus is healthy, legal, and common.</strong></p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="56" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="q6--social-enterprise-vs-traditional-business">Q6 — Social enterprise vs. traditional business</h2>
<p>Which best distinguishes a social enterprise from a traditional business?</p>
<ul>
<li>A. A social enterprise intentionally pursues social objectives through its products, operations, or financial model while still seeking profit</li>
<li>B. A social enterprise is legally required to reinvest all surplus funds into the organization</li>
<li>C. A social enterprise must be owned by a charity</li>
<li>D. A social enterprise <strong>always</strong> donates the <strong>majority</strong> of its profits</li>
</ul>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="57" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="q6--answer-a">Q6 — Answer: <strong>A</strong></h2>
<p><strong>Why:</strong> A social enterprise seeks profit while also achieving social objectives; impact travels through <strong>three channels:</strong> products, operations, or financial model.</p>
<p><strong>Trap: B</strong> — borrows the <strong>nonprofit's legal rule.</strong> Reinvestment of <strong>all</strong> surplus defines nonprofits; social enterprises <strong>keep real profit.</strong></p>
<p><strong>Trap: D</strong> — fails on <strong>&quot;always&quot;</strong> and <strong>&quot;majority&quot;</strong> — a fixed donation share is <strong>one possible</strong> financial model, and nothing about the category requires it.</p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-theme="default" data-marpit-pagination="58" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>
<h2 id="trap-patterns-to-watch">Trap patterns to watch</h2>
<table>
<thead>
<tr>
<th>#</th>
<th>Trap</th>
<th>Where</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td><strong>Paired-concept swap:</strong> core value (believes) vs. core competency (good at)</td>
<td>Q1</td>
</tr>
<tr>
<td>2</td>
<td>High-margin move that abandons strengths/values <strong>risks reputation</strong></td>
<td>Q2</td>
</tr>
<tr>
<td>3</td>
<td><strong>Vision-mission swap:</strong> a future worth wanting vs. a description of the work</td>
<td>Q3</td>
</tr>
<tr>
<td>4</td>
<td><strong>&quot;Guarantee&quot;</strong> — absolutes still apply</td>
<td>Q4</td>
</tr>
<tr>
<td>5</td>
<td><strong>Nonprofit vs. social enterprise:</strong> the tell is the <strong>destination of the money</strong></td>
<td>Q5</td>
</tr>
<tr>
<td>6</td>
<td><strong>Reading one row and stopping:</strong> sum ALL revenue (sales + grants + donations)</td>
<td>Q5</td>
</tr>
<tr>
<td>7</td>
<td><strong>Neighboring-concept trap:</strong> reusing the nonprofit rule for a social enterprise</td>
<td>Q6</td>
</tr>
</tbody>
</table>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-header="AP Business · 1.5 Vision" data-footer="Lesson deck — concepts + practice (based on MAMAKO)" data-class="lead" data-theme="default" class="lead" data-marpit-pagination="59" style="--paginate:true;--header:AP Business · 1.5 Vision;--footer:Lesson deck — concepts + practice (based on MAMAKO);--class:lead;--theme:default;" data-marpit-pagination-total="59" data-size="16:9">
<header>AP Business · 1.5 Vision</header>

<h2 id="wrap-up">Wrap-up</h2>
<ul>
<li><strong>Core values</strong> = what the business <strong>believes</strong>; <strong>core competencies</strong> = what it is <strong>good at</strong></li>
<li><strong>Test a stated value</strong> by what it cost at the last real decision</li>
<li><strong>Competencies feed competitive advantage</strong> — pursue opportunities your strengths can win</li>
<li><strong>Vision</strong> = the <strong>future</strong> worth wanting; <strong>Mission</strong> = <strong>what</strong> it does and <strong>how</strong></li>
<li><strong>Classify by content</strong>, not by the label on the document</li>
<li><strong>Three organization types:</strong> business (owners keep profit), social enterprise (profit + social objective), nonprofit (surplus → mission, no owner payment)</li>
<li><strong>Organization decision tree:</strong> owners keep profit? → No = nonprofit; Yes → social objective = social enterprise; else = business</li>
</ul>
<h3 id="next-16-business-ethics">Next: 1.6 Business Ethics</h3>
<p><em>The profitable move and the right move point in different directions. What happens then?</em></p>
<footer>Lesson deck — concepts + practice (based on MAMAKO)</footer>
